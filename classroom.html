<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#05070d">
    
    <title>TicBull Academy - My Classroom</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --bg: #05070d; --card: #101827; --card-grad: linear-gradient(145deg, #152238, #0f1929); 
            --accent: #e9155c; --text: #f5f7fb; --text-muted: #9aa7ba; --border: #2b3952; 
            --success: #10b981; --danger: #ef4444; --gold: #ffb51b; 
        }

        body.light-theme {
            --bg: #f3f4f6; --card: #ffffff; --card-grad: linear-gradient(145deg, #ffffff, #f9fafb); 
            --text: #111827; --text-muted: #6b7280; --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; overscroll-behavior-y: none; }

        .header { padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); background: var(--bg); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 20; }
        .back-btn { background: transparent; border: none; color: var(--text); font-size: 20px; cursor: pointer; }
        .title { font-size: 22px; font-weight: 900; }
        .score-board { margin-left: auto; background: rgba(16, 185, 129, 0.15); color: var(--success); padding: 6px 12px; border-radius: 10px; font-weight: 900; display: none; border: 1px solid rgba(16, 185, 129, 0.3); }

        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 80px; }

        #batchView, #subjectView, #actionView, #testSetupView, #testActiveView { display: none; }
        #batchView { display: block; }

        .batch-card { background: var(--card-grad); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .batch-name { font-size: 20px; font-weight: 900; margin-bottom: 5px; line-height: 1.3; }
        .btn-access { background: var(--accent); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 900; margin-top: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .sub-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 10px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .sub-card:active { transform: scale(0.95); border-color: var(--accent); }
        .sub-icon { font-size: 32px; display: block; }
        .sub-name { font-size: 14px; font-weight: 800; color: var(--text); }

        .action-card { background: var(--card-grad); border: 1px solid var(--border); border-radius: 18px; padding: 25px 15px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .action-card i { font-size: 35px; }
        .action-card.chat { color: #3b82f6; border-color: rgba(59, 130, 246, 0.3); }
        .action-card.pyq { color: var(--gold); border-color: rgba(255, 181, 27, 0.3); }
        .action-card.prac { color: #a855f7; border-color: rgba(168, 85, 247, 0.3); }
        .action-card.test { color: var(--accent); border-color: rgba(233, 21, 92, 0.3); }
        .action-name { font-weight: 900; font-size: 15px; color: var(--text); }

        .setup-box { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 18px; }
        .input-chap { width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 15px; border-radius: 12px; color: var(--text); font-size: 16px; outline: none; margin: 15px 0; }
        
        .diff-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 15px 0; }
        .diff-btn { background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 8px; color: var(--text); cursor: pointer; font-weight: 800; }
        .diff-btn.active { border-color: var(--accent); background: rgba(233, 21, 92, 0.1); }

        .timer-bar { height: 6px; background: var(--border); border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
        .timer-fill { height: 100%; width: 100%; background: var(--success); transition: width 1s linear, background 0.3s; }
        .timer-fill.danger { background: var(--danger); }
        .timer-text { font-size: 24px; font-weight: 900; text-align: center; margin-bottom: 10px; color: var(--gold); }

        .question-box { font-size: 18px; font-weight: 800; line-height: 1.5; margin-bottom: 25px; }
        .option { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; margin-bottom: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
        .option.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: var(--success); }
        .option.wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: var(--danger); }
        .option.disabled { pointer-events: none; opacity: 0.8; }
        .btn-next { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 900; width: 100%; font-size: 16px; margin-top: 20px; cursor: pointer; display: none; }

        .tic-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 999; backdrop-filter: blur(5px); }
        .tic-box { background: var(--card); padding: 25px; border-radius: 20px; text-align: center; width: 85%; max-width: 350px; border: 1px solid var(--border); box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .tic-btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 10px; margin: 5px; cursor: pointer; font-weight: 900; width: 45%; }
        .tic-btn-cancel { background: var(--border); color: var(--text); border: none; padding: 12px 20px; border-radius: 10px; margin: 5px; cursor: pointer; font-weight: 900; width: 45%; }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="title" id="headTitle">My Classroom</div>
        <div class="score-board" id="scoreBoard">Score: 0</div>
    </div>

    <div class="content">
        <div id="batchView"></div>
        <div id="subjectView">
            <h3 style="color: var(--text-muted); margin-bottom: 10px;">Select Subject to Study</h3>
            <div class="grid-2" id="subjectGrid"></div>
        </div>
        <div id="actionView">
            <h3 style="margin-bottom: 5px; color: var(--gold); font-size:22px;" id="selectedSubTitle">Subject</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">Select your learning mode below.</p>
            <div class="grid-2">
                <div class="action-card chat" onclick="openMode('chat.html')">
                    <i class="fa-solid fa-robot"></i><div class="action-name">Ask AI Teacher</div>
                </div>
                <div class="action-card prac" onclick="openMode('practice.html')">
                    <i class="fa-solid fa-pen-nib"></i><div class="action-name">Practice Sets</div>
                </div>
                <div class="action-card pyq" onclick="openMode('pyqs.html')">
                    <i class="fa-solid fa-file-pdf"></i><div class="action-name">20 Yrs PYQs</div>
                </div>
                <div class="action-card test" onclick="showTestSetup()">
                    <i class="fa-solid fa-bolt"></i><div class="action-name">AI Smart Test</div>
                </div>
            </div>
        </div>
        <div id="testSetupView">
            <div class="setup-box">
                <h2 style="color: var(--accent); margin-bottom: 5px;"><i class="fa-solid fa-brain"></i> AI Test Series</h2>
                <p style="color: var(--text-muted); font-size: 13px;">Enter a chapter name from <strong style="color:var(--text)" id="testSubName"></strong>.</p>
                <p style="font-size:12px; color:var(--text-muted); margin-top:15px; margin-bottom:5px;">Select Difficulty Level:</p>
                <div class="diff-grid">
                    <button class="diff-btn" onclick="setDiff(this, 'easy')">Easy</button>
                    <button class="diff-btn active" onclick="setDiff(this, 'normal')" id="defaultDiff">Normal</button>
                    <button class="diff-btn" onclick="setDiff(this, 'hard')">Hard</button>
                </div>
                <input type="text" id="chapInput" class="input-chap" placeholder="Enter Chapter Name">
                <button class="btn-access" onclick="startTest()">START UNLIMITED TEST <i class="fa-solid fa-play"></i></button>
            </div>
        </div>
        <div id="testActiveView">
            <div class="timer-text" id="timerText">00:15</div>
            <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
            <div class="question-box" id="qText">Generating Question via AI...</div>
            <div id="optionsBox"></div>
            <button class="btn-next" id="btnNext" onclick="generateQuestion()">NEXT QUESTION <i class="fa-solid fa-forward"></i></button>
        </div>
    </div>

    <div id="ticModal" class="tic-modal">
        <div class="tic-box">
            <h3 id="ticModalMsg" style="font-size:17px; margin-bottom:15px; line-height:1.4;">Message</h3>
            <div>
                <button class="tic-btn" id="ticModalYes">OK</button>
                <button class="tic-btn-cancel" id="ticModalNo">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Theme Sync (Sound hata diya gaya hai)
        if(localStorage.getItem('tb_theme') === 'light') {
            document.body.classList.add('light-theme');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f4f6');
        }

        function showTicModal(msg, onYes, showCancel = true) {
            document.getElementById('ticModalMsg').innerText = msg;
            document.getElementById('ticModal').style.display = 'flex';
            document.getElementById('ticModalNo').style.display = showCancel ? 'inline-block' : 'none';
            document.getElementById('ticModalYes').onclick = function() {
                document.getElementById('ticModal').style.display = 'none';
                if(onYes) onYes();
            };
            document.getElementById('ticModalNo').onclick = function() {
                document.getElementById('ticModal').style.display = 'none';
            };
        }

        let viewState = 1, currentSubject = "", currentChapter = "", selectedDiff = "normal", currentBatchIndex = 0, enrolled = [];
        let score = 0, timer = 15, timerInterval, qCount = 1, isAnswered = false;

        const icons = {
            "English":"📘", "Physics":"⚛️", "Physical Chemistry":"⚗️", "Organic Chemistry":"🧬", 
            "Inorganic Chemistry":"🔬", "Mathematics":"🔢", "Biology":"🧬", "Botany":"🌱", 
            "Zoology":"🦁", "Chemistry":"🧪", "Hindi":"📖", "Accountancy":"🧾", 
            "Business Studies":"💼", "Economics":"📈", "History":"🏛️", "Geography":"🌍", 
            "Political Science":"⚖️", "Science":"🔬", "Social Science":"🌍"
        };

        window.onload = function() {
            try { enrolled = JSON.parse(localStorage.getItem('tb_enrolled') || '[]'); } catch(e) { enrolled = []; }
            renderBatches();
        };

        function renderBatches() {
            let container = document.getElementById('batchView');
            container.innerHTML = '';
            
            if(!enrolled || enrolled.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:50px;">No batches found.<br>Go to batches and buy one first.</div>`;
                return;
            }

            enrolled.forEach((b, index) => {
                container.innerHTML += `
                    <div class="batch-card">
                        <div style="color:var(--success); font-size:12px; font-weight:800; margin-bottom:5px;"><i class="fa-solid fa-circle-check"></i> Premium Access</div>
                        <div class="batch-name">${b.title}</div>
                        <button class="btn-access" onclick="showSubjects(${index})">OPEN CLASSROOM <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                `;
            });
            hideAllViews();
            container.style.display = 'block';
            viewState = 1;
            document.getElementById('headTitle').innerText = "My Classroom";
        }

        function showSubjects(batchIndex) {
            currentBatchIndex = batchIndex;
            let batch = enrolled[batchIndex];
            let subjects = [];

            // 100% PURE DYNAMIC LOGIC - NO HARDCODING
            if (batch && batch.subjects) {
                if (Array.isArray(batch.subjects)) {
                    subjects = batch.subjects;
                } else if (typeof batch.subjects === 'string') {
                    try {
                        subjects = JSON.parse(batch.subjects);
                    } catch(e) {
                        subjects = batch.subjects.split(',').map(s => s.trim());
                    }
                }
            }

            let grid = document.getElementById('subjectGrid');
            grid.innerHTML = '';

            if (subjects && subjects.length > 0) {
                subjects.forEach(subject => {
                    let iconStr = icons[subject] || "📚"; 
                    grid.innerHTML += `
                        <div class="sub-card" onclick="openActionView('${subject}')">
                            <span class="sub-icon">${iconStr}</span>
                            <div class="sub-name">${subject}</div>
                        </div>
                    `;
                });
            } else {
                grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: var(--danger); padding: 20px; font-weight:bold;">No subjects found for this batch.</div>`;
            }

            hideAllViews();
            document.getElementById('subjectView').style.display = 'block';
            viewState = 2;
            document.getElementById('headTitle').innerText = "Select Subject";
        }

        function openActionView(subject) {
            currentSubject = subject;
            document.getElementById('selectedSubTitle').innerText = subject;
            hideAllViews();
            document.getElementById('actionView').style.display = 'block';
            viewState = 3;
            document.getElementById('headTitle').innerText = "Study Mode";
        }

        function openMode(page) { location.href = page + "?sub=" + encodeURIComponent(currentSubject); }

        function showTestSetup() {
            document.getElementById('testSubName').innerText = currentSubject;
            hideAllViews();
            document.getElementById('testSetupView').style.display = 'block';
            viewState = 4;
            document.getElementById('headTitle').innerText = "AI Test Engine";
        }

        function setDiff(btn, diff) {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedDiff = diff;
        }

        async function startTest() {
            currentChapter = document.getElementById('chapInput').value.trim();
            if(!currentChapter) {
                showTicModal("Please enter a chapter name to start the test!", null, false);
                return;
            }
            score = 0; qCount = 1; updateScore();
            hideAllViews();
            document.getElementById('testActiveView').style.display = 'block';
            document.getElementById('scoreBoard').style.display = 'block';
            viewState = 5;
            document.getElementById('headTitle').innerText = "Live AI Test";
            generateQuestion();
        }

        function updateScore() { document.getElementById('scoreBoard').innerText = `Score: ${score}`; }

        async function generateQuestion() {
            isAnswered = false;
            document.getElementById('btnNext').style.display = 'none';
            document.getElementById('timerFill').style.width = '100%';
            document.getElementById('timerFill').classList.remove('danger');
            document.getElementById('qText').innerHTML = `<i class="fa-solid fa-brain fa-fade" style="color:var(--accent)"></i> AI is generating a ${selectedDiff} level question for ${currentChapter}...`;
            document.getElementById('optionsBox').innerHTML = "";
            document.getElementById('timerText').innerText = "Wait...";
            clearInterval(timerInterval);

            try {
                const response = await fetch('/api/generateTest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: `Generate ONE ${selectedDiff} level MCQ question for Subject: ${currentSubject}, Topic: ${currentChapter}. Return ONLY a valid JSON object without markdown blocks in this format: {"question": "text", "options": ["A", "B", "C", "D"], "correctIndex": 0, "reason": "explanation"}` 
                    })
                });
                if(!response.ok) throw new Error("API Error");
                const qData = await response.json();
                renderRealQuestion(qData);
            } catch(e) {
                setTimeout(() => {
                    renderRealQuestion({
                        question: `Which of the following principles functions correctly within ${currentChapter} in ${currentSubject}?`,
                        options: [`This is the correct option.`, `Distractor option 2`, `Distractor option 3`, `Distractor option 4`],
                        correctIndex: 0
                    });
                }, 1500); 
            }
        }

        function renderRealQuestion(qData) {
            document.getElementById('qText').innerHTML = `<span style="color:var(--text-muted); font-size:12px;">Q${qCount} | ${currentSubject} • ${currentChapter}</span><br><b>${qData.question}</b>`;
            let html = '';
            qData.options.forEach((opt, index) => {
                let isCorrect = (index === qData.correctIndex) ? 'true' : 'false';
                html += `<div class="option" onclick="selectOption(this, ${isCorrect})"><span>${String.fromCharCode(65+index)}) ${opt}</span></div>`;
            });
            document.getElementById('optionsBox').innerHTML = html;
            startTimer(); qCount++;
        }

        function startTimer() {
            timer = 15;
            document.getElementById('timerText').innerText = `00:${timer}`;
            timerInterval = setInterval(() => {
                timer--;
                document.getElementById('timerFill').style.width = ((timer/15)*100) + '%';
                if(timer <= 5) document.getElementById('timerFill').classList.add('danger');
                document.getElementById('timerText').innerText = timer < 10 ? `00:0${timer}` : `00:${timer}`;
                if(timer <= 0) { clearInterval(timerInterval); if(!isAnswered) autoTimeOut(); }
            }, 1000);
        }

        function selectOption(elem, isCorrect) {
            if(isAnswered) return;
            isAnswered = true; clearInterval(timerInterval);
            let allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => opt.classList.add('disabled'));
            if(isCorrect) { elem.classList.add('correct'); elem.innerHTML += '<i class="fa-solid fa-circle-check"></i>'; score += 4; } 
            else {
                elem.classList.add('wrong'); elem.innerHTML += '<i class="fa-solid fa-circle-xmark"></i>'; score -= 1;
                allOptions.forEach(opt => { if(opt.getAttribute('onclick').includes('true')) { opt.classList.add('correct'); opt.innerHTML += '<i class="fa-solid fa-circle-check"></i>'; }});
            }
            updateScore(); document.getElementById('btnNext').style.display = 'block';
        }

        function autoTimeOut() {
            isAnswered = true; score -= 1; updateScore();
            let allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => {
                opt.classList.add('disabled');
                if(opt.getAttribute('onclick').includes('true')) { opt.classList.add('correct'); opt.innerHTML += '<i class="fa-solid fa-circle-check"></i>'; }
            });
            document.getElementById('timerText').innerText = "TIME OUT!";
            document.getElementById('btnNext').style.display = 'block';
        }

        function hideAllViews() {
            document.querySelectorAll('.content > div').forEach(div => div.style.display = 'none');
            document.getElementById('scoreBoard').style.display = 'none';
        }

        function goBack() {
            if(viewState === 1) { location.href = "dashboard.html"; } 
            else if(viewState === 2) { renderBatches(); } 
            else if(viewState === 3) { showSubjects(currentBatchIndex); } 
            else if(viewState === 4) { openActionView(currentSubject); } 
            else if(viewState === 5) {
                showTicModal("Are you sure you want to quit the test? Your score will be lost.", () => { clearInterval(timerInterval); showTestSetup(); });
            }
        }
    </script>
</body>
</html>
