<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicBull Academy - My Classroom</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #05070d; color: #fff; font-family: Arial, sans-serif; margin: 0; }
        .header { padding: 20px; border-bottom: 1px solid #2b3952; display: flex; align-items: center; gap: 15px; }
        .content { padding: 20px; }
        .batch-card { background: #101827; padding: 20px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #2b3952; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .sub-card { background: #16243a; border: 1px solid #2b3952; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; font-weight: 800; color: #c8d1df; }
        .btn-access { background: #e9155c; color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; margin-top: 15px; cursor: pointer; font-weight: 900; }
    </style>
</head>
<body>
    <div class="header">
        <button onclick="history.back()" style="background:none; border:none; color:white; font-size:20px;"><i class="fa-solid fa-arrow-left"></i></button>
        <h2 id="headTitle">My Classroom</h2>
    </div>
    <div class="content" id="appContainer"></div>

    <script>
        const container = document.getElementById('appContainer');
        const enrolled = JSON.parse(localStorage.getItem('tb_enrolled') || '[]');

        function loadBatches() {
            container.innerHTML = '';
            if(enrolled.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#9aa7ba;">No batches found. Please enroll from batches page.</div>`;
                return;
            }
            enrolled.forEach((b, i) => {
                container.innerHTML += `
                    <div class="batch-card">
                        <div style="font-size:18px; font-weight:900;">${b.title}</div>
                        <button class="btn-access" onclick="showSubjects(${i})">OPEN CLASSROOM</button>
                    </div>
                `;
            });
        }

        function showSubjects(i) {
            document.getElementById('headTitle').innerText = "Select Subject";
            let subs = enrolled[i].subjects || ["Physics", "Chemistry", "Mathematics", "English", "Biology"];
            let html = '<div class="grid-2">';
            subs.forEach(s => {
                html += `<div class="sub-card" onclick="alert('Opening ${s}')"><b>${s}</b></div>`;
            });
            container.innerHTML = html + '</div>';
        }

        loadBatches();
    </script>
</body>
</html>
