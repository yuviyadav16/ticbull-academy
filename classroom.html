<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TicBull Academy - Classroom</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #05070d; --card: #101827; --card-grad: linear-gradient(145deg, #152238, #0f1929); --accent: #e9155c; --text: #f5f7fb; --text-muted: #9aa7ba; --border: #2b3952; --success: #10b981; --danger: #ef4444; --gold: #ffb51b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .header { padding: 20px; background: #05070dee; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; }
        .content { flex: 1; overflow-y: auto; padding: 20px; }
        
        /* UI Components */
        .batch-card { background: var(--card-grad); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        .btn-access { background: var(--accent); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 900; cursor: pointer; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .sub-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 10px; text-align: center; cursor: pointer; }
        
        /* New Difficulty Selection */
        .diff-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .diff-btn { background: #16243a; border: 1px solid var(--border); padding: 10px; border-radius: 8px; color: white; cursor: pointer; }
        .diff-btn.active { border-color: var(--accent); background: #2b131d; }

        #batchView, #subjectView, #actionView, #testSetupView, #testActiveView { display: none; }
        #batchView { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <button onclick="navigateBack()" style="background:none; border:none; color:white; font-size:20px;"><i class="fa-solid fa-arrow-left"></i></button>
        <h2 id="headTitle">My Classroom</h2>
    </div>

    <div class="content">
        <div id="batchView"></div>
        <div id="subjectView">
            <h3 style="color:var(--text-muted)">Select Subject</h3>
            <div class="grid-2" id="subjectGrid"></div>
        </div>
        <div id="actionView">
            <h3 id="selectedSubTitle" style="color:var(--gold)">Subject</h3>
            <div class="grid-2">
                <div class="sub-card" onclick="location.href='chat.html'"><i class="fa-solid fa-robot"></i><br>Ask AI</div>
                <div class="sub-card" onclick="location.href='practice.html'"><i class="fa-solid fa-pen-nib"></i><br>Practice</div>
                <div class="sub-card" onclick="location.href='pyqs.html'"><i class="fa-solid fa-file-pdf"></i><br>PYQs</div>
                <div class="sub-card" onclick="setupTest()"><i class="fa-solid fa-bolt"></i><br>AI Test</div>
            </div>
        </div>
        <div id="testSetupView">
            <p>Select Difficulty Level:</p>
            <div class="diff-grid">
                <button class="diff-btn" onclick="setDiff(this, 'easy')">Easy</button>
                <button class="diff-btn active" onclick="setDiff(this, 'normal')" id="defaultDiff">Normal</button>
                <button class="diff-btn" onclick="setDiff(this, 'hard')">Hard</button>
            </div>
            <input type="text" id="chapInput" style="width:100%; padding:15px; background:#16243a; color:white; border:1px solid #2b3952; border-radius:8px; margin: 15px 0;" placeholder="Enter Chapter Name">
            <button class="btn-access" onclick="startRealTest()">START UNLIMITED TEST</button>
        </div>
        <div id="testActiveView">
            <div id="qText" style="margin-bottom:20px; font-weight:800;">Generating...</div>
            <div id="optionsBox"></div>
        </div>
    </div>

    <script>
        let viewState = 1, currentSubject = "", selectedDiff = 'normal';

        // Load Batches (Original Logic)
        window.onload = function() {
            let enrolled = JSON.parse(localStorage.getItem('tb_enrolled') || '[{"title":"CBSE Class 12 Science", "subjects":["Physics","Chemistry","Maths"]}]');
            let html = '';
            enrolled.forEach((b, i) => html += `<div class="batch-card"><div style="font-size:18px; font-weight:900;">${b.title}</div><button class="btn-access" onclick="showSubs(${i})">OPEN CLASSROOM</button></div>`);
            document.getElementById('batchView').innerHTML = html;
        };

        function showSubs(i) {
            viewState = 2;
            document.getElementById('batchView').style.display = 'none';
            document.getElementById('subjectView').style.display = 'block';
            document.getElementById('headTitle').innerText = "Subjects";
            // Logic to show subjects...
        }

        function setupTest() { viewState = 4; document.getElementById('actionView').style.display = 'none'; document.getElementById('testSetupView').style.display = 'block'; }
        function setDiff(btn, diff) {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedDiff = diff;
        }

        async function startRealTest() {
            let chap = document.getElementById('chapInput').value;
            if(!chap) return alert("Enter Chapter Name!");
            document.getElementById('testSetupView').style.display = 'none';
            document.getElementById('testActiveView').style.display = 'block';
            
            // API Call
            const response = await fetch('/api/generateTest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: `Generate a ${selectedDiff} level MCQ for ${chap}. Return JSON.` })
            });
            const qData = await response.json();
            document.getElementById('qText').innerText = qData.question;
        }

        function navigateBack() { if(viewState > 1) location.reload(); else history.back(); }
    </script>
</body>
</html>
