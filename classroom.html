<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TicBull Academy | Classroom</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #05070d; --card: #101827; --accent: #e9155c; --text: #f5f7fb; --gold: #ffb51b; --success: #10b981; --danger: #ef4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* PROFESSIONAL CUSTOM POPUP (Replaces alert/confirm) */
        .tic-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 999; }
        .tic-box { background: var(--card); padding: 25px; border-radius: 20px; text-align: center; width: 85%; border: 1px solid #2b3952; }
        .tic-btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; margin: 5px; cursor: pointer; font-weight: 800; }

        /* UI Styles */
        .app-header { padding: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #2b3952; }
        .btn-back { background: none; border: none; color: white; font-size: 20px; }
        .grid-action { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .card-action { background: linear-gradient(145deg, #152238, #0f1929); padding: 20px; border-radius: 20px; text-align: center; cursor: pointer; border: 1px solid #2b3952; }
    </style>
</head>
<body>

    <div class="app-header">
        <button class="btn-back" onclick="navigateBack()"><i class="fa-solid fa-arrow-left"></i></button>
        <h2 id="pageTitle">My Classroom</h2>
    </div>

    <div id="appContainer" style="padding: 20px;">
        <!-- Data dynamically loaded here -->
    </div>

    <!-- CUSTOM PROFESSIONAL POPUP -->
    <div id="ticModal" class="tic-modal">
        <div class="tic-box">
            <h3 id="modalMsg">Are you sure?</h3>
            <div style="margin-top: 20px;">
                <button class="tic-btn" onclick="confirmAction()">OK</button>
                <button class="tic-btn" style="background:#2b3952" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Custom Professional Alert logic
        function showTicAlert(msg, onConfirm) {
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('ticModal').style.display = 'flex';
            window.ticConfirm = onConfirm;
        }
        function closeModal() { document.getElementById('ticModal').style.display = 'none'; }
        function confirmAction() { closeModal(); if(window.ticConfirm) window.ticConfirm(); }

        // Professional Navigation
        function navigateBack() {
            // Check if user is in middle of a test
            if(window.inTest) {
                showTicAlert("Are you sure you want to quit the test? Your score will be lost.", () => {
                    window.inTest = false;
                    location.reload(); 
                });
            } else {
                history.back();
            }
        }
        
        // Initial setup for Batch list... (rest of your logic goes here)
    </script>
</body>
</html>
