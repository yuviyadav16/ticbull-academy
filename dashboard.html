<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TicBull Academy - Secure Login</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.95); --accent-color: #2563eb; --accent-glow: rgba(37, 99, 235, 0.45); --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: rgba(255, 255, 255, 0.12); --success-color: #10b981; --input-bg: #0f172a; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg-color); color: var(--text-main); display:flex; flex-direction:column; }

        /* TOAST */
        #custom-toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--card-bg); color: var(--text-main); border: 1px solid var(--accent-color); padding: 12px 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; gap: 12px; font-size: 13.5px; font-weight: 600; transition: top 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        #custom-toast.show { top: 30px; }

        /* SPLASH */
        #splash-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle at center, #0b1329 0%, #020617 100%); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; transition: opacity 0.8s ease, visibility 0.8s ease; padding: 20px; }
        .splash-logo { width: 105px; height: 105px; border-radius: 50%; background: #000; border: 2px solid rgba(37, 99, 235, 0.5); display:flex; justify-content:center; align-items:center; box-shadow: 0 0 35px var(--accent-glow); }
        .splash-logo img { width:90%; height:90%; object-fit:contain; }
        .splash-title { margin-top:20px; font-size:26px; font-weight:800; color:#fff; }
        .progress-bar-container { width: 180px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 25px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent-color), #f59e0b); animation: loadProgress 3.5s linear forwards; }
        @keyframes loadProgress { 0% { width: 0%; } 100% { width: 100%; } }

        /* AUTH CARD */
        .auth-container { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; padding:20px; width:100%; overflow-y:auto; }
        .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius:24px; padding:28px 22px; width:100%; max-width:420px; box-shadow:0 20px 50px rgba(0,0,0,0.5); text-align:center; }
        .input-group { position:relative; margin-bottom:14px; text-align:left; }
        .input-group input { width:100%; background:var(--input-bg); border:1px solid var(--border-color); color:var(--text-main); padding:14px 40px; border-radius:12px; font-size:14px; outline:none; }
        .btn-primary { width:100%; background: var(--accent-color); color:#fff; font-weight:700; padding:13px; border:none; border-radius:12px; cursor:pointer; font-size:14px; margin-top:8px; }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; display:none; justify-content:center; align-items:center; padding:16px; }
        .modal-card { background:var(--card-bg); border:1px solid var(--border-color); border-radius:24px; padding:26px; max-width:400px; width:100%; text-align:center; }
    </style>
</head>
<body>

    <div id="custom-toast"><i class="fa-solid fa-circle-check toast-icon success"></i> <span id="toast-message">Notification</span></div>

    <div id="splash-screen">
        <div class="splash-logo"><img src="./logo.png" onerror="this.src='https://raw.githubusercontent.com/yuviyadav16/ticbull-academy/main/logo.png'"></div>
        <div class="splash-title">TicBull Academy</div>
        <div class="progress-bar-container"><div class="progress-bar"></div></div>
    </div>

    <div class="auth-container" id="auth-screen">
        <div class="auth-card">
            <div class="input-group"><input type="email" id="email" placeholder="Student Email ID"></div>
            <div class="input-group"><input type="password" id="password" placeholder="Password"></div>
            <button class="btn-primary" id="authSubmitBtn" onclick="initiateAuthWithOTP()">SEND VERIFICATION OTP</button>
        </div>
    </div>

    <div class="modal-overlay" id="otpModal">
        <div class="modal-card">
            <h3 style="color:#fff; margin-bottom:10px;">Verify OTP</h3>
            <div class="input-group"><input type="text" id="otpInput" placeholder="6-Digit OTP" maxlength="6" style="text-align:center; letter-spacing:4px;"></div>
            <button class="btn-primary" id="verifyBtn" onclick="verifyOTPAndLogin()">VERIFY & CONTINUE</button>
        </div>
    </div>

    <script>
        let currentStudentData = { email: '', name: 'Student' };

        // Auto-Redirect if logged in
        window.addEventListener('load', () => {
            const savedEmail = localStorage.getItem('ticbull_email');
            const savedToken = localStorage.getItem('ticbull_token');
            
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    if(savedEmail && savedToken) {
                        window.location.href = "batches.html";
                    }
                }, 800);
            }, 3500);
        });

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('custom-toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function initiateAuthWithOTP() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if(!email || !password) return showToast("Enter email & password", "error");
            
            currentStudentData.email = email;
            
            // Your Original Backend API Call
            fetch(`/api/send-otp`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email, password: password, auth_mode: 'login' })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message);
                    document.getElementById('otpModal').style.display = 'flex';
                } else {
                    showToast(data.message, "error");
                }
            })
            .catch(() => showToast("Server Error", "error"));
        }

        function verifyOTPAndLogin() {
            const otp = document.getElementById('otpInput').value.trim();
            const password = document.getElementById('password').value.trim();
            
            fetch(`/api/verify-otp`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: currentStudentData.email, otp: otp, password: password, auth_mode: 'login' })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('ticbull_email', currentStudentData.email);
                    localStorage.setItem('ticbull_token', data.token);
                    window.location.href = "batches.html";
                } else {
                    showToast(data.message, "error"); // Shows "Invalid OTP" from your backend
                }
            })
            .catch(() => showToast("Verification Failed", "error"));
        }
    </script>
</body>
</html>
