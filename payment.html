<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TicBull Academy - Secure Checkout</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Cashfree JS SDK v3 -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

    <style>
        :root { --bg-color: #030712; --card-bg: #0f172a; --accent-color: #9f1239; --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: rgba(255, 255, 255, 0.12); --success-color: #10b981; --gold-color: #f59e0b; --input-bg: #1e293b; }
        body.light-theme { --bg-color: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border-color: #cbd5e1; --input-bg: #ffffff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: var(--text-main); display:flex; flex-direction:column; min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s; }

        .top-bar { display:flex; justify-content:center; align-items:center; padding:15px 20px; z-index:50; background: var(--card-bg); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; }
        .back-btn { position: absolute; left: 20px; background:transparent; border:none; color:var(--text-main); font-size:20px; cursor:pointer; display:flex; align-items:center; }
        .checkout-title { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        .secure-badge { position: absolute; right: 20px; color: var(--success-color); font-size: 18px; }

        .container { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: 0 auto; width: 100%; }

        .summary-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .summary-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed var(--border-color); }
        .summary-icon { width: 45px; height: 45px; background: rgba(159, 18, 57, 0.1); color: var(--accent-color); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .batch-name { font-size: 16px; font-weight: 800; color: var(--text-main); }
        .plan-name { font-size: 12px; color: var(--gold-color); font-weight: 700; background: rgba(245, 158, 11, 0.1); padding: 3px 8px; border-radius: 6px; display: inline-block; margin-top: 4px; }
        
        .price-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
        .price-row.total { border-top: 1px dashed var(--border-color); padding-top: 15px; margin-top: 5px; font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 0; }
        .price-row.total span:last-child { color: var(--success-color); }

        .badge-cashfree { background: rgba(16, 185, 129, 0.1); color: var(--success-color); border: 1px solid rgba(16, 185, 129, 0.3); padding: 10px 14px; border-radius: 12px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        .btn-pay { background: var(--success-color); color: #fff; font-weight: 800; padding: 18px; border: none; border-radius: 16px; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.2s; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; }
        .btn-pay:active { transform: scale(0.97); }

        .processing-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .loader-spinner { width: 50px; height: 50px; border: 4px solid var(--border-color); border-top: 4px solid var(--accent-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .processing-text { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        .processing-subtext { font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='batches.html'"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="checkout-title">Secure Checkout</div>
        <div class="secure-badge"><i class="fa-solid fa-shield-halved"></i></div>
    </div>

    <div class="container">
        <div class="summary-card">
            <div class="summary-header">
                <div class="summary-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <div>
                    <div class="batch-name" id="displayBatchName">Loading Batch...</div>
                    <div class="plan-name" id="displayPlanTier">Loading Plan...</div>
                </div>
            </div>
            
            <div class="price-row">
                <span>Base Price</span>
                <span id="displayBasePrice">₹0</span>
            </div>
            <div class="price-row">
                <span>GST (18%)</span>
                <span id="displayTax">₹0</span>
            </div>
            <div class="price-row total">
                <span>Total Payable</span>
                <span id="displayTotalAmount">₹0</span>
            </div>
        </div>

        <div class="badge-cashfree">
            <i class="fa-solid fa-lock"></i> Secured by Cashfree Payments (UPI, Cards, NetBanking, Wallets)
        </div>

        <button class="btn-pay" onclick="initiateCashfreePayment()">
            PAY WITH CASHFREE <span id="btnAmount">₹0</span> <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

    <div class="processing-overlay" id="processingOverlay">
        <div class="loader-spinner"></div>
        <div class="processing-text" id="procText">Connecting to Gateway...</div>
        <div class="processing-subtext">Please do not refresh or press back</div>
    </div>

    <script>
        // Cashfree Init (Change mode to "PROD" after review approval)
        const cashfree = Cashfree({
            mode: "sandbox" 
        });

        var finalTotal = 0;
        var userEmail = "";

        window.addEventListener('DOMContentLoaded', function() {
            userEmail = localStorage.getItem('ticbull_email') || 'student@ticbull.com';
            var isLight = localStorage.getItem('ticbull_theme') === 'light';
            if(isLight) { document.body.classList.add('light-theme'); }
            loadOrderDetails();
        });

        function loadOrderDetails() {
            var batchTitle = sessionStorage.getItem('tb_checkout_title') || "TicBull Target Batch";
            var batchPrice = sessionStorage.getItem('tb_checkout_price') || 399;
            var tier = sessionStorage.getItem('tb_checkout_tier') || 'Pro';

            document.getElementById('displayBatchName').innerText = batchTitle;
            document.getElementById('displayPlanTier').innerText = tier + " Pass";

            var basePrice = parseInt(batchPrice);
            var tax = Math.round(basePrice * 0.18);
            finalTotal = basePrice + tax;

            document.getElementById('displayBasePrice').innerText = '₹' + basePrice;
            document.getElementById('displayTax').innerText = '₹' + tax;
            document.getElementById('displayTotalAmount').innerText = '₹' + finalTotal;
            document.getElementById('btnAmount').innerText = '₹' + finalTotal;
        }

        function initiateCashfreePayment() {
            var overlay = document.getElementById('processingOverlay');
            overlay.style.display = 'flex';

            /*
              NOTE: Server-side API endpoint se payment_session_id laana padega.
              Backend call: POST https://api.cashfree.com/pg/orders
            */

            // Temporary simulation for testing before production approval
            setTimeout(function() {
                var dummySessionId = sessionStorage.getItem('cf_session_id');
                
                if (dummySessionId) {
                    // Actual Cashfree Checkout Modal call
                    let checkoutOptions = {
                        paymentSessionId: dummySessionId,
                        redirectTarget: "_self"
                    };
                    cashfree.checkout(checkoutOptions);
                } else {
                    // Fallback redirect to classroom for local testing
                    overlay.style.display = 'none';
                    
                    var enrolled = JSON.parse(localStorage.getItem('tb_enrolled') || '[]');
                    enrolled.push({
                        title: document.getElementById('displayBatchName').innerText,
                        tier: document.getElementById('displayPlanTier').innerText,
                        date: new Date().toLocaleDateString()
                    });
                    localStorage.setItem('tb_enrolled', JSON.stringify(enrolled));
                    
                    alert("Payment Gateway activation is in progress on Cashfree. Test enrollment completed!");
                    window.location.href = 'classroom.html';
                }
            }, 1200);
        }
    </script>
</body>
</html>
