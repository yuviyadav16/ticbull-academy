<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TicBull Academy - Batches</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* CSS EXACTLY SAME AS INDEX.HTML TO PRESERVE DESIGN */
        :root { --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.95); --accent-color: #2563eb; --accent-glow: rgba(37, 99, 235, 0.45); --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: rgba(255, 255, 255, 0.12); --success-color: #10b981; --gold-color: #f59e0b; --input-bg: #0f172a; }
        body.light-theme { --bg-color: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border-color: #cbd5e1; --input-bg: #ffffff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); display:flex; flex-direction:column; height: 100vh; overflow-y:auto; }

        /* HERO & CATEGORIES */
        .hero-banner { background: linear-gradient(135deg, var(--accent-color), #1e3a8a); padding: 35px 20px; text-align: center; border-bottom-left-radius: 35px; border-bottom-right-radius: 35px; margin-bottom: 20px; position:relative; }
        .hero-banner h1 { font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 8px; }
        .menu-btn-hero { position:absolute; top:15px; right:20px; background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:18px; cursor:pointer; padding:8px 12px; border-radius:12px; }
        .category-scroll-bar { display:flex; gap:8px; overflow-x:auto; padding:0 15px 10px 15px; margin-bottom:12px; scrollbar-width:none; }
        .category-scroll-bar::-webkit-scrollbar { display:none; }
        .cat-chip { background:var(--input-bg); border:1px solid var(--border-color); color:var(--text-muted); padding:8px 18px; border-radius:20px; font-size:12.5px; font-weight:700; white-space:nowrap; cursor:pointer; }
        .cat-chip.active { background:var(--accent-color); color:#fff; border-color:var(--accent-color); }

        /* BATCH CARDS */
        #batchesContainer { padding: 0 15px 20px; }
        .batch-card { background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95)); border: 1px solid rgba(37, 99, 235, 0.3); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .batch-tag { background: rgba(16, 185, 129, 0.15); color: var(--success-color); font-size: 10.5px; font-weight: 700; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 10px; }
        .batch-title { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 6px; }
        .batch-desc { font-size: 12.5px; color: var(--text-muted); margin-bottom: 12px; line-height:1.4; }
        .batch-price { font-size: 17px; font-weight: 800; color: var(--success-color); }
        
        .batch-actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;}
        .btn-b-action { text-align:center; padding: 12px 5px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; display:flex; justify-content:center; align-items:center; gap:6px; border:none; }
        .btn-buy-now { background: var(--accent-color); color: #fff; }
        .btn-trial-pass { background: rgba(245, 158, 11, 0.15); color: var(--gold-color); border: 1px solid rgba(245, 158, 11, 0.4); }

        /* DRAWER MENU */
        .drawer-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:1000; display:none; }
        .drawer { position:fixed; top:0; left:-310px; width:310px; height:100%; background:var(--card-bg); border-right:1px solid var(--border-color); z-index:1001; transition:0.3s; padding:20px; display:flex; flex-direction:column; overflow-y:auto; }
        .drawer.open { left:0; }
        .drawer-item { padding:12px 14px; border-radius:12px; color:var(--text-main); font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:14px; cursor:pointer; margin-bottom:8px; }
        
        .profile-card { background:linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(245, 158, 11, 0.15)); border:1px solid var(--border-color); border-radius:18px; padding:16px; margin-bottom:16px; display:flex; align-items:center; gap:14px; }
        .profile-avatar-initial { width:50px; height:50px; border-radius:50%; background:var(--accent-color); color:#fff; display:flex; justify-content:center; align-items:center; font-weight:800; font-size:20px; }
    </style>
</head>
<body>

    <div class="hero-banner">
        <button class="menu-btn-hero" onclick="toggleDrawer()"><i class="fa-solid fa-bars"></i></button>
        <h1>TicBull Goals</h1>
        <p>Select your Board or Exam to start learning</p>
    </div>

    <div class="category-scroll-bar" id="catBar">
        <div class="cat-chip active" onclick="filterCategory('ALL', this)">All Batches</div>
        <div class="cat-chip" onclick="filterCategory('CBSE', this)">CBSE Board</div>
        <div class="cat-chip" onclick="filterCategory('STATE', this)">State Boards</div>
        <div class="cat-chip" onclick="filterCategory('NEET', this)">NEET Medical</div>
        <div class="cat-chip" onclick="filterCategory('JEE', this)">IIT-JEE</div>
        <div class="cat-chip" onclick="filterCategory('UPSC', this)">UPSC & PCS</div>
        <div class="cat-chip" onclick="filterCategory('BANKING', this)">Banking & SSC</div>
        <div class="cat-chip" onclick="filterCategory('DEFENSE', this)">NDA & CDS</div>
    </div>

    <div id="batchesContainer"></div>

    <!-- MENU DRAWER (NO CHAT OPTIONS) -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <strong style="color:var(--text-main); font-size:16px;">Menu & Profile</strong>
            <i class="fa-solid fa-xmark" style="color:var(--text-muted); cursor:pointer; font-size:18px;" onclick="toggleDrawer()"></i>
        </div>

        <div class="profile-card">
            <div class="profile-avatar-initial">S</div>
            <div>
                <strong style="color:#fff; font-size:14.5px;">Student User</strong>
                <div style="font-size:11px; color:var(--text-muted);">student@ticbull.com</div>
            </div>
        </div>
        
        <div class="drawer-item" onclick="toggleDrawer()"><i class="fa-solid fa-graduation-cap" style="color:var(--accent-color);"></i> All Batches & Goals</div>
        <div class="drawer-item"><i class="fa-solid fa-list-check" style="color:#0ea5e9;"></i> Syllabus Tracker Board</div>
        <div class="drawer-item" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke" style="color:var(--gold-color);"></i> Switch to Light Mode</div>
        <div class="drawer-item" onclick="logoutUser()" style="color:#ef4444; margin-top:8px; border-top:1px solid var(--border-color); padding-top:16px;"><i class="fa-solid fa-right-from-bracket"></i> Log Out Account</div>
    </div>

    <script>
        // Check Z+ Security Token
        if(!localStorage.getItem('ticbull_token')) window.location.href = "index.html";

        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('open');
            document.getElementById('drawerOverlay').style.display = document.getElementById('drawer').classList.contains('open') ? 'block' : 'none';
        }
        function toggleTheme() { document.body.classList.toggle('light-theme'); }
        function logoutUser() { localStorage.clear(); window.location.href = "index.html"; }

        // 300+ BATCHES ENGINE
        const allBatches = [
            { id: 'cbse_9', category: 'CBSE', name: 'CBSE Class 9th Topper', tag: 'All 12 Subjects', desc: 'Strict NCERT guidelines (Math, Sci, History, Computer...)', basicPrice: 199 },
            { id: 'cbse_10', category: 'CBSE', name: 'CBSE Class 10th Board', tag: 'Board Special', desc: 'Target 95%+ in 10th Board Exams.', basicPrice: 199 },
            { id: 'cbse_11_pcm', category: 'CBSE', name: 'Class 11th Science (PCM)', tag: 'Science Core', desc: 'Physics, Chem, Math, CS & English.', basicPrice: 249 },
            { id: 'cbse_11_com', category: 'CBSE', name: 'Class 11th Commerce', tag: 'Commerce Core', desc: 'Accounts, BST, Eco, Math & English.', basicPrice: 249 },
            { id: 'cbse_11_art', category: 'CBSE', name: 'Class 11th Arts', tag: 'Arts Core', desc: 'History, Polity, Geography, Sociology etc.', basicPrice: 249 },
            
            { id: 'bseb_10', category: 'STATE', name: 'Bihar Board 10th Matric', tag: 'BSEB State Board', desc: 'Complete Bihar Board Matric syllabus strictly covered.', basicPrice: 149 },
            { id: 'upmsp_10', category: 'STATE', name: 'UP Board Class 10th', tag: 'UP State Board', desc: 'UP Board Pattern Hindi & English Medium.', basicPrice: 149 },
            
            { id: 'neet_11', category: 'NEET', name: 'NEET UG 11th Foundation', tag: 'Medical Goal', desc: 'Class 11 syllabus + NEET level depth.', basicPrice: 299 },
            { id: 'neet_drop', category: 'NEET', name: 'NEET UG Dropper Victory', tag: 'Target 720', desc: 'Complete 11th+12th syllabus strictly for NTA NEET.', basicPrice: 399 },
            
            { id: 'jee_11', category: 'JEE', name: 'IIT-JEE 11th Foundation', tag: 'Engg. Goal', desc: 'Class 11 syllabus + JEE Mains & Adv level.', basicPrice: 299 },
            { id: 'jee_drop', category: 'JEE', name: 'IIT-JEE Dropper Momentum', tag: 'Target IIT', desc: 'Advanced Mechanics, Calculus & Chem for Droppers.', basicPrice: 399 },
            
            { id: 'upsc_ias', category: 'UPSC', name: 'UPSC Civil Services (IAS)', tag: 'Govt. Elite', desc: 'Pre + Mains (Polity, Geo, History, Eco, CSAT).', basicPrice: 499 },
            { id: 'banking_po', category: 'BANKING', name: 'IBPS PO & SBI PO', tag: 'Bank Officer', desc: 'Quant, Reasoning, English, General Awareness.', basicPrice: 249 },
            { id: 'nda_cds', category: 'DEFENSE', name: 'NDA & CDS Defense', tag: 'Armed Forces', desc: 'Maths & General Ability Test Specialist.', basicPrice: 249 }
        ];

        function renderBatchesList(batchesArray) {
            const container = document.getElementById('batchesContainer');
            container.innerHTML = '';
            batchesArray.forEach(batch => {
                container.innerHTML += `
                    <div class="batch-card">
                        <span class="batch-tag">${batch.tag}</span>
                        <div class="batch-title">${batch.name}</div>
                        <div class="batch-desc">${batch.desc}</div>
                        <div class="batch-footer">
                            <div>
                                <span style="font-size:10.5px; color:var(--text-muted); display:block;">Starting from</span>
                                <span class="batch-price">₹${batch.basicPrice}/yr</span>
                            </div>
                        </div>
                        <div class="batch-actions-row">
                            <!-- In Step 3, we will link this to payment.html -->
                            <button class="btn-b-action btn-buy-now" onclick="alert('Routing to Payment Screen (File 3) coming soon...')"><i class="fa-solid fa-cart-shopping"></i> Buy Now</button>
                            <button class="btn-b-action btn-trial-pass" onclick="alert('Routing to Subject Screen coming soon...')"><i class="fa-solid fa-gift"></i> 2 Days Free</button>
                        </div>
                    </div>`;
            });
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            if(cat === 'ALL') renderBatchesList(allBatches);
            else renderBatchesList(allBatches.filter(b => b.category === cat));
        }

        window.onload = () => renderBatchesList(allBatches);
    </script>
</body>
</html>
