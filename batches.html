<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TicBull Academy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#070707;
    color:#fff;
}

header{
    position:sticky;
    top:0;
    z-index:50;
    background:#0d0d0d;
    border-bottom:1px solid #242424;
    padding:17px 20px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:900;
}

.logo span{
    color:#00ff88;
}

.header-right{
    color:#aaa;
    font-size:13px;
}

.container{
    width:94%;
    max-width:1200px;
    margin:25px auto 50px;
}

.hero{
    background:linear-gradient(135deg,#111,#0a0a0a);
    border:1px solid #242424;
    border-radius:20px;
    padding:28px;
    margin-bottom:22px;
}

.hero h1{
    font-size:30px;
    margin-bottom:8px;
}

.hero p{
    color:#999;
    line-height:1.6;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.tab{
    flex:1;
    padding:14px;
    border-radius:12px;
    border:1px solid #292929;
    background:#111;
    color:#aaa;
    font-weight:bold;
    cursor:pointer;
    text-align:center;
}

.tab.active{
    background:#00ff88;
    color:#000;
    border-color:#00ff88;
}

.search{
    width:100%;
    padding:15px;
    margin-bottom:22px;
    border-radius:12px;
    border:1px solid #303030;
    background:#101010;
    color:white;
    outline:none;
    font-size:15px;
}

.section-title{
    font-size:23px;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(235px,1fr));
    gap:16px;
}

.card{
    background:#111;
    border:1px solid #292929;
    border-radius:17px;
    padding:20px;
    transition:.2s;
}

.card:hover{
    border-color:#00ff88;
    transform:translateY(-3px);
}

.badge{
    display:inline-block;
    background:#19261f;
    color:#00ff88;
    border-radius:20px;
    padding:5px 9px;
    font-size:11px;
    margin-bottom:12px;
}

.card h3{
    font-size:19px;
    margin-bottom:7px;
}

.card p{
    color:#888;
    font-size:13px;
    line-height:1.5;
    min-height:40px;
}

.card .count{
    color:#777;
    font-size:12px;
    margin:12px 0;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.view-btn{
    background:#00ff88;
    color:#000;
}

.buy-btn{
    background:#00ff88;
    color:#000;
    margin-top:12px;
}

.back-btn{
    background:#222;
    color:#fff;
    margin-bottom:15px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.82);
    padding:18px;
    overflow:auto;
}

.modal-box{
    max-width:620px;
    width:100%;
    margin:30px auto;
    background:#101010;
    border:1px solid #303030;
    border-radius:20px;
    padding:23px;
    position:relative;
}

.close{
    position:absolute;
    right:18px;
    top:12px;
    font-size:28px;
    color:#888;
    cursor:pointer;
}

.modal-title{
    padding-right:35px;
    margin-bottom:5px;
}

.modal-sub{
    color:#888;
    font-size:13px;
    margin-bottom:20px;
}

.batch-list{
    display:grid;
    gap:12px;
}

.batch{
    background:#171717;
    border:1px solid #292929;
    border-radius:14px;
    padding:16px;
}

.batch h4{
    margin-bottom:6px;
}

.batch p{
    color:#888;
    font-size:12px;
    margin-bottom:10px;
}

.batch-price{
    color:#00ff88;
    font-size:21px;
    font-weight:bold;
    margin-bottom:10px;
}

.subjects{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:10px;
}

.subject{
    padding:6px 8px;
    background:#202020;
    border-radius:7px;
    color:#bbb;
    font-size:11px;
}

.selected-box{
    background:#151515;
    border:1px solid #292929;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

.payment-note{
    color:#777;
    font-size:11px;
    text-align:center;
    margin-top:10px;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    color:#777;
    padding:50px 10px;
}

footer{
    text-align:center;
    color:#666;
    padding:30px;
    font-size:12px;
    border-top:1px solid #1b1b1b;
}

@media(max-width:600px){

    .header-inner{
        display:block;
        text-align:center;
    }

    .header-right{
        margin-top:5px;
    }

    .hero h1{
        font-size:24px;
    }

    .tabs{
        flex-direction:column;
    }

    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

        .querySelectorAll(".tab")
        .forEach(t => t.classList.remove("active"));

    element.classList.add("active");

    document.getElementById("sectionTitle").innerText =
        category === "boards"
        ? "School Boards"
        : "Competitive Exams";

    document.getElementById("search").value = "";

    renderCards();
}


/* =========================================================
   RENDER MAIN CARDS
========================================================= */

function renderCards(){

    const query =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const data =
        currentCategory === "boards"
        ? boards
        : competitive;

    const filtered = data.filter(item => {

        const text =
            item.name +
            " " +
            item.type +
            " " +
            JSON.stringify(item.batches);

        return text.toLowerCase().includes(query);

    });


    if(filtered.length === 0){

        document.getElementById("cards").innerHTML =
            `<div class="empty">
                No board, exam or batch found.
            </div>`;

        return;
    }


    document.getElementById("cards").innerHTML =
        filtered.map((item,index)=>`

            <div class="card">

                <span class="badge">
                    ${item.type}
                </span>

                <h3>
                    ${item.name}
                </h3>

                <p>
                    ${item.batches.length}
                    batches available
                </p>

                <div class="count">
                    Starting from ₹${item.price}
                </div>

                <button
                    class="btn view-btn"
                    onclick="openBatches(${index})"
                >
                    View Batches
                </button>

            </div>

        `).join("");
}


/* =========================================================
   OPEN BATCHES
========================================================= */

function openBatches(index){

    const data =
        currentCategory === "boards"
        ? boards
        : competitive;

    const item = data[index];

    let html = `

        <h2 class="modal-title">
            ${item.name}
        </h2>

        <div class="modal-sub">
            ${item.type}
        </div>

        <div class="batch-list">
    `;


    if(currentCategory === "boards"){

        item.batches.forEach((batch,i)=>{

            const cls = batch[0];
            const stream = batch[1];

            let price = getBoardPrice(cls,stream,item.price);

            html += batchHTML(
                `${cls} — ${stream}`,
                `Board Batch • ${cls}`,
                price,
                i,
                item.name
            );

        });

    }else{

        item.batches.forEach((batch,i)=>{

            html += batchHTML(
                batch,
                `${item.name} Preparation`,
                item.price,
                i,
                item.name
            );

        });

    }


    html += `</div>`;

    document.getElementById("modalContent").innerHTML = html;

    document.getElementById("modal").style.display = "block";
}


/* =========================================================
   BOARD PRICE
========================================================= */

function getBoardPrice(cls,stream,base){

    if(cls === "Class 9")
        return base;

    if(cls === "Class 10")
        return base + 30;

    if(cls === "Class 11")
        return base + 50;

    if(cls === "Class 12")
        return base + 70;

    return base;
}


/* =========================================================
   BATCH HTML
========================================================= */

function batchHTML(title,description,price,index,category){

    const subjects = getSubjects(title);

    return `

        <div class="batch">

            <h4>
                ${title}
            </h4>

            <p>
                ${description}
            </p>

            <div class="subjects">

                ${subjects.map(s =>
                    `<span class="subject">${s}</span>`
                ).join("")}

            </div>

            <div class="batch-price">
                ₹${price}
            </div>

            <button
                class="btn buy-btn"
                onclick="buyBatch(
                    '${escapeJS(title)}',
                    '${escapeJS(category)}',
                    ${price}
                )"
            >
                🛒 BUY NOW — ₹${price}
            </button>

        </div>
    `;
}


/* =========================================================
   SUBJECTS FOR BATCH
========================================================= */

function getSubjects(title){

    const t = title.toLowerCase();

    if(t.includes("pcb"))
        return commonScience.filter(x =>
            x !== "Mathematics"
        );

    if(t.includes("pcm"))
        return commonScience.filter(x =>
            x !== "Biology"
        );

    if(t.includes("pcmb"))
        return commonScience;

    if(
        t.includes("commerce") ||
        t.includes("bank")
    )
        return commonCommerce;

    if(
        t.includes("humanities") ||
        t.includes("arts")
    )
        return commonHumanities;

    if(
        t.includes("neet")
    )
        return [
            "Physics",
            "Chemistry",
            "Botany",
            "Zoology"
        ];

    if(
        t.includes("jee") ||
        t.includes("bitsat")
    )
        return [
            "Physics",
            "Chemistry",
            "Mathematics"
        ];

    if(t.includes("clat") || t.includes("ailet"))
        return [
            "English",
            "Current Affairs",
            "Legal Reasoning",
            "Logical Reasoning",
            "Quantitative Techniques"
        ];

    if(t.includes("nda"))
        return [
            "Mathematics",
            "English",
            "General Knowledge",
            "Science",
            "History",
            "Geography"
        ];

    if(t.includes("cuet"))
        return [
            "Language",
            "Domain Subjects",
            "General Test"
        ];

    return [
        "Physics",
        "Chemistry",
        "Biology",
        "Mathematics",
        "English"
    ];
}

/* =========================================================
   ESCAPE
========================================================= */

function escapeJS(value){

    return value
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


/* =========================================================
   CLOSE
========================================================= */

function closeModal(){

    document.getElementById("modal").style.display = "none";
}


/* =========================================================
   CLOSE ON BACKDROP
========================================================= */

document.getElementById("modal")
.addEventListener("click",function(e){

    if(e.target === this){
        closeModal();
    }

});


/* =========================================================
   START
========================================================= */

renderCards();

</script>
