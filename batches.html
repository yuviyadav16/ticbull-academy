/* =========================================================
   100% DASHBOARD MATCHED CSS VARIABLES (GLOBAL SYNC)
========================================================= */
:root { 
    --bg-color: #030712; 
    --card-bg: rgba(15, 23, 42, 0.95); 
    --accent-color: #e9155c; /* Default fallback */
    --accent-glow: rgba(233, 21, 92, 0.45); 
    --text-main: #f8fafc; 
    --text-muted: #94a3b8; 
    --border-color: rgba(255, 255, 255, 0.12); 
    --success-color: #10b981; 
    --gold-color: #f59e0b; 
    --input-bg: #0f172a; 
    --primary: var(--accent-color); 
}

body.light-theme { 
    --bg-color: #f1f5f9; 
    --card-bg: #ffffff; 
    --text-main: #0f172a; 
    --text-muted: #64748b; 
    --border-color: #cbd5e1; 
    --input-bg: #ffffff; 
}

* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg-color);
  color: var(--text-main);
  transition: background 0.3s, color 0.3s;
}

.header {
  padding:20px 16px 16px;
  position:sticky;
  top:0;
  z-index:20;
  background: var(--bg-color);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-color);
}

.top {
  display:flex;
  align-items:center;
  gap:12px;
}

.back {
  border:1px solid var(--border-color);
  background: var(--card-bg);
  color: var(--text-main);
  width:42px;
  height:42px;
  border-radius:12px;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  transition: 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.back:active { transform: scale(0.9); }

.brand {
  font-size:24px;
  font-weight:900;
}

.brand span {
  color: var(--gold-color);
}

.subtitle {
  color: var(--text-muted);
  margin:8px 0 14px 54px;
  font-size:13px;
}

.input-group { position:relative; margin-bottom:14px; text-align:left; width: 100%; }
.input-group i.left-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:14px; }
.input-group input { width:100%; background:var(--input-bg); border:1px solid var(--border-color); color:var(--text-main); padding:14px 40px; border-radius:12px; font-size:14px; outline:none; transition:0.3s; }
.input-group input:focus { border-color:var(--primary); box-shadow: 0 0 12px var(--accent-glow); }

.tabs {
  display:flex;
  gap:9px;
  overflow-x:auto;
  margin-top:13px;
  padding-bottom: 5px;
}
.tabs::-webkit-scrollbar, .filters::-webkit-scrollbar { display: none; }

.tab {
  flex:0 0 auto;
  padding:10px 16px;
  border-radius:12px;
  border:1px solid var(--border-color);
  background: var(--input-bg);
  color: var(--text-muted);
  font-weight:700;
  font-size: 13.5px;
  cursor:pointer;
  transition: 0.3s;
}

.tab.active {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
  box-shadow: 0 4px 15px var(--accent-glow);
}

.filters {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:13px 16px 4px;
}

.filter {
  flex:0 0 auto;
  padding:8px 14px;
  border-radius:12px;
  border:1px solid var(--border-color);
  background: var(--input-bg);
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 600;
  cursor:pointer;
  transition: 0.2s;
}

.filter.active {
  background: rgba(255,255,255,0.1);
  color: var(--text-main);
  border-color: var(--text-muted);
}
body.light-theme .filter.active { background: #e2e8f0; border-color: #94a3b8; }

.main { padding:15px 16px 70px; }
.count { color: var(--text-muted); font-size:13px; font-weight:700; margin:5px 0 14px; }
.grid { display:grid; gap:16px; }

.card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 24px;
  padding: 24px 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);

body.light-theme .card { box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

.card h2 { margin:0 0 6px; font-size:19px; font-weight:800; }
.meta { color: var(--text-muted); font-size:12.5px; margin-bottom:16px; font-weight: 600; }
.badges { display:flex; flex-wrap:wrap; gap:8px; }
.badge { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius:8px; padding:6px 10px; font-size:11.5px; font-weight: 600; }
.more { background: rgba(37, 99, 235, 0.15); color: #3b82f6; border-color: #3b82f6; }

.price { display:flex; align-items:center; gap:10px; margin:20px 0 16px; }
.price strong { color: var(--gold-color); font-size:24px; font-weight: 900; }
.old { color: var(--text-muted); text-decoration:line-through; font-size:13px; font-weight: 600; }

.actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.viewBtn, .buyBtn { border:0; padding:14px 10px; border-radius:12px; font-weight:800; font-size: 13.5px; cursor:pointer; transition: 0.2s; }
.viewBtn { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); }

.buyBtn { background: var(--primary); color: white; box-shadow: 0 8px 20px var(--accent-glow); }
.buyBtn:active { transform: scale(0.96); }
.empty { text-align:center; padding:50px 20px; color: var(--text-muted); font-weight: 600; }

/* MODAL DESIGN */
.overlay { display:none; position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,0.85); backdrop-filter: blur(5px); padding:16px; overflow:auto; align-items: center; justify-content: center; }
.overlay.show { display:flex; }
.modal { width:100%; max-width: 420px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); overflow:hidden; animation: popIn 0.3s ease; }
@keyframes popIn { 0% { opacity:0; transform:scale(0.8) translateY(10px); } 100% { opacity:1; transform:scale(1) translateY(0); } }

.modalHead { padding:22px; display:flex; justify-content:space-between; align-items: flex-start; gap:12px; border-bottom:1px solid var(--border-color); }

/* =========================================================

let appSoundEnabled = localStorage.getItem('ticbull_sound') !== 'false';
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function playClickSound() {
    if(!appSoundEnabled) return;
    if(!audioCtx) audioCtx = new AudioContext();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

document.addEventListener('click', function(e) {

========================================================= */
const firstNames = ["Aarav","Vivaan","Aditya","Arjun","Kabir","Ishaan","Rohan","Kunal","Rahul","Nikhil","Varun","Manav","Samar","Yash","Aman","Dev","Vikram","Sanjay","Gaurav","Deepak","Nitin","Rajesh","Suresh","Manish","Akash","Ravi","Vikas","Mohit","Pankaj","Abhishek"];

function getUniqueTeacher(subjectName) {
    let hash = 0;
    for (let i = 0; i < subjectName.length; i++) { hash = subjectName.charCodeAt(i) + ((hash << 5) - hash); }
    const fName = firstNames[Math.abs(hash) % firstNames.length];
    const lName = lastNames[Math.abs(hash >> 3) % lastNames.length];
    return `Prof. ${fName} ${lName}`;
}

/* =========================================================
   BATCH DATABASE & AUTOMATIC PRICE SYSTEM
========================================================= */

function getBatchPrice(type,cls,exam){
  if(type === "school"){
    if(cls === "Class 9" || cls === "Class 10") return 199;
    if(cls === "Class 11" || cls === "Class 12") return 249;
  }
  if(exam === "NEET" || exam === "JEE Main + Advanced"){
    if(cls === "Class 11") return 299;
    if(cls === "Class 12") return 399;
    if(cls === "Dropper") return 499;
  }
  if(exam === "CUET UG") return 299;
  if(exam === "UPSC Civil Services") return 499;
  if(["SSC", "SSC CGL", "SSC CHSL", "SSC MTS"].includes(exam)) return 299;
  if(["Banking", "IBPS PO", "IBPS Clerk", "SBI PO", "SBI Clerk"].includes(exam)) return 299;
  if(["NDA", "CDS", "AFCAT"].includes(exam)) return 299;
  if(["CLAT", "AILET"].includes(exam)) return 299;
  if(["CTET", "State TET", "UGC NET"].includes(exam)) return 299;
  if(["RRB NTPC", "RRB Group D", "RRB ALP"].includes(exam)) return 299;
  if(exam === "ICAR / Agriculture Entrance") return 249;
  if(["CAT", "IPMAT"].includes(exam)) return 399;
  if(["NIFT", "NID DAT"].includes(exam)) return 249;
  if(["IISER Aptitude Test", "NEST"].includes(exam)) return 299;
  return 199;
}

function makeBatch({ type, board="", cls="", stream="", exam="", category="", subjects }) {
  const id = "B" + String(batches.length + 1).padStart(4,"0");
  const price = getBatchPrice(type, cls, exam);
  const subjectData = subjects.map(subject => ({ name: subject, teacher: getUniqueTeacher(subject) }));

  batches.push({
    id, type, board, cls, stream, exam, category, price,
    oldPrice: Math.round(price * 1.5), subjects: subjectData
  });
}

  ["CAT","Graduate","MBA Entrance",MANAGEMENT,"Management"], ["IPMAT","Class 12","Management Foundation",MANAGEMENT,"Management"],
  ["NIFT","Class 12","Fashion Design Entrance",DESIGN,"Design"], ["NID DAT","Class 12","Design Entrance",DESIGN,"Design"],
  ["IISER Aptitude Test","Class 12","Science Entrance",["Physics", "Chemistry", "Mathematics", "Biology"],"Science Entrance"], ["NEST","Class 12","Science Entrance",["Physics", "Chemistry", "Mathematics", "Biology"],"Science Entrance"],
  ["State PSC","Graduate","PSC Foundation",UPSC,"Government Exams"], ["State SSC","12th / Graduate","State SSC",SSC,"Government Exams"], ["State Police Exams","12th / Graduate","Police Exam Foundation",["General Knowledge", "Current Affairs", "Reasoning", "Quantitative Aptitude", "General Science"],"Government Exams"]
];

competitiveData.forEach(item => makeBatch({ type:"competitive", exam:item[0], cls:item[1], stream:item[2], subjects:item[3], category:item[4] }));

/* =========================================================
   FILTERS & RENDERING
========================================================= */
const schoolFilters = ["All", "National", "Andhra Pradesh", "Assam", "Bihar", "Chhattisgarh", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jharkhand", "Jammu & Kashmir", "Karnataka", "Kerala", "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal"];
const competitiveFilters = ["All", "Medical", "Engineering", "University Entrance", "UPSC", "SSC", "Banking", "Defence", "Law", "Teaching", "Railway", "Agriculture", "Management", "Design", "Science Entrance", "Government Exams"];

function renderFilters(){
  const target = currentType === "school" ? document.getElementById("schoolFilters") : document.getElementById("competitiveFilters");
  target.innerHTML = "";
  const filters = currentType === "school" ? schoolFilters : competitiveFilters;
  
  filters.forEach(filter => {
    const button = document.createElement("button");
    button.className = "filter" + (currentFilter === filter ? " active" : "");
    button.textContent = filter;
    button.onclick = () => { currentFilter = filter; renderFilters(); render(); };
    target.appendChild(button);
  });
}

function render(){
  const grid = document.getElementById("grid");
  const search = document.getElementById("search").value.toLowerCase().trim();
  let list = batches.filter(batch => batch.type === currentType);

  if(currentFilter !== "All"){
    list = list.filter(batch => {
      if(currentType === "school"){
        if(currentFilter === "National") return ["CBSE", "CISCE", "NIOS"].includes(batch.board);
        return batch.board === currentFilter;
      }
      return batch.category === currentFilter;
    });
  }

  if(search){
    list = list.filter(batch => {
      const text = [batch.board, batch.cls, batch.stream, batch.exam, batch.category, ...batch.subjects.map(s => s.name), ...batch.subjects.map(s => s.teacher)].join(" ").toLowerCase();
      return text.includes(search);
    });
  }

  document.getElementById("count").textContent = `${list.length} batches available`;

  if(!list.length){
    grid.innerHTML = `<div class="empty">😕 No batch found.<br>Try another board, class or exam.</div>`;
    return;
  }

  grid.innerHTML = list.map(batch => {
    const title = batch.type === "school" ? `${batch.board} — ${batch.cls}` : `${batch.exam} — ${batch.cls}`;
    const meta = batch.type === "school" ? `${batch.board} • ${batch.stream}` : `${batch.exam} • ${batch.stream}`;
    const visible = batch.subjects.slice(0,6);
    const more = batch.subjects.length - 6;

    return `
      <article class="card">
        <h2>${escapeHTML(title)}</h2>
        <div class="meta">${escapeHTML(meta)}</div>
        <div class="badges">
          ${visible.map(subject => `<span class="badge">${escapeHTML(subject.name)}</span>`).join("")}
          ${more > 0 ? `<span class="badge more">+${more} more</span>` : ""}
        </div>
        <div class="price">
          <strong>₹${batch.price}</strong>
          <span class="old">₹${batch.oldPrice}</span>
        </div>
        <div class="actions">
          <button class="viewBtn" onclick="viewSubjects('${batch.id}')">VIEW SUBJECTS</button>
          <button class="buyBtn" onclick="buy('${batch.id}')">BUY NOW</button>
        </div>
      </article>
    `;
  }).join("");
}

/* =========================================================
   SUBJECT MODAL
========================================================= */
function viewSubjects(id){
  const batch = batches.find(item => item.id === id);
  if(!batch) return;

  const title = batch.type === "school" ? `${batch.board} — ${batch.cls}` : `${batch.exam} — ${batch.cls}`;
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalMeta").textContent = batch.type === "school" ? `${batch.board} • ${batch.stream}` : `${batch.exam} • ${batch.stream}`;

  document.getElementById("subjectList").innerHTML = batch.subjects.map(subject => `
    <div class="subject">
      <div class="icon">${icons[subject.name] || "📚"}</div>
      <div>
        <div class="subjectName">${escapeHTML(subject.name)}</div>
        <div class="teacher">👨‍🏫 ${escapeHTML(subject.teacher)}</div>
      </div>
    </div>
  `).join("");

  document.getElementById("modalBuy").textContent = `BUY NOW — ₹${batch.price}`;
  document.getElementById("modalBuy").onclick = () => buy(batch.id);
  document.getElementById("overlay").classList.add("show");
}

function closeModal(){ document.getElementById("overlay").classList.remove("show"); }
function outsideClose(event){ if(event.target.id === "overlay") closeModal(); }

/* =========================================================
   BUY NOW
========================================================= */
function buy(id) {
  const batch = batches.find(item => item.id === id);
  if (!batch) return;
  const title = batch.type === "school" ? `${batch.board} — ${batch.cls} — ${batch.stream}` : `${batch.exam} — ${batch.cls} — ${batch.stream}`;
  const exactSubjects = batch.subjects.map(s => s.name);

  sessionStorage.setItem("tb_checkout_title", title);
  sessionStorage.setItem("tb_checkout_price", batch.price);
  sessionStorage.setItem("tb_checkout_tier", "Pro");
  sessionStorage.setItem("tb_checkout_subjects", JSON.stringify(exactSubjects));
  window.location.href = "payment.html";
}

/* =========================================================
   TABS & EVENTS
========================================================= */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(item => item.classList.remove("active"));
    tab.classList.add("active");
    currentType = tab.dataset.type;
    currentFilter = "All";
    document.getElementById("schoolFilters").style.display = currentType === "school" ? "flex" : "none";
    document.getElementById("competitiveFilters").style.display = currentType === "competitive" ? "flex" : "none";
    renderFilters();
    render();
  });
});

document.getElementById("search").addEventListener("input", render);
function escapeHTML(value){ return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;"); }

renderFilters();
render();
</script>

</body>
</html>
