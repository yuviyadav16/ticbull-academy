<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TicBull Academy - Explore Batches</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="logo.png">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --bg:#030712;
    --card:#0f172a;
    --input:#1e293b;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:rgba(255,255,255,.12);
    --accent:#9f1239;
    --green:#10b981;
    --gold:#f59e0b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

.top-bar{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:var(--card);
    border-bottom:1px solid var(--border);
}

.back-btn,
.menu-btn{
    border:0;
    color:var(--text);
    cursor:pointer;
}

.back-btn{
    background:transparent;
    font-size:17px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:12px;
}

.menu-btn{
    background:var(--input);
    border:1px solid var(--border);
    padding:8px 12px;
    border-radius:10px;
}

.search-area{
    padding:15px 20px 5px;
}

.search-box{
    position:relative;
}

.search-box input{
    width:100%;
    padding:14px 20px 14px 45px;
    border-radius:16px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    outline:none;
}

.search-box i{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
}

.category-scroll{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:10px 20px 15px;
    scrollbar-width:none;
}

.category-scroll::-webkit-scrollbar{
    display:none;
}

.cat-chip{
    white-space:nowrap;
    padding:8px 18px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.cat-chip.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
}

.batches-container{
    padding:10px 20px 30px;
    display:flex;
    flex-direction:column;
    gap:16px;
}

.batch-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    position:relative;
    overflow:hidden;
}

.batch-card:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:5px;
    height:100%;
    background:var(--accent);
}

.batch-tag{
    display:inline-block;
    padding:5px 10px;
    border-radius:6px;
    background:rgba(16,185,129,.12);
    color:var(--green);
    border:1px solid rgba(16,185,129,.25);
    font-size:10px;
    font-weight:800;
    margin-bottom:8px;
}

.batch-title{
    font-size:17px;
    font-weight:800;
    margin-bottom:6px;
}

.batch-desc{
    color:var(--muted);
    font-size:12.5px;
    line-height:1.5;
    margin-bottom:16px;
}

.batch-footer{
    border-top:1px solid var(--border);
    padding-top:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.batch-price{
    color:var(--green);
    font-size:17px;
    font-weight:800;
}

.batch-price-sub{
    display:block;
    color:var(--muted);
    font-size:9px;
    text-transform:uppercase;
}

.btn-row{
    display:flex;
    gap:8px;
}

.btn-details,
.btn-buy,
.btn-primary{
    cursor:pointer;
    border-radius:10px;
    font-weight:700;
}

.btn-details{
    padding:8px 14px;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
}

.btn-buy{
    padding:8px 14px;
    background:var(--accent);
    color:#fff;
    border:0;
}

.drawer-overlay,
.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    z-index:2000;
    display:none;
}

.drawer-overlay{
    z-index:3000;
}

.drawer{
    position:fixed;
    top:0;
    left:-320px;
    width:320px;
    height:100%;
    background:var(--card);
    z-index:3001;
    transition:.3s;
    padding:20px;
    border-right:1px solid var(--border);
}

.drawer.open{
    left:0;
}

.drawer-header{
    display:flex;
    justify-content:space-between;
    padding-bottom:15px;
    border-bottom:1px solid var(--border);
}

.drawer-item{
    margin-top:10px;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
}

.modal-overlay{
    justify-content:center;
    align-items:center;
    padding:16px;
    backdrop-filter:blur(5px);
}

.modal-card{
    width:100%;
    max-width:450px;
    max-height:90vh;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:22px;
    position:relative;
    display:flex;
    flex-direction:column;
}

.close-btn{
    position:absolute;
    right:17px;
    top:15px;
    color:var(--muted);
    font-size:20px;
    cursor:pointer;
}

.sub-list-container{
    overflow-y:auto;
    margin-top:15px;
    padding-right:4px;
}

.sub-card{
    display:flex;
    gap:12px;
    align-items:center;
    padding:12px;
    margin-bottom:10px;
    background:var(--input);
    border:1px solid var(--border);
    border-radius:12px;
}

.sub-icon{
    min-width:40px;
    height:40px;
    border-radius:10px;
    background:rgba(159,18,57,.12);
    color:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
}

.stream-title{
    margin-top:18px;
    margin-bottom:8px;
    color:var(--gold);
    font-size:13px;
    font-weight:800;
}

.tier-card{
    padding:13px;
    border:2px solid var(--border);
    border-radius:14px;
    background:var(--input);
    margin-bottom:10px;
    cursor:pointer;
}

.tier-card.selected{
    border-color:var(--accent);
}

.btn-primary{
    width:100%;
    border:0;
    background:var(--accent);
    color:#fff;
    padding:14px;
    margin-top:10px;
    font-size:14px;
}
</style>
</head>

<!-- TOP BAR -->
<div class="top-bar">

</div>

</div>

<!-- FILTER -->
<div class="category-scroll">

    </div>

    </div>

    </div>

    <div class="cat-chip"

        NIOS
    </div>

    <div class="cat-chip"
         onclick="setCategory('STATE',this)">
        State Boards
    </div>

    <div class="cat-chip"
         onclick="setCategory('NEET',this)">
        NEET
    </div>

    <div class="cat-chip"
         onclick="setCategory('JEE',this)">
        JEE
    </div>

    <div class="cat-chip"
         onclick="setCategory('CUET',this)">
        CUET
    </div>

    <div class="cat-chip"
         onclick="setCategory('UPSC',this)">
        UPSC
    </div>

</div>

<!-- BATCH LIST -->
<div class="batches-container" id="batchesList"></div>

<!-- DRAWER -->
<div class="drawer-overlay"
     id="drawerOverlay"
     onclick="toggleDrawer()"></div>

<div class="drawer" id="drawer">

    <div class="drawer-header">
        <strong>Menu</strong>
        <i class="fa-solid fa-xmark"
           onclick="toggleDrawer()"></i>
    </div>

    <div class="drawer-item"
         onclick="location.href='dashboard.html'">
        <i class="fa-solid fa-house"></i>
        Dashboard Home
    </div>

    <div class="drawer-item"
         onclick="location.href='classroom.html'">
        <i class="fa-solid fa-graduation-cap"></i>
        My Classroom
    </div>

</div>

<!-- DETAILS MODAL -->
<div class="modal-overlay" id="detailsModal">

    <div class="modal-card">

        <i class="fa-solid fa-xmark close-btn"
           onclick="closeModal('detailsModal')"></i>

        <h3 id="detailsTitle"></h3>

        <p id="detailsSubtitle"
           style="font-size:12px;color:var(--muted);margin-top:4px;">
        </p>

        <div id="detailsSubjectsList"
             class="sub-list-container"></div>

        <button class="btn-primary"
                onclick="openPricingFromDetails()">
            BUY THIS BATCH
        </button>

    </div>
</div>

<!-- PRICING -->
<div class="modal-overlay" id="pricingModal">

    <div class="modal-card">

        <i class="fa-solid fa-xmark close-btn"
           onclick="closeModal('pricingModal')"></i>

        <h3>
            <i class="fa-solid fa-crown"
               style="color:var(--gold)"></i>
            Select Plan
        </h3>

        <p id="pricingBatchTitle"
           style="font-size:12px;color:var(--muted);margin:6px 0 15px;">
        </p>

        <div class="tier-card"
             id="tierBasic"
             onclick="selectTier('Basic')">

            <div style="display:flex;justify-content:space-between;font-weight:800">
                <span>Basic Pass</span>
                <span id="priceBasic"
                      style="color:var(--green)">
                    ₹199
                </span>
            </div>

            <small style="color:var(--muted)">
                Complete syllabus + 20 doubts/day
            </small>

        </div>

        <div class="tier-card selected"
             id="tierPro"
             onclick="selectTier('Pro')">

            <div style="display:flex;justify-content:space-between;font-weight:800">
                <span>Pro Pass</span>
                <span id="pricePro"
                      style="color:var(--green)">
                    ₹399
                </span>
            </div>

            <small style="color:var(--muted)">
                Complete syllabus + 50 doubts/day
            </small>

        </div>

        <button class="btn-primary"
                onclick="proceedToPayment()">
            PROCEED TO PAYMENT
        </button>

    </div>
</div>

/* ------------------------------------------------------------
   7. FACULTY GENERATOR
------------------------------------------------------------ */

function getUniqueTeacher(batchId,subjectName){

    let hash=0;

    const str=batchId+"_"+subjectName;

    for(let i=0;i<str.length;i++){

        hash=((hash<<5)-hash)+str.charCodeAt(i);
        hash=hash&hash;

    }

    hash=Math.abs(hash);

    const first=[
        "Rajesh","Amit","Priya","Kavita","Nitin",
        "Vikas","Anjali","Pooja","Ravi","Sanjay",
        "Neha","Manish","Sunil","Anita","Deepak",
        "Gaurav","Tarun","Aarti","Chetan","Divya"
    ];

    const last=[
        "Sharma","Verma","Singh","Gupta","Kumar",
        "Mishra","Patel","Reddy","Jha","Tiwari",
        "Yadav","Pandey","Chauhan","Rao","Nair",
        "Iyer","Mehta","Joshi","Sinha","Rajput"
    ];

    return "Prof. "+
           first[hash%first.length]+" "+
           last[Math.floor(hash/7)%last.length];

}

                tag:

                title:

                    classNo+

                    st.name,

                board:board.name,
                boardCode:code,
                classNo:classNo,
                stream:st.name,

                subjects:st.subjects,

                desc:
                    st.subjects
                    .map(x=>x.name)
                    .join(", "),

                basic:

/* ------------------------------------------------------------

------------------------------------------------------------ */

function renderBatches(){

    const container=
        document.getElementById("batchesList");

    const search=
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    let filtered=allBatchesCache.filter(function(b){

        const catMatch=
            currentCategory==="ALL" ||
            b.cat===currentCategory;

        const text=
            (
                b.title+
                " "+
                b.desc+
                " "+
                (b.board||"")+
                " "+
                (b.classNo||"")+
                " "+
                (b.stream||"")
            ).toLowerCase();

        return catMatch && text.includes(search);

    });


    if(filtered.length===0){

        container.innerHTML=`
            <div style="
                text-align:center;
                padding:40px 20px;
                color:var(--muted)">
                <i class="fa-solid fa-magnifying-glass"
                   style="font-size:30px;margin-bottom:12px"></i>
                <br>
                No matching batch found.
            </div>
        `;

        return;
    }


    container.innerHTML=filtered.map(function(b){

        return `

        <div class="batch-card">

            <span class="batch-tag">
                ${escapeHTML(b.tag)}
            </span>

            <div class="batch-title">
                ${escapeHTML(b.title)}
            </div>

            <div class="batch-desc">
                ${escapeHTML(b.desc)}
            </div>

            <div class="batch-footer">

                <div>
                    <span class="batch-price-sub">
                        Starting From
                    </span>

                    <span class="batch-price">
                        ₹${b.basic}/yr
                    </span>
                </div>

                <div class="btn-row">

                    <button
                        class="btn-details"
                        onclick="openDetails('${escapeAttr(b.id)}')">
                        Details
                    </button>

                    <button
                        class="btn-buy"
                        onclick="openPricing('${escapeAttr(b.id)}')">
                        Buy Pass
                    </button>

                </div>

            </div>

        </div>

        `;

    }).join("");

}

function openPricing(id){

    document.getElementById("pricingBatchTitle")
        .innerText=selectedBatchObj.title;

    document.getElementById("priceBasic")

    document.getElementById("pricePro")
        .innerText="₹"+selectedBatchObj.pro;

        .style.display="flex";

function openPricingFromDetails(){

    closeModal("detailsModal");

    if(selectedBatchObj)

}


function selectTier(tier){

    selectedTier=tier;

    document
        .getElementById("tierBasic")
        .classList
        .remove("selected");

    document
        .getElementById("tierPro")
        .classList
        .remove("selected");


    if(tier==="Basic"){

        document
            .getElementById("tierBasic")
            .classList
            .add("selected");

    }else{

        document
            .getElementById("tierPro")
            .classList
            .add("selected");

    }

}

------------------------------------------------------------ */

function proceedToPayment(){

    if(!selectedBatchObj)return;

    const price=
        selectedTier==="Basic"
        ?selectedBatchObj.basic
        :selectedBatchObj.pro;

    sessionStorage.setItem(
        "tb_checkout_title",
        selectedBatchObj.title
    );

    sessionStorage.setItem(
        "tb_checkout_price",
        price
    );

    sessionStorage.setItem(
        "tb_checkout_board",
        selectedBatchObj.board || ""
    );

    sessionStorage.setItem(
        "tb_checkout_class",
        selectedBatchObj.classNo || ""
    );

    sessionStorage.setItem(
        "tb_checkout_stream",
        selectedBatchObj.stream || ""
    );

    window.location.href="payment.html";

}

/* ------------------------------------------------------------
   17. SECURITY / HTML ESCAPING
------------------------------------------------------------ */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function escapeAttr(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}

  → Mathematics
