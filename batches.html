function uniqueTeacher(){

  const f =
    firstNames[
      teacherCounter % firstNames.length
    ];

  const l =
    lastNames[
      Math.floor(
        teacherCounter / firstNames.length
      ) % lastNames.length
    ];

  const number =
    Math.floor(
      teacherCounter /
      (firstNames.length * lastNames.length)
    );

  teacherCounter++;

  if(number === 0){

    return `Prof. ${f} ${l}`;

  }

  return `Prof. ${f} ${l} ${number + 1}`;

}


/* =========================================================
   AUTOMATIC PRICE SYSTEM
========================================================= */

function getBatchPrice(type,cls,exam){

  /* SCHOOL */

  if(type === "school"){

    if(
      cls === "Class 9" ||
      cls === "Class 10"
    ){

      return 199;

    }

    if(
      cls === "Class 11" ||
      cls === "Class 12"
    ){

    }

  }


  /* NEET */

  if(exam === "NEET"){

    if(cls === "Class 11") return 299;

    if(cls === "Class 12") return 399;

    if(cls === "Dropper") return 499;

  }


  /* JEE */

  if(exam === "JEE Main + Advanced"){

    if(cls === "Class 11") return 299;

    if(cls === "Class 12") return 399;

    if(cls === "Dropper") return 499;

  }


  /* CUET */

  if(exam === "CUET UG"){

  }


  /* UPSC */

  if(exam === "UPSC Civil Services"){

    return 499;

  }


  /* SSC */

  if(

    exam === "SSC CGL" ||
    exam === "SSC CHSL" ||
    exam === "SSC MTS"
  ){

    return 299;

  }

    exam === "IBPS Clerk" ||
    exam === "SBI PO" ||
    exam === "SBI Clerk"
  ){

  }


  /* DEFENCE */

  if(
    exam === "NDA" ||
    exam === "CDS" ||
    exam === "AFCAT"
  ){

    return 299;

  }


  /* LAW */

  if(
    exam === "CLAT" ||

  ){

  }


  /* TEACHING */

  if(
    exam === "CTET" ||
    exam === "State TET" ||
    exam === "UGC NET"
  ){

    return 299;

  }


  /* RAILWAY */

  if(
    exam === "RRB NTPC" ||
    exam === "RRB Group D" ||
    exam === "RRB ALP"
  ){

    return 299;

  }


  /* AGRICULTURE */

  if(
    exam === "ICAR / Agriculture Entrance"
  ){

    return 249;

  }


  /* MANAGEMENT */

  if(
    exam === "CAT" ||
    exam === "IPMAT"
  ){

    return 399;

  }


  /* DESIGN */

  if(
    exam === "NIFT" ||
    exam === "NID DAT"
  ){

    return 249;

  }


  /* SCIENCE ENTRANCE */

  if(
    exam === "IISER Aptitude Test" ||
    exam === "NEST"
  ){

    return 299;

  }


  /* DEFAULT */

  return 199;

}


/* =========================================================
   CREATE BATCH
========================================================= */

function makeBatch({

  type,
  board="",
  cls="",
  stream="",
  exam="",
  category="",
  subjects

}){

  const id =
    "B" +
    String(batches.length + 1).padStart(4,"0");


  const price =
    getBatchPrice(
      type,
      cls,
      exam
    );


  const subjectData =
    subjects.map(subject => ({

      name:subject,

      teacher:uniqueTeacher()

    }));


  batches.push({

    id,

    type,

    board,

    cls,

    stream,

    exam,

    category,

    price,

    oldPrice:
      Math.round(price * 1.5),

    subjects:
      subjectData

  });

}

/* =========================================================
   RENDER FILTERS
========================================================= */

function renderFilters(){

  const target =
    currentType === "school"
    ? document.getElementById("schoolFilters")
    : document.getElementById("competitiveFilters");


  target.innerHTML = "";


  const filters =
    currentType === "school"
    ? schoolFilters
    : competitiveFilters;


  filters.forEach(filter => {

    const button =
      document.createElement("button");


    button.className =
      "filter" +
      (currentFilter === filter
        ? " active"
        : "");


    button.textContent =
      filter;


    button.onclick = () => {

      currentFilter =
        filter;

      renderFilters();

      render();

    };


    target.appendChild(button);

  });

}


/* =========================================================
   RENDER BATCHES
========================================================= */

function render(){

  const grid =
    document.getElementById("grid");


  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  let list =
    batches.filter(
      batch =>
        batch.type === currentType
    );


  /* FILTER */

  if(currentFilter !== "All"){

    list =
      list.filter(batch => {

        if(currentType === "school"){

          if(currentFilter === "National"){

            return [
              "CBSE",
              "CISCE",
              "NIOS"
            ].includes(batch.board);

          }

          return batch.board === currentFilter;

        }


        return batch.category === currentFilter;

      });

  }


  /* SEARCH */

  if(search){

    list =
      list.filter(batch => {

        const text = [

          batch.board,
          batch.cls,
          batch.stream,
          batch.exam,
          batch.category,

          ...batch.subjects.map(
            s => s.name
          ),

          ...batch.subjects.map(
            s => s.teacher
          )

        ]
        .join(" ")
        .toLowerCase();


        return text.includes(search);

      });

  }


  document.getElementById("count")
    .textContent =
      `${list.length} batches available`;


  if(!list.length){

    grid.innerHTML = `
      <div class="empty">
        😕 No batch found.<br>
        Try another board, class or exam.
      </div>
    `;

    return;

  }


  grid.innerHTML =
    list.map(batch => {

      const title =
        batch.type === "school"

        ? `${batch.board} — ${batch.cls}`

        : `${batch.exam} — ${batch.cls}`;


      const meta =
        batch.type === "school"

        ? `${batch.board} • ${batch.stream}`

        : `${batch.exam} • ${batch.stream}`;


      const visible =
        batch.subjects.slice(0,6);


      const more =
        batch.subjects.length - 6;


      return `

        <article class="card">

          <h2>
            ${escapeHTML(title)}
          </h2>

          <div class="meta">
            ${escapeHTML(meta)}
          </div>


          <div class="badges">

            ${visible.map(subject => `

              <span class="badge">
                ${escapeHTML(subject.name)}
              </span>

            `).join("")}


            ${
              more > 0

              ? `
                <span class="badge more">
                  +${more} more
                </span>
              `

              : ""
            }

          </div>


          <div class="price">

            <strong>
              ₹${batch.price}
            </strong>

            <span class="old">
              ₹${batch.oldPrice}
            </span>

          </div>


          <div class="actions">

            <button
              class="viewBtn"
              onclick="viewSubjects('${batch.id}')">
              VIEW SUBJECTS
            </button>


            <button
              class="buyBtn"
              onclick="buy('${batch.id}')">
              BUY NOW
            </button>

          </div>

        </article>

      `;

    }).join("");

}


/* =========================================================
   SUBJECT MODAL
========================================================= */

function viewSubjects(id){

  const batch =
    batches.find(
      item => item.id === id
    );


  if(!batch) return;


  const title =
    batch.type === "school"

    ? `${batch.board} — ${batch.cls}`

    : `${batch.exam} — ${batch.cls}`;


  document.getElementById(
    "modalTitle"
  ).textContent = title;


  document.getElementById(
    "modalMeta"
  ).textContent =

    batch.type === "school"

    ? `${batch.board} • ${batch.stream}`

    : `${batch.exam} • ${batch.stream}`;


  document.getElementById(
    "subjectList"
  ).innerHTML =

    batch.subjects.map(subject => `

      <div class="subject">

        <div class="icon">
          ${icons[subject.name] || "📚"}
        </div>

        <div>

          <div class="subjectName">
            ${escapeHTML(subject.name)}
          </div>

          <div class="teacher">
            👨‍🏫 ${escapeHTML(subject.teacher)}
          </div>

        </div>

      </div>

    `).join("");


  document.getElementById(
    "modalBuy"
  ).textContent =
    `BUY NOW — ₹${batch.price}`;


  document.getElementById(
    "modalBuy"
  ).onclick =
    () => buy(batch.id);


  document.getElementById(
    "overlay"
  ).classList.add("show");

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

  document.getElementById(
    "overlay"
  ).classList.remove("show");

}


function outsideClose(event){

  if(
    event.target.id === "overlay"
  ){

    closeModal();

  }

}


/* =========================================================
   BUY NOW (FIXED FOR CLASSROOM)
========================================================= */

function buy(id) {
  const batch = batches.find(item => item.id === id);
  if (!batch) return;

  // FIX 1: Title mein 'stream' add kar diya taaki PCM/Commerce alag ho jaye
  const title = batch.type === "school" 
    ? `${batch.board} — ${batch.cls} — ${batch.stream}` 
    : `${batch.exam} — ${batch.cls} — ${batch.stream}`;

  // FIX 2: Us batch ke exact subjects nikal kar save kar rahe hain
  const exactSubjects = batch.subjects.map(s => s.name);

  // Payment page aur Classroom ke liye data save kiya
  sessionStorage.setItem("tb_checkout_title", title);
  sessionStorage.setItem("tb_checkout_price", batch.price);
  sessionStorage.setItem("tb_checkout_tier", "Pro");
  sessionStorage.setItem("tb_checkout_subjects", JSON.stringify(exactSubjects));

  // Payment page par bhej diya
  window.location.href = "payment.html";
}

/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
