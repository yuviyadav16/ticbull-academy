<style>
/* =========================================================
   EXACT ORIGINAL UI WITH GLOBAL THEME SUPPORT
========================================================= */
:root {
  --bg-main: #05070d;
  --text-main: #f5f7fb;
  --text-muted: #93a1b5;
  --header-bg: #05070df2;
  --border-color: #202b40;
  --back-btn-bg: #16243a;
  --search-bg: #101827;
  --search-border: #2b3952;
  --tab-border: #30405c;
  --filter-bg: #111a2a;
  --filter-border: #2d3b53;
  --filter-active: #243650;
  --card-grad: linear-gradient(145deg, #152238, #0f1929);
  --card-border: #2b3b55;
  --badge-bg: #202f46;
  --more-bg: #293c59;
  --modal-bg: #0d1727;
  --subject-bg: #152238;
  --icon-bg: #281631;
  --gold: #ffb51b;
  
  /* Ye Global settings se color lega, default Pinkish-Red rakha hai */
  --primary: var(--accent-color, #e9155c); 
}

/* Light Theme Variables */
body.light-theme {
  --bg-main: #f3f4f6;
  --text-main: #111827;
  --text-muted: #64748b;
  --header-bg: rgba(243, 244, 246, 0.95);
  --border-color: #e5e7eb;
  --back-btn-bg: #e5e7eb;
  --search-bg: #ffffff;
  --search-border: #d1d5db;
  --tab-border: #d1d5db;
  --filter-bg: #ffffff;
  --filter-border: #d1d5db;
  --filter-active: #e5e7eb;
  --card-grad: linear-gradient(145deg, #ffffff, #f9fafb);
  --card-border: #e5e7eb;
  --badge-bg: #f1f5f9;
  --more-bg: #e2e8f0;
  --modal-bg: #ffffff;
  --subject-bg: #f8fafc;
  --icon-bg: #f1f5f9;
  --gold: #d97706;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background: var(--bg-main);
  color: var(--text-main);
  transition: background 0.3s, color 0.3s;
}

.header{
  padding:20px 16px 16px;
  position:sticky;
  top:0;
  z-index:20;
  background: var(--header-bg);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-color);
}

.top{
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  border:0;
  background: var(--back-btn-bg);
  color: var(--text-main);
  width:42px;
  height:42px;
  border-radius:13px;
  font-size:21px;
  cursor:pointer;
}

.brand{
  font-size:28px;
  font-weight:900;
}

.brand span{
  color: var(--gold);
}

.subtitle{
  color: var(--text-muted);
  margin:8px 0 14px 54px;
  font-size:13px;
}

.search{
  width:100%;
  padding:15px 16px;
  border-radius:15px;
  border:1px solid var(--search-border);
  background: var(--search-bg);
  color: var(--text-main);
  outline:none;
  font-size:15px;
}

.search::placeholder{
  color: var(--text-muted);
}

.tabs{
  display:flex;
  gap:9px;
  overflow-x:auto;
  margin-top:13px;
}

.tab{
  flex:0 0 auto;
  padding:11px 15px;
  border-radius:999px;
  border:1px solid var(--tab-border);
  background: var(--search-bg);
  color: var(--text-muted);
  font-weight:800;
  cursor:pointer;
}

.tab.active{
  background: var(--primary);
  border-color: var(--primary);
  color:white;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:13px 16px 4px;
}

.filter{
  flex:0 0 auto;
  padding:9px 13px;
  border-radius:999px;
  border:1px solid var(--filter-border);
  background: var(--filter-bg);
  color: var(--text-muted);
  cursor:pointer;
}

.filter.active{
  background: var(--filter-active);
  color: var(--text-main);
}

.main{
  padding:15px 16px 70px;
}

.count{
  color: var(--text-muted);
  font-size:14px;
  font-weight:800;
  margin:5px 0 14px;
}

.grid{
  display:grid;
  gap:14px;
}

.card{
  background: var(--card-grad);
  border:1px solid var(--card-border);
  border-radius:21px;
  padding:18px;
  box-shadow:0 12px 35px rgba(0,0,0,0.2);
}

.card h2{
  margin:0 0 7px;
  font-size:20px;
}

.meta{
  color: var(--text-muted);
  font-size:13px;
  margin-bottom:14px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.badge{
  background: var(--badge-bg);
  color: var(--text-main);
  border-radius:9px;
  padding:7px 9px;
  font-size:12px;
  border: 1px solid var(--card-border);
}

.more{
  background: var(--more-bg);
  color: var(--primary);
}

.price{
  display:flex;
  align-items:center;
  gap:9px;
  margin:17px 0 13px;
}

.price strong{
  color: var(--gold);
  font-size:26px;
}

.old{
  color: var(--text-muted);
  text-decoration:line-through;
  font-size:14px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.viewBtn,
.buyBtn{
  border:0;
  padding:13px 7px;
  border-radius:13px;
  font-weight:900;
  cursor:pointer;
}

.viewBtn{
  background: var(--filter-active);
  color: var(--text-main);
}

.buyBtn{
  background: var(--primary);
  color:white;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color: var(--text-muted);
}

/* MODAL */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,0.8);
  backdrop-filter: blur(5px);
  padding:15px;
  overflow:auto;
}

.overlay.show{
  display:block;
}

.modal{
  width:min(680px,100%);
  margin:25px auto;
  background: var(--modal-bg);
  border:1px solid var(--card-border);
  border-radius:23px;
  overflow:hidden;
}

.modalHead{
  padding:18px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid var(--border-color);
}

.modalHead h2{
  margin:0;
  font-size:21px;
}

.close{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background: var(--filter-active);
  color: var(--text-main);
  font-size:22px;
  cursor:pointer;
}

.modalBody{
  padding:18px;
}

.subject{
  display:flex;
  align-items:center;
  gap:12px;
  background: var(--subject-bg);
  border:1px solid var(--card-border);
  border-radius:15px;
  padding:13px;
  margin-bottom:9px;
}

.icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background: var(--icon-bg);
  font-size:21px;
  flex:none;
}

.subjectName{
  font-size:16px;
  font-weight:900;
}

.teacher{
  color: var(--gold);
  margin-top:4px;
  font-size:13px;
  font-weight:800;
}

.modalBuy{
  width:100%;
  margin-top:10px;
  padding:15px;
  border:0;
  border-radius:14px;
  background: var(--primary);
  color:white;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
}

.note{
  color: var(--text-muted);
  font-size:11px;
  line-height:1.5;
  margin-top:12px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>

<script>

/* =========================================================
   ICONS
========================================================= */
const icons = {
  "Hindi":"📖", "English":"📘", "Sanskrit":"🕉️", "Urdu":"📕", "Mathematics":"🔢", "Physics":"⚛️",
  "Physical Chemistry":"⚗️", "Organic Chemistry":"🧪", "Inorganic Chemistry":"🔬", "Biology":"🧬",

  "Reasoning":"🧩", "Quantitative Aptitude":"➗", "General Intelligence":"🧠", "General Awareness":"🌐",
  "General Science":"🔬", "Computer Knowledge":"💻", "Legal Reasoning":"⚖️", "Logical Reasoning":"🧩",
  "Quantitative Techniques":"➗", "English Language":"📘", "Reading Comprehension":"📖",
  "Verbal Ability":"🗣️", "Data Interpretation":"📊", "Child Development":"👶", "Teaching Aptitude":"👨‍🏫",
  "Agriculture":"🌾", "Numerical Ability":"🔢", "Communication Ability":"🗣️", "Drawing":"🎨",
  "Design Aptitude":"🎨", "Creative Ability":"🎨"
};


/* =========================================================
   UNIQUE TEACHER GENERATOR (NO REPEATS)
========================================================= */
const firstNames = ["Aarav","Vivaan","Aditya","Arjun","Kabir","Ishaan","Rohan","Kunal","Rahul","Nikhil","Varun","Manav","Samar","Yash","Aman","Dev","Vikram","Sanjay","Gaurav","Deepak","Nitin","Rajesh","Suresh","Manish","Akash","Ravi","Vikas","Mohit","Pankaj","Abhishek"];
const lastNames = ["Sharma","Gupta","Verma","Yadav","Singh","Kumar","Rao","Mehta","Chauhan","Patel","Mishra","Pandey","Tiwari","Joshi","Nair","Iyer","Reddy","Das","Bose","Sinha","Jha","Thakur","Malhotra","Kapoor","Bansal","Agarwal","Srivastava","Tripathi","Saxena","Shukla"];

// Ye function hamesha ek subject ko ek unique teacher dega (e.g. Physics = Prof. Yash Iyer)
function getUniqueTeacher(subjectName) {
    let hash = 0;
    for (let i = 0; i < subjectName.length; i++) {
        hash = subjectName.charCodeAt(i) + ((hash << 5) - hash);
    }
    const fName = firstNames[Math.abs(hash) % firstNames.length];
    const lName = lastNames[Math.abs(hash >> 3) % lastNames.length];
    return `Prof. ${fName} ${lName}`;
}

/* =========================================================
   SCHOOL SUBJECT STRUCTURE
========================================================= */
const CLASS_9_10 = ["Hindi", "English", "Mathematics", "Physics", "Chemistry", "Biology", "History", "Geography", "Political Science", "Economics"];
const PCM = ["English", "Physics", "Physical Chemistry", "Organic Chemistry", "Inorganic Chemistry", "Mathematics"];
const PCB = ["English", "Physics", "Physical Chemistry", "Organic Chemistry", "Inorganic Chemistry", "Botany", "Zoology"];
const PCMB = ["English", "Physics", "Physical Chemistry", "Organic Chemistry", "Inorganic Chemistry", "Mathematics", "Botany", "Zoology"];
const COMMERCE = ["English", "Accountancy", "Business Studies", "Economics", "Mathematics"];
const ARTS = ["English", "Hindi", "History", "Political Science", "Geography", "Economics", "Sociology", "Psychology"];

/* =========================================================
   COMPETITIVE EXAM SUBJECTS
========================================================= */
const NEET = ["Physics", "Physical Chemistry", "Organic Chemistry", "Inorganic Chemistry", "Botany", "Zoology"];
const JEE = ["Physics", "Physical Chemistry", "Organic Chemistry", "Inorganic Chemistry", "Mathematics"];
const CUET = ["English", "General Knowledge", "Current Affairs", "Quantitative Aptitude", "Reasoning"];
const UPSC = ["History", "Geography", "Political Science", "Economics", "General Studies", "Current Affairs"];
const SSC = ["General Intelligence", "Quantitative Aptitude", "English", "General Awareness", "Current Affairs"];
const BANKING = ["Quantitative Aptitude", "Reasoning", "English", "General Awareness", "Current Affairs", "Computer Knowledge"];
const NDA = ["Mathematics", "English", "General Studies", "Physics", "Chemistry", "History", "Geography", "Current Affairs"];
const DEFENCE = ["English", "General Knowledge", "Current Affairs", "Mathematics", "Reasoning"];
const CLAT = ["English", "Current Affairs", "General Knowledge", "Legal Reasoning", "Logical Reasoning", "Quantitative Techniques"];
const TEACHING = ["Child Development", "Teaching Aptitude", "Reasoning", "General Awareness", "English", "Current Affairs"];
const RAILWAY = ["Mathematics", "General Intelligence", "General Science", "General Awareness", "Current Affairs"];
const AGRICULTURE = ["Physics", "Chemistry", "Biology", "Mathematics", "Agriculture"];
const MANAGEMENT = ["Quantitative Aptitude", "Logical Reasoning", "Data Interpretation", "Verbal Ability", "Reading Comprehension"];
const DESIGN = ["English", "General Knowledge", "Current Affairs", "Design Aptitude", "Creative Ability", "Drawing"];

/* =========================================================
   SCHOOL BOARDS
========================================================= */
const boards = [
  ["CBSE","Central Board of Secondary Education"], ["CISCE","Council for the Indian School Certificate Examinations"], ["NIOS","National Institute of Open Schooling"],
  ["Andhra Pradesh","Andhra Pradesh Board"], ["Assam","Assam Board"], ["Bihar","Bihar School Examination Board"], ["Chhattisgarh","Chhattisgarh Board of Secondary Education"],
  ["Goa","Goa Board"], ["Gujarat","Gujarat Secondary and Higher Secondary Education Board"], ["Haryana","Board of School Education Haryana"], ["Himachal Pradesh","Himachal Pradesh Board of School Education"],
  ["Jharkhand","Jharkhand Academic Council"], ["Jammu & Kashmir","Jammu and Kashmir Board"], ["Karnataka","Karnataka School Examination and Assessment Board"], ["Kerala","Kerala Board"],
  ["Madhya Pradesh","Madhya Pradesh Board"], ["Maharashtra","Maharashtra State Board"], ["Manipur","Manipur Board"], ["Meghalaya","Meghalaya Board"], ["Mizoram","Mizoram Board"],
  ["Nagaland","Nagaland Board"], ["Odisha","Odisha Board"], ["Punjab","Punjab School Education Board"], ["Rajasthan","Board of Secondary Education Rajasthan"], ["Sikkim","Sikkim Board"],
  ["Tamil Nadu","Tamil Nadu State Board"], ["Telangana","Telangana Board"], ["Tripura","Tripura Board"], ["Uttar Pradesh","Uttar Pradesh Madhyamik Shiksha Parishad"],
  ["Uttarakhand","Uttarakhand Board"], ["West Bengal","West Bengal Board"]
];

/* =========================================================
   BATCH DATABASE & AUTOMATIC PRICE SYSTEM
========================================================= */
let batches = [];
let currentType = "school";
let currentFilter = "All";

function getBatchPrice(type,cls,exam){
  if(type === "school"){
    if(cls === "Class 9" || cls === "Class 10") return 199;
    if(cls === "Class 11" || cls === "Class 12") return 249;
  }
  if(exam === "NEET" || exam === "JEE Main + Advanced"){
    if(cls === "Class 11") return 299;
    if(cls === "Class 12") return 399;
    if(cls === "Dropper") return 499;
  }
  if(exam === "CUET UG") return 299;
  if(exam === "UPSC Civil Services") return 499;
  if(["SSC", "SSC CGL", "SSC CHSL", "SSC MTS"].includes(exam)) return 299;
  if(["Banking", "IBPS PO", "IBPS Clerk", "SBI PO", "SBI Clerk"].includes(exam)) return 299;
  if(["NDA", "CDS", "AFCAT"].includes(exam)) return 299;
  if(["CLAT", "AILET"].includes(exam)) return 299;
  if(["CTET", "State TET", "UGC NET"].includes(exam)) return 299;
  if(["RRB NTPC", "RRB Group D", "RRB ALP"].includes(exam)) return 299;
  if(exam === "ICAR / Agriculture Entrance") return 249;
  if(["CAT", "IPMAT"].includes(exam)) return 399;
  if(["NIFT", "NID DAT"].includes(exam)) return 249;
  if(["IISER Aptitude Test", "NEST"].includes(exam)) return 299;
  return 199;
}

/* =========================================================
   CREATE BATCH (Unique Teachers Assigned)
========================================================= */
function makeBatch({ type, board="", cls="", stream="", exam="", category="", subjects }) {
  const id = "B" + String(batches.length + 1).padStart(4,"0");
  const price = getBatchPrice(type, cls, exam);
  const subjectData = subjects.map(subject => ({
      name: subject,
      teacher: getUniqueTeacher(subject) // FIXED UNIQUE TEACHERS
  }));

  batches.push({
    id, type, board, cls, stream, exam, category, price,
    oldPrice: Math.round(price * 1.5),
    subjects: subjectData
  });
}

/* =========================================================
   CREATE SCHOOL BATCHES (All 372 Original Batches)
========================================================= */
boards.forEach(board => {
  const boardName = board[0];
  makeBatch({ type:"school", board:boardName, cls:"Class 9", stream:"General", category:"School Boards", subjects:CLASS_9_10 });
  makeBatch({ type:"school", board:boardName, cls:"Class 10", stream:"General", category:"School Boards", subjects:CLASS_9_10 });
  makeBatch({ type:"school", board:boardName, cls:"Class 11", stream:"Science — PCM", category:"Science", subjects:PCM });
  makeBatch({ type:"school", board:boardName, cls:"Class 11", stream:"Science — PCB", category:"Science", subjects:PCB });
  makeBatch({ type:"school", board:boardName, cls:"Class 11", stream:"Science — PCMB", category:"Science", subjects:PCMB });
  makeBatch({ type:"school", board:boardName, cls:"Class 11", stream:"Commerce", category:"Commerce", subjects:COMMERCE });
  makeBatch({ type:"school", board:boardName, cls:"Class 11", stream:"Arts / Humanities", category:"Arts", subjects:ARTS });
  makeBatch({ type:"school", board:boardName, cls:"Class 12", stream:"Science — PCM", category:"Science", subjects:PCM });
  makeBatch({ type:"school", board:boardName, cls:"Class 12", stream:"Science — PCB", category:"Science", subjects:PCB });
  makeBatch({ type:"school", board:boardName, cls:"Class 12", stream:"Science — PCMB", category:"Science", subjects:PCMB });
  makeBatch({ type:"school", board:boardName, cls:"Class 12", stream:"Commerce", category:"Commerce", subjects:COMMERCE });
  makeBatch({ type:"school", board:boardName, cls:"Class 12", stream:"Arts / Humanities", category:"Arts", subjects:ARTS });
});

/* =========================================================
   COMPETITIVE BATCHES
========================================================= */
const competitiveData = [
  ["NEET","Class 11","Medical Foundation",NEET,"Medical"], ["NEET","Class 12","Medical Preparation",NEET,"Medical"], ["NEET","Dropper","Medical Dropper",NEET,"Medical"],
  ["JEE Main + Advanced","Class 11","Engineering Foundation",JEE,"Engineering"], ["JEE Main + Advanced","Class 12","Engineering Preparation",JEE,"Engineering"], ["JEE Main + Advanced","Dropper","Engineering Dropper",JEE,"Engineering"],
  ["CUET UG","Class 11","Foundation",CUET,"University Entrance"], ["CUET UG","Class 12","Preparation",CUET,"University Entrance"], ["CUET UG","Dropper","Dropper",CUET,"University Entrance"],
  ["UPSC Civil Services","Foundation","Foundation",UPSC,"UPSC"], ["UPSC Civil Services","CSE","Civil Services Preparation",UPSC,"UPSC"], ["UPSC Civil Services","Mains","Mains Preparation",UPSC,"UPSC"],
  ["SSC","Foundation","SSC Foundation",SSC,"SSC"], ["SSC CGL","Graduate","CGL Preparation",SSC,"SSC"], ["SSC CHSL","12th Level","CHSL Preparation",SSC,"SSC"], ["SSC MTS","10th Level","MTS Preparation",SSC,"SSC"],
  ["Banking","Foundation","Banking Foundation",BANKING,"Banking"], ["IBPS PO","Graduate","PO Preparation",BANKING,"Banking"], ["IBPS Clerk","Graduate","Clerk Preparation",BANKING,"Banking"], ["SBI PO","Graduate","PO Preparation",BANKING,"Banking"], ["SBI Clerk","Graduate","Clerk Preparation",BANKING,"Banking"],
  ["NDA","Class 11","NDA Foundation",NDA,"Defence"], ["NDA","Class 12","NDA Preparation",NDA,"Defence"], ["NDA","Dropper","NDA Advanced",NDA,"Defence"], ["CDS","Graduate","CDS Preparation",DEFENCE,"Defence"], ["AFCAT","Graduate","AFCAT Preparation",DEFENCE,"Defence"],
  ["CLAT","Class 11","CLAT Foundation",CLAT,"Law"], ["CLAT","Class 12","CLAT Preparation",CLAT,"Law"], ["CLAT","Dropper","CLAT Dropper",CLAT,"Law"], ["AILET","Class 12","AILET Preparation",CLAT,"Law"],
  ["CTET","Foundation","CTET Foundation",TEACHING,"Teaching"], ["CTET","Paper 1","Primary Teacher",TEACHING,"Teaching"], ["CTET","Paper 2","Upper Primary Teacher",TEACHING,"Teaching"], ["State TET","Foundation","TET Preparation",TEACHING,"Teaching"], ["UGC NET","Graduate","NET Preparation",TEACHING,"Teaching"],
  ["RRB NTPC","12th / Graduate","NTPC Preparation",RAILWAY,"Railway"], ["RRB Group D","10th / ITI","Group D Preparation",RAILWAY,"Railway"], ["RRB ALP","ITI / Diploma","ALP Preparation",RAILWAY,"Railway"],
  ["ICAR / Agriculture Entrance","Class 11","Agriculture Foundation",AGRICULTURE,"Agriculture"],
  ["CAT","Graduate","MBA Entrance",MANAGEMENT,"Management"], ["IPMAT","Class 12","Management Foundation",MANAGEMENT,"Management"],
  ["NIFT","Class 12","Fashion Design Entrance",DESIGN,"Design"], ["NID DAT","Class 12","Design Entrance",DESIGN,"Design"],
  ["IISER Aptitude Test","Class 12","Science Entrance",["Physics", "Chemistry", "Mathematics", "Biology"],"Science Entrance"], ["NEST","Class 12","Science Entrance",["Physics", "Chemistry", "Mathematics", "Biology"],"Science Entrance"],
  ["State PSC","Graduate","PSC Foundation",UPSC,"Government Exams"], ["State SSC","12th / Graduate","State SSC",SSC,"Government Exams"], ["State Police Exams","12th / Graduate","Police Exam Foundation",["General Knowledge", "Current Affairs", "Reasoning", "Quantitative Aptitude", "General Science"],"Government Exams"]

competitiveData.forEach(item => {
  makeBatch({ type:"competitive", exam:item[0], cls:item[1], stream:item[2], subjects:item[3], category:item[4] });
});

/* =========================================================
   FILTERS & RENDERING
========================================================= */
const schoolFilters = ["All", "National", "Andhra Pradesh", "Assam", "Bihar", "Chhattisgarh", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jharkhand", "Jammu & Kashmir", "Karnataka", "Kerala", "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal"];
const competitiveFilters = ["All", "Medical", "Engineering", "University Entrance", "UPSC", "SSC", "Banking", "Defence", "Law", "Teaching", "Railway", "Agriculture", "Management", "Design", "Science Entrance", "Government Exams"];

function renderFilters(){
  const target = currentType === "school" ? document.getElementById("schoolFilters") : document.getElementById("competitiveFilters");
  target.innerHTML = "";
  const filters = currentType === "school" ? schoolFilters : competitiveFilters;
  
  filters.forEach(filter => {
    const button = document.createElement("button");
    button.className = "filter" + (currentFilter === filter ? " active" : "");
    button.textContent = filter;
    button.onclick = () => { currentFilter = filter; renderFilters(); render(); };
    target.appendChild(button);
  });
}

function render(){
  const grid = document.getElementById("grid");
  const search = document.getElementById("search").value.toLowerCase().trim();
  let list = batches.filter(batch => batch.type === currentType);

  if(currentFilter !== "All"){
    list = list.filter(batch => {
      if(currentType === "school"){
        if(currentFilter === "National") return ["CBSE", "CISCE", "NIOS"].includes(batch.board);
        return batch.board === currentFilter;
      }
      return batch.category === currentFilter;
    });
  }

  if(search){
    list = list.filter(batch => {
      const text = [batch.board, batch.cls, batch.stream, batch.exam, batch.category, ...batch.subjects.map(s => s.name), ...batch.subjects.map(s => s.teacher)].join(" ").toLowerCase();
      return text.includes(search);
    });
  }

  document.getElementById("count").textContent = `${list.length} batches available`;

  if(!list.length){
    grid.innerHTML = `<div class="empty">😕 No batch found.<br>Try another board, class or exam.</div>`;
    return;
  }

  grid.innerHTML = list.map(batch => {
    const title = batch.type === "school" ? `${batch.board} — ${batch.cls}` : `${batch.exam} — ${batch.cls}`;
    const meta = batch.type === "school" ? `${batch.board} • ${batch.stream}` : `${batch.exam} • ${batch.stream}`;
    const visible = batch.subjects.slice(0,6);
    const more = batch.subjects.length - 6;

    return `
      <article class="card">
        <h2>${escapeHTML(title)}</h2>
        <div class="meta">${escapeHTML(meta)}</div>
        <div class="badges">
          ${visible.map(subject => `<span class="badge">${escapeHTML(subject.name)}</span>`).join("")}
          ${more > 0 ? `<span class="badge more">+${more} more</span>` : ""}
        </div>
        <div class="price">
          <strong>₹${batch.price}</strong>
          <span class="old">₹${batch.oldPrice}</span>
        </div>
        <div class="actions">
          <button class="viewBtn" onclick="viewSubjects('${batch.id}')">VIEW SUBJECTS</button>
          <button class="buyBtn" onclick="buy('${batch.id}')">BUY NOW</button>
        </div>
      </article>
    `;
  }).join("");
}

/* =========================================================
   SUBJECT MODAL
========================================================= */
function viewSubjects(id){
  const batch = batches.find(item => item.id === id);
  if(!batch) return;

  const title = batch.type === "school" ? `${batch.board} — ${batch.cls}` : `${batch.exam} — ${batch.cls}`;
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalMeta").textContent = batch.type === "school" ? `${batch.board} • ${batch.stream}` : `${batch.exam} • ${batch.stream}`;

  document.getElementById("subjectList").innerHTML = batch.subjects.map(subject => `
    <div class="subject">
      <div class="icon">${icons[subject.name] || "📚"}</div>
      <div>
        <div class="subjectName">${escapeHTML(subject.name)}</div>
        <div class="teacher">👨‍🏫 ${escapeHTML(subject.teacher)}</div>
      </div>
    </div>
  `).join("");

  document.getElementById("modalBuy").textContent = `BUY NOW — ₹${batch.price}`;
  document.getElementById("modalBuy").onclick = () => buy(batch.id);
  document.getElementById("overlay").classList.add("show");
}

function closeModal(){ document.getElementById("overlay").classList.remove("show"); }
function outsideClose(event){ if(event.target.id === "overlay") closeModal(); }

/* =========================================================
   BUY NOW (FIXED FOR CLASSROOM)
========================================================= */
function buy(id) {
  const batch = batches.find(item => item.id === id);
  if (!batch) return;

  const title = batch.type === "school" ? `${batch.board} — ${batch.cls} — ${batch.stream}` : `${batch.exam} — ${batch.cls} — ${batch.stream}`;
  const exactSubjects = batch.subjects.map(s => s.name);

  sessionStorage.setItem("tb_checkout_title", title);
  sessionStorage.setItem("tb_checkout_price", batch.price);
  sessionStorage.setItem("tb_checkout_tier", "Pro");
  sessionStorage.setItem("tb_checkout_subjects", JSON.stringify(exactSubjects));

  window.location.href = "payment.html";
}

/* =========================================================
   DASHBOARD BACK BUTTON & TABS
========================================================= */
function goDashboard(){ window.location.href = "dashboard.html"; }

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(item => item.classList.remove("active"));
    tab.classList.add("active");
    currentType = tab.dataset.type;
    currentFilter = "All";
    document.getElementById("schoolFilters").style.display = currentType === "school" ? "flex" : "none";
    document.getElementById("competitiveFilters").style.display = currentType === "competitive" ? "flex" : "none";
    renderFilters();
    render();
  });
});

document.getElementById("search").addEventListener("input", render);

function escapeHTML(value){
  return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

/* =========================================================
   START
========================================================= */
renderFilters();
render();
</script>

</body>
</html>
