<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicBull - Explore Batches</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.95); --accent-color: #2563eb; --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: rgba(255, 255, 255, 0.12); --success-color: #10b981; --input-bg: #0f172a; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); display:flex; flex-direction:column; height: 100vh; overflow-y:auto; }

        /* Top Nav */
        .top-nav { display:flex; justify-content:space-between; align-items:center; padding:20px; background:var(--card-bg); border-bottom:1px solid var(--border-color); position:sticky; top:0; z-index:50; }
        .back-btn { background:var(--input-bg); border:1px solid var(--border-color); color:#fff; padding:10px 14px; border-radius:12px; cursor:pointer; font-weight:700; }
        
        /* Category Filter */
        .cat-bar { display:flex; gap:10px; overflow-x:auto; padding:15px 20px; scrollbar-width:none; background:var(--bg-color); }
        .cat-bar::-webkit-scrollbar { display:none; }
        .cat-chip { background:var(--input-bg); border:1px solid var(--border-color); padding:10px 20px; border-radius:20px; font-size:13px; font-weight:700; white-space:nowrap; cursor:pointer; color:var(--text-muted); }
        .cat-chip.active { background:var(--accent-color); color:#fff; border-color:var(--accent-color); }

        /* Search */
        .search-box { padding:0 20px 15px; position:relative; }
        .search-box input { width:100%; background:var(--card-bg); border:1px solid var(--border-color); color:#fff; padding:15px 15px 15px 45px; border-radius:16px; font-size:14px; outline:none; }
        .search-box i { position:absolute; left:35px; top:50%; transform:translateY(-50%); color:var(--text-muted); margin-top:-7.5px; }

        /* Batch Grid */
        .batch-grid { padding: 0 20px 20px; display:flex; flex-direction:column; gap:15px; }
        .batch-card { background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(30,41,59,0.9)); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .b-tag { background: rgba(16, 185, 129, 0.15); color: var(--success-color); padding: 5px 12px; border-radius: 20px; font-size:11px; font-weight:800; display:inline-block; margin-bottom:10px;}
        .b-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
        .b-subjects { font-size: 11.5px; color:#f59e0b; font-weight: 600; margin-bottom: 12px; background: rgba(245, 158, 11, 0.1); padding: 8px 12px; border-radius: 10px; }
        .b-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; line-height:1.4; }
        
        .b-footer { display:flex; justify-content:space-between; border-top:1px solid var(--border-color); padding-top:15px; }
        .b-price { font-size:16px; font-weight:800; color:var(--success-color); }
        
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top:15px;}
        .btn-action { text-align:center; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; border:none; display:flex; justify-content:center; align-items:center; gap:6px; }
        .btn-buy { background: var(--accent-color); color: #fff; }
        .btn-details { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div class="top-nav">
        <button class="back-btn" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-arrow-left"></i> Back</button>
        <strong style="font-size:18px;">Explore Goals</strong>
        <i class="fa-solid fa-magnifying-glass" style="font-size:20px; color:var(--text-muted);"></i>
    </div>

    <div class="cat-bar" id="catBar">
        <div class="cat-chip active" onclick="filterCat('ALL', this)">All Batches</div>
        <div class="cat-chip" onclick="filterCat('CBSE', this)">CBSE Board</div>
        <div class="cat-chip" onclick="filterCat('STATE', this)">State Boards</div>
        <div class="cat-chip" onclick="filterCat('NEET', this)">NEET</div>
        <div class="cat-chip" onclick="filterCat('JEE', this)">IIT-JEE</div>
        <div class="cat-chip" onclick="filterCat('UPSC', this)">UPSC & PCS</div>
        <div class="cat-chip" onclick="filterCat('BANKING', this)">Banking & SSC</div>
        <div class="cat-chip" onclick="filterCategory('COMMERCE', this)">Commerce</div>
    </div>

    <div class="search-box">
        <i class="fa-solid fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search Class 9-12, NEET, UPSC..." onkeyup="searchBatches()">
    </div>

    <div class="batch-grid" id="batchGrid"></div>

    <script>
        if(!localStorage.getItem('ticbull_token')) window.location.href = "index.html";

        function generateAllIndiaBatches() {
            let list = [];
            
            const schoolSubs = "Math, Physics, Chem, Bio, History, Pol.Sci, Geo, Eco, English, Hindi, Computer, Sanskrit, Urdu";
            const pcmSubs = "Physics, Chemistry, Maths, English, Computer Science";
            const pcbSubs = "Physics, Chemistry, Biology, English, Physical Education";
            const comSubs = "Accountancy, Business Studies, Economics, Maths, English";
            const artSubs = "History, Political Science, Geography, Sociology, English, Hindi";

            // 1. CBSE BOARDS
            list.push({ id: 'cbse_9', cat: 'CBSE', name: 'CBSE Class 9th Target', tag: 'All Subjects', subs: schoolSubs, desc: 'Strict NCERT guidelines covering all major subjects.', price: 199 });
            list.push({ id: 'cbse_10', cat: 'CBSE', name: 'CBSE Class 10th Board Target', tag: 'Board Special', subs: schoolSubs, desc: 'Complete 10th Board syllabus with PYQs.', price: 199 });
            list.push({ id: 'cbse_11_pcm', cat: 'CBSE', name: 'CBSE Class 11th Science (PCM)', tag: 'Science Core', subs: pcmSubs, desc: 'Physics, Chem, Math, CS & English.', price: 249 });
            list.push({ id: 'cbse_11_pcb', cat: 'CBSE', name: 'CBSE Class 11th Science (PCB)', tag: 'Medical Base', subs: pcbSubs, desc: 'Physics, Chem, Bio, PE & English.', price: 249 });
            list.push({ id: 'cbse_11_com', cat: 'CBSE', name: 'CBSE Class 11th Commerce', tag: 'Commerce Core', subs: comSubs, desc: 'Accounts, BST, Eco, Math & English.', price: 249 });
            list.push({ id: 'cbse_11_art', cat: 'CBSE', name: 'CBSE Class 11th Arts', tag: 'Arts Core', subs: artSubs, desc: 'History, Polity, Geo, Sociology etc.', price: 249 });
            list.push({ id: 'cbse_12_pcm', cat: 'CBSE', name: 'CBSE Class 12th Science (PCM) Board', tag: 'Board Goal', subs: pcmSubs, desc: 'Target 95%+ in 12th Boards.', price: 249 });
            
            // 2. STATE BOARDS (Dynamic Generation to save lines)
            const states = [ {code:'BSEB', n:'Bihar Board'}, {code:'UP', n:'UP Board'}, {code:'MH', n:'Maharashtra Board'}, {code:'MP', n:'MP Board'} ];
            states.forEach(s => {
                list.push({ id: `${s.code}_10`, cat: 'STATE', name: `${s.n} 10th Matric`, tag: 'State Board', subs: schoolSubs, desc: `${s.n} SCERT Pattern.`, price: 149 });
                list.push({ id: `${s.code}_12`, cat: 'STATE', name: `${s.n} 12th Science`, tag: 'State Board', subs: pcmSubs, desc: `${s.n} specific guidelines.`, price: 199 });
            });

            // 3. COMPETITIVE EXAMS
            list.push({ id: 'neet_11', cat: 'NEET', name: 'NEET UG 11th Foundation', tag: 'Medical', subs: 'Physics, Chemistry, Botany, Zoology', desc: 'Class 11 syllabus + NEET level depth.', price: 299 });
            list.push({ id: 'neet_drop', cat: 'NEET', name: 'NEET UG Dropper Victory', tag: 'Target 720', subs: 'Physics, Physical/Organic/Inorganic Chem, Bot, Zoo', desc: 'Complete 11th+12th syllabus strictly for NTA NEET.', price: 399 });
            
            list.push({ id: 'jee_11', cat: 'JEE', name: 'IIT-JEE 11th Foundation', tag: 'Engg.', subs: 'Mathematics, Physics, Chemistry', desc: 'Class 11 syllabus + JEE Mains & Adv level.', price: 299 });
            list.push({ id: 'jee_drop', cat: 'JEE', name: 'IIT-JEE Dropper Momentum', tag: 'Target IIT', subs: 'Advanced Math, Mechanics, Electro, Chem', desc: 'Advanced Mechanics, Calculus & Chem for Droppers.', price: 399 });
            
            list.push({ id: 'upsc_ias', cat: 'UPSC', name: 'UPSC Civil Services (IAS)', tag: 'Govt. Elite', subs: 'Polity, Geography, History, Economics, CSAT', desc: 'Complete Pre + Mains Foundation.', price: 499 });
            list.push({ id: 'banking_po', cat: 'BANKING', name: 'IBPS PO & SBI PO', tag: 'Bank Officer', subs: 'Quant, Reasoning, English, General Awareness', desc: 'Complete Banking syllabus.', price: 249 });
            list.push({ id: 'nda_cds', cat: 'DEFENSE', name: 'NDA & CDS Defense Academy', tag: 'Armed Forces', subs: 'NDA Mathematics, English, Gen Science, Gen Studies', desc: 'Maths & General Ability Test Specialist.', price: 249 });

            return list;
        }

        const allBatches = generateAllIndiaBatches();

        function renderBatches(arr) {
            const grid = document.getElementById('batchGrid');
            grid.innerHTML = '';
            
            if(arr.length === 0) {
                grid.innerHTML = '<p style="text-align:center; padding:20px; color:var(--text-muted);">No batches found.</p>';
                return;
            }

            arr.forEach(b => {
                grid.innerHTML += `
                    <div class="batch-card">
                        <div class="b-tag">${b.tag}</div>
                        <div class="b-title">${b.name}</div>
                        <div class="b-subjects"><i class="fa-solid fa-book-open-reader"></i> Subjects: ${b.subs}</div>
                        <div class="b-desc">${b.desc}</div>
                        <div class="b-footer">
                            <div><span style="font-size:11px; color:var(--text-muted); display:block;">Starting from</span><span class="b-price">₹${b.price}/yr</span></div>
                        </div>
                        <div class="btn-row">
                            <!-- ROUTE TO FILE 4 (PAYMENT) -->
                            <button class="btn-action btn-buy" onclick="routeToPayment('${b.id}', '${b.name}')"><i class="fa-solid fa-cart-shopping"></i> Buy Now</button>
                            <button class="btn-action btn-details" onclick="alert('Subject/Teacher details coming soon')">View Details</button>
                        </div>
                    </div>`;
            });
        }

        function filterCat(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderBatches(cat === 'ALL' ? allBatches : allBatches.filter(b => b.cat === cat));
        }

        function searchBatches() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderBatches(allBatches.filter(b => b.name.toLowerCase().includes(query) || b.cat.toLowerCase().includes(query)));
        }

        function routeToPayment(id, name) {
            sessionStorage.setItem("tb_selected_batch_id", id);
            sessionStorage.setItem("tb_selected_batch_name", name);
            window.location.href = "payment.html"; // Goes to File 4
        }

        window.onload = () => renderBatches(allBatches);
    </script>
</body>
</html>
