function uniqueTeacher(){
  const f = firstNames[teacherCounter % firstNames.length];
  const l = lastNames[Math.floor(teacherCounter / firstNames.length) % lastNames.length];
  const cycle = Math.floor(teacherCounter / (firstNames.length * lastNames.length));
  teacherCounter++;

  return cycle === 0
    ? `Prof. ${f} ${l}`
    : `Prof. ${f} ${l} ${cycle + 1}`;
}

function makeBatch({
  type,
  board="",
  cls="",
  stream="",
  exam="",
  category="",
  subjects,
  price=149
}){

  const subjectData = subjects.map(s => ({
    name:s,
    teacher:uniqueTeacher()
  }));

  batches.push({
    id,
    type,
    board,
    cls,
    stream,
    exam,
    category,
    price,
    oldPrice:price * 2,
    subjects:subjectData
  });
}

   FILTERS
========================= */

const schoolFilters = ["All","National","Andhra Pradesh","Assam","Bihar","Chhattisgarh","Delhi","Gujarat","Haryana","Himachal Pradesh","Jharkhand","Jammu & Kashmir","Karnataka","Kerala","Madhya Pradesh","Maharashtra","Odisha","Punjab","Rajasthan","Tamil Nadu","Telangana","Uttar Pradesh","Uttarakhand","West Bengal"];

const competitiveFilters = ["All","Medical","Engineering","University Entrance","UPSC","SSC","Banking","Defence","Law","Teaching","Railway","Agriculture","Management","Design","Science Entrance","Government Exams"];

function renderFilters(){
  const target = currentType === "school" ? document.getElementById("schoolFilters") : document.getElementById("competitiveFilters");
  target.innerHTML = "";

  const arr = currentType === "school" ? schoolFilters : competitiveFilters;
  arr.forEach(f=>{
    const b=document.createElement("button");
    b.className="filter"+(currentFilter===f?" active":"");
    b.textContent=f;
    b.onclick=()=>{
      currentFilter=f;
      renderFilters();
      render();
    };
    target.appendChild(b);
  });
}


/* =========================
   RENDER CARDS
========================= */

function render(){
  const grid=document.getElementById("grid");
  const search=document.getElementById("search").value.toLowerCase().trim();

  let list=batches.filter(b=>b.type===currentType);

  if(currentFilter!=="All"){
    list=list.filter(b=>{
      if(currentType==="school"){
        if(currentFilter==="National"){ return ["CBSE","CISCE","NIOS"].includes(b.board); }
        return b.board===currentFilter;
      }
      return b.category===currentFilter;
    });
  }

  if(search){
    list=list.filter(b=>{
      const text=[b.board, b.cls, b.stream, b.exam, b.category, ...b.subjects.map(x=>x.name), ...b.subjects.map(x=>x.teacher)].join(" ").toLowerCase();
      return text.includes(search);
    });
  }

  document.getElementById("count").textContent = `${list.length} batches available`;

  if(!list.length){
    grid.innerHTML=`<div class="empty">😕 No batch found.<br>Try another board, class or exam.</div>`;
    return;
  }

  grid.innerHTML=list.map(b=>{
    const title = b.type==="school" ? `${b.board} — ${b.cls}` : `${b.exam} — ${b.cls}`;
    const meta = b.type==="school" ? `${b.board} • ${b.stream}` : `${b.exam} • ${b.stream}`;
    const visible=b.subjects.slice(0,6);
    const more=b.subjects.length-6;

    return `
      <article class="card">
        <h2>${escapeHTML(title)}</h2>
        <div class="meta">${escapeHTML(meta)}</div>

        <div class="badges">
          ${visible.map(s=>`<span class="badge">${escapeHTML(s.name)}</span>`).join("")}
          ${more>0 ? `<span class="badge more">+${more} more</span>` : ""}
        </div>

        <div class="price">
          <strong>₹${b.price}</strong>
          <span class="old">₹${b.oldPrice}</span>
        </div>

        <div class="actions">
          <button class="viewBtn" onclick="viewSubjects('${b.id}')">VIEW SUBJECTS</button>
          <button class="buyBtn" onclick="buy('${b.id}')">BUY NOW</button>
        </div>
      </article>
    `;
  }).join("");
}


/* =========================
   SUBJECT DETAILS
========================= */

function viewSubjects(id){
  const b=batches.find(x=>x.id===id);
  if(!b)return;

  const title = b.type==="school" ? `${b.board} — ${b.cls}` : `${b.exam} — ${b.cls}`;
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalMeta").textContent = b.type==="school" ? `${b.board} • ${b.stream}` : `${b.exam} • ${b.stream}`;

  const list=document.getElementById("subjectList");
  list.innerHTML=b.subjects.map(s=>`
    <div class="subject">
      <div class="icon">${icons[s.name] || "📚"}</div>
      <div>
        <div class="subjectName">${escapeHTML(s.name)}</div>
        <div class="teacher">👩‍🏫 ${escapeHTML(s.teacher)}</div>
      </div>
    </div>
  `).join("");

  document.getElementById("modalBuy").textContent = `BUY NOW — ₹${b.price}`;
  document.getElementById("modalBuy").onclick=()=> buy(b.id);
  document.getElementById("overlay").classList.add("show");
  document.getElementById("backBtn").classList.add("show");
}

function closeModal(){
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("backBtn").classList.remove("show");
}

function outsideClose(e){
  if(e.target.id==="overlay") closeModal();
}

function goBack(){
  closeModal();
}


/* =========================
   INTEGRATED BUY FUNCTION
========================= */

function buy(id){
  const b = batches.find(x=>x.id===id);
  if(!b) return;

  const title = b.type === "school" ? `${b.board} — ${b.cls}` : `${b.exam} — ${b.cls}`;

  // Store data in sessionStorage for payment.html to retrieve
  sessionStorage.setItem('tb_checkout_title', title);
  sessionStorage.setItem('tb_checkout_price', b.price);
  sessionStorage.setItem('tb_checkout_tier', 'Pro'); // Default tier assignment

  // Redirect to Payment Gateway
  window.location.href = 'payment.html';
}


/* =========================
   TAB SWITCH & SEARCH
========================= */

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    tab.classList.add("active");
    currentType=tab.dataset.type;
    currentFilter="All";
    document.getElementById("schoolFilters").style.display = currentType==="school" ? "flex" : "none";
    document.getElementById("competitiveFilters").style.display = currentType==="competitive" ? "flex" : "none";
    renderFilters();
    render();
  });
});

document.getElementById("search").addEventListener("input",render);

function escapeHTML(value){
  return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

/* =========================
   START
========================= */
renderFilters();
render();
</script>
</body>
</html>
