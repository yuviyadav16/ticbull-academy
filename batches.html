<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TicBull Academy - Explore Batches</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --bg-color: #030712; --card-bg: #0f172a; --accent-color: #2563eb; --accent-glow: rgba(37, 99, 235, 0.45); --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: rgba(255, 255, 255, 0.12); --success-color: #10b981; --gold-color: #f59e0b; --input-bg: #1e293b; }
        body.light-theme { --bg-color: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border-color: #cbd5e1; --input-bg: #ffffff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: var(--text-main); display:flex; flex-direction:column; min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s; }

        /* TOP BAR */
        .top-bar { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; z-index:50; background: var(--card-bg); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; }
        .back-btn { background:transparent; border:none; color:var(--text-main); font-size:18px; cursor:pointer; display:flex; align-items:center; gap:12px; font-weight:800; }
        .menu-btn { background:var(--input-bg); border:1px solid var(--border-color); color:var(--text-main); font-size:16px; padding:8px 12px; border-radius:10px; cursor:pointer; }
        
        /* SEARCH & FILTER */
        .search-area { padding: 15px 20px 5px; background: var(--bg-color); }
        .search-box { position: relative; width: 100%; }
        .search-box input { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 14px 20px 14px 45px; border-radius: 16px; font-size: 14px; outline: none; }
        .search-box i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 15px; }

        .category-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 10px 20px 15px; scrollbar-width: none; background: var(--bg-color); }
        .category-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; }
        .cat-chip.active { background: #9f1239; color: #fff; border-color: #9f1239; } 

        /* FIXED ASPECT RATIO / GRID CONTAINER */
        .batches-container { flex: 1; padding: 10px 20px 30px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
        
        /* DYNAMIC HEIGHT BATCH CARD FIXED RATIO */
        .batch-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 18px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; min-height: 180px; height: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .batch-card::before { content:''; position:absolute; top:0; left:0; width:5px; height:100%; background: #9f1239; border-radius: 18px 0 0 18px; }
        .batch-tag { background: rgba(16, 185, 129, 0.15); color: var(--success-color); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; display: inline-block; margin-bottom: 8px; text-transform: uppercase; border: 1px solid rgba(16, 185, 129, 0.3); align-self: flex-start; }
        .batch-title { font-size: 17px; font-weight: 800; color: var(--text-main); margin-bottom: 6px; }
        .batch-desc { font-size: 12.5px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.4; }
        
        .batch-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: auto; }
        .batch-price { font-size: 17px; font-weight: 800; color: var(--success-color); }
        .batch-price-sub { font-size: 10px; color: var(--text-muted); display: block; font-weight: 800; text-transform: uppercase; }
        
        .btn-row { display: flex; gap: 8px; }
        .btn-details { background: transparent; color: var(--text-main); font-weight: 700; padding: 8px 14px; border: 1px solid var(--border-color); border-radius: 10px; cursor: pointer; font-size: 12px; }
        .btn-buy { background: #9f1239; color: #fff; font-weight: 700; padding: 8px 14px; border: none; border-radius: 10px; cursor: pointer; font-size: 12px; }

        /* MODALS */
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; display:none; justify-content:center; align-items:center; padding:16px; backdrop-filter: blur(5px); }
        .modal-card { background:var(--card-bg); border:1px solid var(--border-color); border-radius:24px; padding:22px; max-width:420px; width:100%; text-align:left; position:relative; max-height: 90vh; display: flex; flex-direction: column; }
        
        .sub-list-container { overflow-y: auto; margin-top: 15px; padding-right: 5px; flex: 1; }
        .sub-card { display: flex; align-items: center; gap: 12px; background: var(--input-bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom:10px; }
        .sub-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(159, 18, 57, 0.1); color: #9f1239; display: flex; justify-content: center; align-items: center; font-size: 18px; border: 1px solid rgba(159, 18, 57, 0.2); }
        
        .tier-card { border: 2px solid var(--border-color); border-radius: 14px; padding: 12px; margin-bottom: 10px; cursor: pointer; background: var(--input-bg); }
        .tier-card.selected { border-color: #9f1239; background: rgba(159, 18, 57, 0.05); }
        .btn-primary { width:100%; background: #9f1239; color:#fff; font-weight:800; padding:14px; border:none; border-radius:12px; cursor:pointer; font-size:14px; margin-top:10px; }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-arrow-left"></i> TicBull Batches</button>
    </div>

    <!-- SEARCH & FILTER -->
    <div class="search-area">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search 300+ Boards, NEET, JEE..." onkeyup="filterRender()">
        </div>
    </div>

    <div class="category-scroll">
        <div class="cat-chip active" onclick="setCategory('ALL', this)">All Batches</div>
        <div class="cat-chip" onclick="setCategory('CBSE', this)">CBSE Board</div>
        <div class="cat-chip" onclick="setCategory('ICSE', this)">ICSE/NIOS</div>
        <div class="cat-chip" onclick="setCategory('STATE', this)">State Boards</div>
        <div class="cat-chip" onclick="setCategory('NEET', this)">NEET (Medical)</div>
        <div class="cat-chip" onclick="setCategory('JEE', this)">JEE (Engg.)</div>
        <div class="cat-chip" onclick="setCategory('UPSC', this)">UPSC & Govt</div>
    </div>

    <!-- BATCHES LIST -->
    <div class="batches-container" id="batchesList"></div>

    <!-- DETAILS MODAL -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal-card">
            <i class="fa-solid fa-xmark" style="position:absolute; right:16px; top:16px; color:var(--text-muted); cursor:pointer; font-size:20px;" onclick="document.getElementById('detailsModal').style.display='none';"></i>
            <h3 id="detailsTitle" style="font-size:18px; margin-bottom:4px; color:var(--text-main);">Batch Details</h3>
            <p style="font-size:12px; color:var(--text-muted);">Strictly Separate Subjects & Expert Faculty</p>
            <div id="detailsSubjectsList" class="sub-list-container"></div>
            <button class="btn-primary" onclick="openPricingFromDetails()">BUY THIS BATCH</button>
        </div>
    </div>

    <!-- PRICING MODAL -->
    <div class="modal-overlay" id="pricingModal">
        <div class="modal-card">
            <i class="fa-solid fa-xmark" style="position:absolute; right:16px; top:16px; color:var(--text-muted); cursor:pointer; font-size:20px;" onclick="document.getElementById('pricingModal').style.display='none';"></i>
            <h3 style="font-size:18px; margin-bottom:4px; color:var(--text-main);"><i class="fa-solid fa-crown" style="color:var(--gold-color);"></i> Select Plan</h3>
            <p id="pricingBatchTitle" style="font-size:12px; color:var(--text-muted); margin-bottom:15px;"></p>

            <div class="tier-card" id="tierBasic" onclick="selectTier('Basic')">
                <div style="display:flex; justify-content:space-between; font-weight:800; color:var(--text-main);"><span>Basic Pass</span> <span id="priceBasic" style="color:var(--success-color)">₹199</span></div>
                <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">20 Doubts/Day + Complete Syllabus</div>
            </div>

            <div class="tier-card selected" id="tierPro" onclick="selectTier('Pro')">
                <div style="display:flex; justify-content:space-between; font-weight:800; color:var(--text-main);"><span>Pro Pass</span> <span id="pricePro" style="color:var(--success-color)">₹399</span></div>
                <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">50 Doubts/Day + AI High Speed</div>
            </div>

            <button class="btn-primary" onclick="proceedToPayment()">PROCEED TO PAYMENT</button>
        </div>
    </div>

    <script>
        var currentCategory = 'ALL';
        var selectedBatchObj = null;
        var selectedTier = 'Pro';
        var allBatchesCache = [];

        // STRICT SUBJECT MAPPING (NO MIXING, FULLY DETAILED)
        var subjectMapping = {
            'Foundation': [
                { name: 'Physics', teacher: 'Mr. HC Verma', icon: 'fa-atom' },
                { name: 'Chemistry', teacher: 'Mr. Das', icon: 'fa-flask' },
                { name: 'Biology', teacher: 'Ms. Priya', icon: 'fa-dna' },
                { name: 'Mathematics', teacher: 'Mr. Sharma', icon: 'fa-calculator' },
                { name: 'History', teacher: 'Mr. Bipin', icon: 'fa-landmark' },
                { name: 'Geography', teacher: 'Ms. Majid', icon: 'fa-earth-americas' },
                { name: 'Political Science', teacher: 'Mr. Laxmikanth', icon: 'fa-scale-balanced' },
                { name: 'Economics', teacher: 'Mr. Jain', icon: 'fa-chart-line' },
                { name: 'English', teacher: 'Ms. Riya', icon: 'fa-book-open' },
                { name: 'Hindi', teacher: 'Mr. Tiwari', icon: 'fa-language' }
            ],
            'PCM': [
                { name: 'Physics', teacher: 'Mr. HC Verma', icon: 'fa-atom' },
                { name: 'Chemistry', teacher: 'Mr. Das', icon: 'fa-flask' },
                { name: 'Mathematics', teacher: 'Mr. Sharma', icon: 'fa-calculator' },
                { name: 'English', teacher: 'Ms. Riya', icon: 'fa-book-open' }
            ],
            'PCB': [
                { name: 'Physics', teacher: 'Mr. HC Verma', icon: 'fa-atom' },
                { name: 'Chemistry', teacher: 'Mr. Das', icon: 'fa-flask' },
                { name: 'Botany', teacher: 'Ms. Kavita', icon: 'fa-leaf' },
                { name: 'Zoology', teacher: 'Ms. Priya', icon: 'fa-frog' },
                { name: 'English', teacher: 'Ms. Riya', icon: 'fa-book-open' }
            ],
            'Commerce': [
                { name: 'Accountancy', teacher: 'Mr. Bansal', icon: 'fa-file-invoice-dollar' },
                { name: 'Business Studies', teacher: 'Ms. Pooja', icon: 'fa-briefcase' },
                { name: 'Economics', teacher: 'Mr. Jain', icon: 'fa-chart-line' },
                { name: 'Mathematics', teacher: 'Mr. Sharma', icon: 'fa-calculator' },
                { name: 'English', teacher: 'Ms. Riya', icon: 'fa-book-open' }
            ],
            'Arts': [
                { name: 'History', teacher: 'Mr. Bipin', icon: 'fa-landmark' },
                { name: 'Geography', teacher: 'Ms. Majid', icon: 'fa-earth-americas' },
                { name: 'Political Science', teacher: 'Mr. Laxmikanth', icon: 'fa-scale-balanced' },
                { name: 'Economics', teacher: 'Mr. Jain', icon: 'fa-chart-line' },
                { name: 'English', teacher: 'Ms. Riya', icon: 'fa-book-open' }
            ],
            'JEE': [
                { name: 'Advanced Physics', teacher: 'Mr. HC Verma', icon: 'fa-atom' },
                { name: 'Physical Chemistry', teacher: 'Mr. Das', icon: 'fa-flask' },
                { name: 'Organic & Inorganic Chemistry', teacher: 'Ms. Neha', icon: 'fa-vial' },
                { name: 'Advanced Mathematics', teacher: 'Mr. Sharma', icon: 'fa-square-root-variable' }
            ],
            'NEET': [
                { name: 'Medical Physics', teacher: 'Mr. HC Verma', icon: 'fa-atom' },
                { name: 'Physical Chemistry', teacher: 'Mr. Das', icon: 'fa-flask' },
                { name: 'Organic & Inorganic Chemistry', teacher: 'Ms. Neha', icon: 'fa-vial' },
                { name: 'Botany', teacher: 'Ms. Kavita', icon: 'fa-leaf' },
                { name: 'Zoology', teacher: 'Ms. Priya', icon: 'fa-frog' }
            ],
            'UPSC': [
                { name: 'Polity & Governance', teacher: 'Mr. Laxmikanth', icon: 'fa-scale-balanced' },
                { name: 'History & Culture', teacher: 'Mr. Bipin', icon: 'fa-landmark' },
                { name: 'Geography & Environment', teacher: 'Ms. Majid', icon: 'fa-earth-asia' },
                { name: 'Economy', teacher: 'Mr. Jain', icon: 'fa-chart-line' },
                { name: 'CSAT', teacher: 'Mr. Sharma', icon: 'fa-brain' }
            ]
        };

        // 300+ BATCHES GENERATION ENGINE (FULL INDIA COVERAGE)
        function generateAllBatches() {
            var list = [];
            var allBoards = [
                "CBSE", "CISCE/ICSE", "NIOS", "Bihar Board (BSEB)", "UP Board (UPMSP)", 
                "Jharkhand Board (JAC)", "West Bengal Board (WBBSE)", "Odisha Board", 
                "Chhattisgarh Board", "Madhya Pradesh Board", "Rajasthan Board", 
                "Haryana Board", "Punjab Board", "Himachal Pradesh Board", 
                "Uttarakhand Board", "J&K Board", "Maharashtra Board", 
                "Gujarat Board", "Goa Board", "Karnataka Board", 
                "Kerala Board", "Tamil Nadu Board", "Andhra Pradesh Board", 
                "Telangana Board", "Assam Board", "Meghalaya Board", 
                "Mizoram Board", "Manipur Board", "Nagaland Board", 
                "Tripura Board", "Sikkim Board"
            ];

            // 31 Boards * 10 Classes = 310 Batches Generated here dynamically
            for(var i=0; i<allBoards.length; i++) {
                var board = allBoards[i];
                var cat = board.indexOf('CBSE') !== -1 ? 'CBSE' : (board.indexOf('ICSE') !== -1 || board.indexOf('NIOS') !== -1 ? 'ICSE' : 'STATE');
                var shortName = board.split(' ')[0];

                list.push({ id: 'b_' + i + '_9', cat: cat, tag: shortName + ' Board', title: board + ' Class 9', type: 'Foundation', desc: 'Separate Physics, Chem, Bio, Hist, Geo, Polity, Maths, Eng.', p_basic: 199, p_pro: 399 });
                list.push({ id: 'b_' + i + '_10', cat: cat, tag: shortName + ' Board', title: board + ' Class 10', type: 'Foundation', desc: 'Target Board Exams with 10 Separate subjects & Expert Faculty.', p_basic: 199, p_pro: 399 });
                
                list.push({ id: 'b_' + i + '_11pcm', cat: cat, tag: shortName + ' Board', title: board + ' Class 11 Science (PCM)', type: 'PCM', desc: 'Strictly Physics, Chemistry, Maths & English.', p_basic: 299, p_pro: 599 });
                list.push({ id: 'b_' + i + '_11pcb', cat: cat, tag: shortName + ' Board', title: board + ' Class 11 Science (PCB)', type: 'PCB', desc: 'Strictly Physics, Chemistry, Botany, Zoology & English.', p_basic: 299, p_pro: 599 });
                list.push({ id: 'b_' + i + '_11com', cat: cat, tag: shortName + ' Board', title: board + ' Class 11 Commerce', type: 'Commerce', desc: 'Accountancy, BST, Economics, Maths & English.', p_basic: 299, p_pro: 599 });
                list.push({ id: 'b_' + i + '_11art', cat: cat, tag: shortName + ' Board', title: board + ' Class 11 Humanities', type: 'Arts', desc: 'History, Geography, Polity, Economics & English.', p_basic: 299, p_pro: 599 });

                list.push({ id: 'b_' + i + '_12pcm', cat: cat, tag: shortName + ' Board', title: board + ' Class 12 Science (PCM)', type: 'PCM', desc: 'Strictly Physics, Chemistry, Maths & English.', p_basic: 299, p_pro: 599 });
                list.push({ id: 'b_' + i + '_12pcb', cat: cat, tag: shortName + ' Board', title: board + ' Class 12 Science (PCB)', type: 'PCB', desc: 'Strictly Physics, Chemistry, Botany, Zoology & English.', p_basic: 299, p_pro: 599 });
                list.push({ id: 'b_' + i + '_12com', cat: cat, tag: shortName + ' Board', title: board + ' Class 12 Commerce', type: 'Commerce', desc: 'Accountancy, BST, Economics, Maths & English.', p_basic: 299, p_pro: 599 });
                list.push({ id: 'b_' + i + '_12art', cat: cat, tag: shortName + ' Board', title: board + ' Class 12 Humanities', type: 'Arts', desc: 'History, Geography, Polity, Economics & English.', p_basic: 299, p_pro: 599 });
            }

            // Competitive Exams Added
            list.push({ id: 'c_neet', cat: 'NEET', tag: 'NEET Target', title: 'NEET-UG 2027/28 Preparation', type: 'NEET', desc: 'Physics, Chemistry, Botany & Zoology (No Maths).', p_basic: 499, p_pro: 999 });
            list.push({ id: 'c_jee', cat: 'JEE', tag: 'IIT-JEE', title: 'JEE Main & Advanced 2027/28', type: 'JEE', desc: 'Advanced Physics, Chemistry & Maths (No Bio).', p_basic: 499, p_pro: 999 });
            list.push({ id: 'c_upsc', cat: 'UPSC', tag: 'UPSC Goal', title: 'UPSC Civil Services Foundation', type: 'UPSC', desc: 'Polity, History, Geography, Economics & CSAT.', p_basic: 399, p_pro: 799 });

            return list;
        }

        allBatchesCache = generateAllBatches();

        function renderBatches() {
            var container = document.getElementById('batchesList');
            var search = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            var filtered = allBatchesCache.filter(function(b) {
                var matchesCat = (currentCategory === 'ALL' || b.cat === currentCategory);
                var matchesSearch = b.title.toLowerCase().indexOf(search) !== -1 || b.desc.toLowerCase().indexOf(search) !== -1;
                return matchesCat && matchesSearch;
            });

            if(filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">No batches found.</div>';
                return;
            }

            var finalHTML = '';
            for(var i=0; i<filtered.length; i++) {
                var b = filtered[i];
                finalHTML += '<div class="batch-card">' +
                    '<span class="batch-tag">' + b.tag + '</span>' +
                    '<div class="batch-title">' + b.title + '</div>' +
                    '<div class="batch-desc">' + b.desc + '</div>' +
                    '<div class="batch-footer">' +
                        '<div><span class="batch-price-sub">Starting From</span><span class="batch-price">₹' + b.p_basic + '/yr</span></div>' +
                        '<div class="btn-row">' +
                            '<button class="btn-details" onclick="openDetails(\'' + b.id + '\')">Details</button>' +
                            '<button class="btn-buy" onclick="openPricing(\'' + b.id + '\')">Buy Pass</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }
            container.innerHTML = finalHTML;
        }

        function setCategory(cat, el) {
            currentCategory = cat;
            var chips = document.querySelectorAll('.cat-chip');
            for(var i=0; i<chips.length; i++) { chips[i].classList.remove('active'); }
            if(el) el.classList.add('active');
            renderBatches();
        }

        function filterRender() { renderBatches(); }

        function openDetails(id) {
            for(var i=0; i<allBatchesCache.length; i++) { if(allBatchesCache[i].id === id) selectedBatchObj = allBatchesCache[i]; }
            document.getElementById('detailsTitle').innerText = selectedBatchObj.title;
            var subs = subjectMapping[selectedBatchObj.type] || subjectMapping['Foundation'];
            
            var html = '';
            for(var j=0; j<subs.length; j++) {
                html += '<div class="sub-card"><div class="sub-icon"><i class="fa-solid ' + subs[j].icon + '"></i></div><div><h4 style="color:var(--text-main); font-size:14px; margin-bottom:2px;">' + subs[j].name + '</h4><small style="color:var(--gold-color); font-weight:700;"><i class="fa-solid fa-chalkboard-user"></i> Faculty: ' + subs[j].teacher + '</small></div></div>';
            }
            document.getElementById('detailsSubjectsList').innerHTML = html;
            document.getElementById('detailsModal').style.display = 'flex';
        }

        function openPricingFromDetails() {
            document.getElementById('detailsModal').style.display = 'none';
            openPricing(selectedBatchObj.id);
        }

        function openPricing(id) {
            for(var i=0; i<allBatchesCache.length; i++) { if(allBatchesCache[i].id === id) selectedBatchObj = allBatchesCache[i]; }
            document.getElementById('pricingBatchTitle').innerText = selectedBatchObj.title;
            document.getElementById('priceBasic').innerText = '₹' + selectedBatchObj.p_basic;
            document.getElementById('pricePro').innerText = '₹' + selectedBatchObj.p_pro;
            document.getElementById('pricingModal').style.display = 'flex';
        }

        function selectTier(tier) {
            selectedTier = tier;
            document.getElementById('tierBasic').classList.remove('selected');
            document.getElementById('tierPro').classList.remove('selected');
            if(tier === 'Basic') document.getElementById('tierBasic').classList.add('selected');
            if(tier === 'Pro') document.getElementById('tierPro').classList.add('selected');
        }

        function proceedToPayment() {
            var price = (selectedTier === 'Basic') ? selectedBatchObj.p_basic : selectedBatchObj.p_pro;
            sessionStorage.setItem('tb_checkout_title', selectedBatchObj.title);
            sessionStorage.setItem('tb_checkout_price', price);
            window.location.href = 'payment.html';
        }

        window.onload = function() { renderBatches(); };
    </script>
</body>
</html>
