<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>TicBull Academy — Batches</title>

<style>
:root{
 --bg:#05070d;
 --panel:#0e1628;
 --card:#18243a;
 --line:#2b3a53;
 --text:#f6f7fb;
 --muted:#9ca9bf;
 --accent:#d4144f;
 --gold:#ffab18;
 --green:#21c77a;
}

*{box-sizing:border-box}

body{
 margin:0;
 background:radial-gradient(circle at top,#101b31 0,#05070d 48%);
 font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
 color:var(--text);
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:rgba(5,7,13,.94);
 backdrop-filter:blur(16px);
 border-bottom:1px solid #1e2a40;
}

.top{
 padding:18px 16px 12px;
 max-width:1200px;
 margin:auto;
}

.brand{
 font-size:25px;
 font-weight:900;
}

.brand span{
 color:var(--gold);
}

.sub{
 color:var(--muted);
 font-size:13px;
 margin-top:4px;
}

.search{
 margin-top:14px;
 display:flex;
 gap:8px;
}

.search input{
 width:100%;
 background:#111b2d;
 border:1px solid var(--line);
 color:white;
 border-radius:14px;
 padding:14px;
 outline:none;
 font-size:15px;
}

.tabs{
 display:flex;
 gap:8px;
 overflow:auto;
 padding:10px 16px;
 max-width:1200px;
 margin:auto;
}

.tab{
 white-space:nowrap;
 border:1px solid var(--line);
 background:#101a2c;
 color:#cbd5e1;
 border-radius:999px;
 padding:9px 14px;
 font-weight:800;
 cursor:pointer;
}

.tab.active{
 background:var(--accent);
 border-color:var(--accent);
 color:#fff;
}

.filters{
 display:flex;
 gap:8px;
 overflow:auto;
 padding:4px 16px 14px;
 max-width:1200px;
 margin:auto;
}

.filter{
 white-space:nowrap;
 border:1px solid var(--line);
 background:#101a2c;
 color:#cbd5e1;
 border-radius:999px;
 padding:8px 13px;
 font-size:12px;
 font-weight:800;
 cursor:pointer;
}

.filter.active{
 background:#273650;
 color:#fff;
}

main{
 max-width:1200px;
 margin:auto;
 padding:18px 16px 50px;
}

.count{
 color:var(--muted);
 margin-bottom:15px;
 font-size:13px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
}

.card{
 background:linear-gradient(145deg,#17243a,#111b2d);
 border:1px solid #293952;
 border-radius:20px;
 padding:18px;
 box-shadow:0 12px 35px #0005;
}

.card h3{
 margin:0 0 5px;
 font-size:18px;
}

.card .meta{
 color:var(--muted);
 font-size:13px;
 margin-bottom:13px;
}

.tags{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-bottom:15px;
}

.tag{
 background:#202d43;
 color:#d7deea;
 padding:6px 8px;
 border-radius:8px;
 font-size:11px;
 font-weight:700;
}

.price{
 font-size:22px;
 color:var(--gold);
 font-weight:900;
}

.old{
 color:#718096;
 text-decoration:line-through;
 font-size:12px;
 margin-left:5px;
}

.actions{
 display:flex;
 gap:8px;
 margin-top:14px;
}

.btn{
 flex:1;
 border:0;
 border-radius:12px;
 padding:12px 10px;
 font-weight:900;
 cursor:pointer;
}

.details{
 background:#202d43;
 color:white;
}

.buy{
 background:var(--accent);
 color:white;
}

.empty{
 padding:35px;
 text-align:center;
 color:var(--muted);
 border:1px dashed #33445f;
 border-radius:18px;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:50;
 background:#000b;
 align-items:center;
 justify-content:center;
 padding:16px;
}

.modal.show{
 display:flex;
}

.box{
 width:min(680px,100%);
 max-height:90vh;
 overflow:auto;
 background:#0d1628;
 border:1px solid #30415e;
 border-radius:26px;
 padding:20px;
 position:relative;
}

.close{
 position:absolute;
 right:16px;
 top:12px;
 background:none;
 border:0;
 color:#9aa8bd;
 font-size:32px;
 cursor:pointer;
}

.box h2{
 margin:0 45px 5px 0;
}

.crumb{
 color:#94a3b8;
 margin-bottom:16px;
}

.subject{
 display:flex;
 align-items:center;
 gap:12px;
 background:#1b2940;
 border:1px solid #34435a;
 border-radius:16px;
 padding:13px;
 margin:9px 0;
}

.icon{
 width:40px;
 height:40px;
 display:grid;
 place-items:center;
 background:#2a1830;
 border-radius:12px;
 font-size:21px;
 flex-shrink:0;
}

.sname{
 font-weight:900;
}

.teacher{
 color:var(--gold);
 font-weight:800;
 font-size:13px;
 margin-top:4px;
}

.chat{
 margin-left:auto;
 background:#273a54;
 color:#fff;
 border:1px solid #3a506e;
 border-radius:10px;
 padding:8px 10px;
 font-weight:800;
 cursor:pointer;
}

.buybig{
 width:100%;
 margin-top:15px;
 background:var(--accent);
 color:white;
 border:0;
 border-radius:14px;
 padding:15px;
 font-weight:900;
 font-size:16px;
 cursor:pointer;
}

.note{
 font-size:12px;
 color:#8fa0b8;
 line-height:1.5;
 margin-top:14px;
}

.notice{
 background:#101d32;
 border:1px solid #2a3c57;
 padding:12px;
 border-radius:14px;
 color:#b7c5d8;
 font-size:12px;
 margin-bottom:15px;
}

@media(max-width:850px){
 .grid{
  grid-template-columns:repeat(2,1fr);
 }
}

@media(max-width:560px){
 .grid{
  grid-template-columns:1fr;
 }
 .box{
  padding:16px;
 }
 .subject{
  align-items:flex-start;
 }
 .chat{
  margin-left:auto;
 }
}
</style>
</head>

<body>

<header>

<div class="top">

<div class="brand">
TicBull <span>Academy</span>
</div>

<div class="sub">
Board → Class/Stream → Subjects → Teacher → AI Chat Room
</div>

<div class="search">
<input id="search"
placeholder="Search board, class, stream, NEET, JEE, UPSC...">
</div>

</div>

<div class="tabs">

<button class="tab active" data-type="school">
🏫 School Boards
</button>

<button class="tab" data-type="competitive">
🎯 Competitive Exams
</button>

</div>

<div class="filters" id="filters"></div>

</header>

<main>

<div class="count" id="count"></div>

<div class="grid" id="grid"></div>

</main>


<div class="modal" id="modal">

<div class="box">

<button class="close" onclick="closeModal()">×</button>

<h2 id="modalTitle"></h2>

<div class="crumb" id="modalCrumb"></div>

<div class="notice" id="modalNotice"></div>

<div id="subjects"></div>

<button class="buybig" onclick="buyCurrent()">
BUY NOW — ₹<span id="modalPrice"></span>
</button>

<div class="note">
Demo checkout button. Payment gateway/backend ko baad mein
buy() function ke andar connect kar sakte ho.
</div>

</div>

</div>

========================================================= */

let batches=[];

BOARDS.forEach(board=>{

 for(let cls of [9,10]){

  batches.push({
   type:"school",
   category:board.region,
   board:board.name,
   title:`${board.name} — Class ${cls}`,
   stream:"General",
   price:149,
   subjects:CLASS_9_10
  });

 }

 for(let cls of [11,12]){

  const streams=[
   ["Science — PCMB",SCIENCE_PCMB],
   ["Science — PCB",SCIENCE_PCB],
   ["Science — PCM",SCIENCE_PCM],
   ["Commerce",COMMERCE],
   ["Arts / Humanities",ARTS]
  ];

  streams.forEach(([stream,subjects])=>{

   batches.push({
    type:"school",
    category:board.region,
    board:board.name,
    title:`${board.name} — Class ${cls}`,
    stream:stream,
    price:199,
    subjects:subjects
   });

  });

 }

});


COMPETITIVE.forEach(x=>{

 batches.push({
  ...x,
  type:"competitive",
  category:x.exam
 });

});


let mode="school";
let selectedFilter="All";
let current=null;


/* =========================================================
   TEACHER
========================================================= */

function teacher(index){

 return TEACHERS[index % TEACHERS.length];

}


/* =========================================================
   FILTERS
========================================================= */

function filters(){

 const el=document.getElementById("filters");

 let list=[];

 if(mode==="school"){

  list=[
   "All",
   "National",
   "Bihar",
   "Uttar Pradesh",
   "Rajasthan",
   "Maharashtra",
   "Gujarat",
   "West Bengal",
   "Madhya Pradesh",
   "Karnataka",
   "Tamil Nadu",
   "Kerala",
   "Telangana",
   "Andhra Pradesh",
   "Other"
  ];

 }else{

  list=[
   "All",
   "NEET",
   "JEE",
   "CUET",
   "UPSC",
   "NDA",
   "SSC",
   "Banking",
   "Railway",
   "Law",
   "CA",
   "CMA",
   "CS",
   "Design",
   "Management",
   "UG",
   "NET",
   "Engineering"
  ];

 }

 el.innerHTML=list.map(x=>`

 <button class="filter ${x===selectedFilter?'active':''}"
 onclick="setFilter('${x}')">
 ${x}
 </button>

 `).join("");

}


function setFilter(x){

 selectedFilter=x;

 filters();

 render();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

 const q=document.getElementById("search").value.toLowerCase().trim();

 let data=batches.filter(x=>x.type===mode);

 if(selectedFilter!=="All"){

  if(mode==="school"){

   if(selectedFilter==="Other"){

    data=data.filter(x=>
     ![
      "National",
      "Bihar",
      "Uttar Pradesh",
      "Rajasthan",
      "Maharashtra",
      "Gujarat",
      "West Bengal",
      "Madhya Pradesh",
      "Karnataka",
      "Tamil Nadu",
      "Kerala",
      "Telangana",
      "Andhra Pradesh"
     ].includes(x.category)
    );

   }else{

    data=data.filter(x=>x.category===selectedFilter);

   }

  }else{

   data=data.filter(x=>
    x.exam===selectedFilter ||
    x.level===selectedFilter
   );

  }

 }

 if(q){

  data=data.filter(x=>{

   const str=JSON.stringify(x).toLowerCase();

   return str.includes(q);

  });

 }

 document.getElementById("count").textContent=
 `${data.length} batches available`;

 const grid=document.getElementById("grid");

 if(!data.length){

  grid.innerHTML=
   `<div class="empty">
    No batch found.<br>
    Try another board, class, stream or exam.
   </div>`;

  return;

 }

 grid.innerHTML=data.map((x,i)=>`

 <div class="card">

  <h3>${x.title}</h3>

  <div class="meta">
   ${x.board ? x.board+" • " : ""}
   ${x.stream || x.level || ""}
  </div>

  <div class="tags">

   ${(x.subjects||[]).slice(0,6).map(s=>{

    const name=Array.isArray(s)?s[0]:s;

    return `<span class="tag">${name}</span>`;

   }).join("")}

   ${(x.subjects||[]).length>6?
    `<span class="tag">+${x.subjects.length-6} more</span>`:""}

  </div>

  <div>

   <span class="price">
    ₹${x.price}
   </span>

   <span class="old">
    ₹${x.price*2}
   </span>

  </div>

  <div class="actions">

   <button class="btn details"
   onclick='viewBatch(${JSON.stringify(x).replace(/'/g,"&#39;")})'>
   VIEW SUBJECTS
   </button>

   <button class="btn buy"
   onclick='buy(${JSON.stringify(x).replace(/'/g,"&#39;")})'>
   BUY NOW
   </button>

  </div>

 </div>

 `).join("");

}


/* =========================================================
   VIEW MODAL
========================================================= */

function viewBatch(x){

 current=x;

 document.getElementById("modalTitle").textContent=x.title;

 document.getElementById("modalCrumb").textContent=
  `${x.board || x.exam || ""} → ${x.level || x.stream || ""} → Subjects`;

 document.getElementById("modalPrice").textContent=x.price;

 document.getElementById("modalNotice").textContent=
  "Subjects shown here are learning modules for this batch. Official board/exam syllabus and pattern can change, so verify the latest official notification before publishing the final academic mapping.";

 document.getElementById("subjects").innerHTML=
 (x.subjects||[]).map((s,i)=>{

  const pair=Array.isArray(s)?s:[s,"📚"];

  return `

  <div class="subject">

   <div class="icon">
    ${pair[1]}
   </div>

   <div>

    <div class="sname">
     ${pair[0]}
    </div>

    <div class="teacher">
     👨‍🏫 ${teacher(i)}
    </div>

   </div>

   <button
    class="chat"
    onclick="chat('${String(pair[0]).replaceAll("'","\\'")}')">
    CHAT
   </button>

  </div>

  `;

 }).join("");

 document.getElementById("modal").classList.add("show");

}


function closeModal(){

 document.getElementById("modal").classList.remove("show");

}


/* =========================================================
   BUY
========================================================= */

function buy(x){

 current=x;

 alert(
  `Selected Batch: ${x.title}\n`+
  `Price: ₹${x.price}\n\n`+
  `Payment gateway ko buy() function ke andar connect karo.`
 );

}


function buyCurrent(){

 if(current){

  buy(current);

 }

}


/* =========================================================
   AI CHAT
========================================================= */

function chat(subject){

 alert(
  `AI CHAT ROOM\n\n`+
  `Subject: ${subject}\n\n`+
  `Yahan tum apna AI API / backend connect kar sakte ho.`
 );

}


/* =========================================================
   EVENTS
========================================================= */

document
.getElementById("search")
.addEventListener("input",render);


document
.querySelectorAll(".tab")
.forEach(t=>{

 t.addEventListener("click",()=>{

  document
  .querySelectorAll(".tab")
  .forEach(a=>a.classList.remove("active"));

  t.classList.add("active");

  mode=t.dataset.type;

  selectedFilter="All";

  filters();

  render();

 });

});


document
.getElementById("modal")
.addEventListener("click",e=>{

 if(e.target.id==="modal"){

  closeModal();

 }

});


filters();

render();

</script>
