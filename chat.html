<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TicBull Academy — Teacher Chat</title>

<script src="global.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root { 
    --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.95); --accent-color: #2563eb; --accent-glow: rgba(37, 99, 235, 0.45); 
    --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: rgba(255, 255, 255, 0.12); 
    --success-color: #10b981; --gold-color: #f59e0b; --input-bg: #0f172a; --chat-user: #2563eb; --chat-ai: #1e293b;
}
body.light-theme { 
    --bg-color: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; 
    --border-color: #cbd5e1; --input-bg: #ffffff; --chat-user: #2563eb; --chat-ai: #f1f5f9;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: #000; display: flex; justify-content: center; height: 100dvh; overflow: hidden; }

.app-container { width: 100%; max-width: 600px; height: 100dvh; background: var(--bg-color); display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.8); }

#custom-toast { position: absolute; top: -100px; left: 50%; transform: translateX(-50%); background: var(--card-bg); color: var(--text-main); border: 1px solid var(--accent-color); padding: 12px 24px; border-radius: 12px; z-index: 10000; display: flex; align-items: center; gap: 12px; font-size: 13.5px; font-weight: 600; transition: top 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
#custom-toast.show { top: 20px; }

/* HEADER */
.chat-header { display:flex; align-items:center; justify-content:space-between; padding:15px 20px; background: var(--bg-color); border-bottom: 1px solid var(--border-color); z-index: 50; flex-shrink: 0;}
.header-left { display: flex; align-items: center; gap: 12px; }
.back-btn { color: var(--text-main); font-size: 20px; cursor: pointer; background: transparent; border: none; padding-right: 5px; }
.teacher-avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent-color); object-fit: cover; background: var(--input-bg); }
.teacher-info { display: flex; flex-direction: column; }
.teacher-name { font-size: 16px; font-weight: 800; color: var(--text-main); }
.teacher-subject { font-size: 11.5px; color: var(--success-color); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.online-dot { width: 8px; height: 8px; background: var(--success-color); border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--success-color); }
.menu-btn { color: var(--text-main); font-size: 20px; background: transparent; border: none; cursor: pointer; padding: 5px 10px; transition: 0.2s; border-radius: 50%;}

/* CHAT AREA */
.chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
.chat-bubble { max-width: 85%; padding: 14px 18px; border-radius: 22px; font-size: 14.5px; line-height: 1.5; word-wrap: break-word; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.1); animation: popIn 0.3s ease; }
@keyframes popIn { 0% { opacity:0; transform: translateY(10px); } 100% { opacity:1; transform: translateY(0); } }

.chat-user { background: var(--chat-user); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.chat-ai { background: var(--chat-ai); color: var(--text-main); align-self: flex-start; border-top-left-radius: 4px; border: 1px solid var(--border-color); display: flex; gap: 12px; }
body.light-theme .chat-ai { color: #0f172a; border: none; }

.ai-avatar-small { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; margin-top: 2px; border: 1px solid var(--accent-color);}
.chat-image { max-width: 100%; border-radius: 12px; margin-top: 10px; }

/* INPUT AREA */
.input-wrapper { background: var(--bg-color); padding: 15px 20px; border-top: 1px solid var(--border-color); z-index: 50; flex-shrink: 0; padding-bottom: max(15px, env(safe-area-inset-bottom)); }
.input-area { display: flex; align-items: flex-end; gap: 10px; }
.plus-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
.plus-btn:disabled { opacity: 0.5; pointer-events: none; }

.input-box { flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 24px; display: flex; align-items: center; padding: 5px 15px; transition: 0.3s;}
.chat-input { width: 100%; background: transparent; border: none; color: var(--text-main); font-size: 14.5px; padding: 10px 0; outline: none; max-height: 100px; resize: none; overflow-y: auto; }
.attach-btn { color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 5px; }
.send-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--accent-color); color: #fff; border: none; font-size: 16px; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 4px 15px var(--accent-glow); transition: 0.2s;}

/* MULTI-ATTACHMENT PREVIEW */
.image-preview-container { display: none; padding: 10px 20px; background: var(--card-bg); border-radius: 16px; margin: 0 20px 10px 20px; border: 1px solid var(--border-color); gap: 15px; overflow-x: auto; }
.att-box { position: relative; flex-shrink: 0; width: 60px; height: 60px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; background: var(--input-bg); }
.att-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
.remove-att { position: absolute; top: -8px; right: -8px; color: #ef4444; background: #fff; border-radius: 50%; font-size: 18px; cursor: pointer; }

/* TYPING INDICATOR */
.typing-indicator { padding: 16px 20px; background: var(--chat-ai); border-radius: 22px; border-top-left-radius: 4px; align-self: flex-start; border: 1px solid var(--border-color); gap: 6px; align-items: center; display: flex;}
.dot { width: 8px; height: 8px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
.dot:nth-child(1) { animation-delay: -0.32s; }
.dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); background: var(--accent-color);} }

/* DRAWER */
.drawer-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; display: none; opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(2px);}
.drawer-overlay.show { display: block; opacity: 1; }
.history-drawer { position: absolute; top: 0; left: -100%; width: 85%; max-width: 340px; height: 100dvh; background: var(--card-bg); border-right: 1px solid var(--border-color); z-index: 2001; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
.history-drawer.open { left: 0; }
.drawer-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
.drawer-header h2 { font-size: 18px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
.drawer-close { background: transparent; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; transition: 0.2s; }
.drawer-content { flex: 1; overflow-y: auto; padding: 10px 15px; }

.new-chat-btn { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: transparent; border: none; border-radius: 20px; color: var(--text-main); font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.2s; margin-bottom: 25px; width: fit-content; }
.recent-title { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 10px; padding-left: 10px; }
.history-list { display: flex; flex-direction: column; gap: 4px; }
.history-row { display: flex; align-items: center; justify-content: space-between; border-radius: 12px; transition: 0.2s; padding-right: 8px;}
.history-row.active { background: rgba(37,99,235,0.1); }
.history-item { flex: 1; padding: 12px 14px; color: var(--text-main); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; overflow: hidden; }
.history-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.delete-chat-btn { background: transparent; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; padding: 8px; border-radius: 50%; transition: 0.2s; opacity: 0.6;}
.delete-chat-btn:hover { color: #ef4444; opacity: 1;}

.shortcut-menu { position: absolute; bottom: 85px; left: 20px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 10px; display: none; flex-direction: column; gap: 5px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); z-index: 100; }
.shortcut-menu.show { display: flex; }
.short-item { padding: 12px 16px; color: var(--text-main); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 14px; }
</style>
</head>
<body>

<div class="app-container">
    <div id="custom-toast"><i class="fa-solid fa-circle-check toast-icon success"></i> <span id="toast-message">Notification</span></div>

    <div class="chat-header">
        <div class="header-left">
            <button class="back-btn" onclick="window.history.back()"><i class="fa-solid fa-arrow-left"></i></button>
            <img src="" id="teacherAvatar" class="teacher-avatar">
            <div class="teacher-info">
                <div class="teacher-name" id="teacherName">Loading...</div>
                <div class="teacher-subject"><span class="online-dot"></span> <span id="subjectName">AI Doubt Solver</span></div>
            </div>
        </div>
        <button class="menu-btn" onclick="openHistoryDrawer()"><i class="fa-solid fa-ellipsis-vertical"></i></button>
    </div>

    <div class="chat-area" id="chatBox"></div>

    <div class="image-preview-container" id="imagePreviewContainer"><div id="attList" style="display:flex; gap:10px;"></div></div>

    <div class="input-wrapper">
        <div class="shortcut-menu" id="shortcutMenu">
            <div class="short-item" onclick="sendShortcut('short')"><i class="fa-solid fa-bolt" style="color:#f59e0b; width:20px;"></i> Short Notes</div>
            <div class="short-item" onclick="sendShortcut('image')"><i class="fa-solid fa-image" style="color:#8b5cf6; width:20px;"></i> Image Generate</div>
        </div>
        <div class="input-area">
            <button class="plus-btn" id="plusBtn" onclick="toggleShortcutMenu(event)"><i class="fa-solid fa-plus"></i></button>
            <div class="input-box">
                <textarea class="chat-input" id="promptInput" placeholder="Ask your doubt here..." rows="1" oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                <label for="fileInput" id="attachLabel"><i class="fa-solid fa-paperclip attach-btn"></i></label>
                <input type="file" id="fileInput" accept="image/*, application/pdf" multiple style="display:none;" onchange="handleFileUpload(event)">
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="drawer-overlay" id="historyOverlay" onclick="closeHistoryDrawer()"></div>
    <div class="history-drawer" id="historyDrawer">
        <div class="drawer-header"><h2>TicBull AI</h2><button class="drawer-close" onclick="closeHistoryDrawer()"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="drawer-content">
            <button class="new-chat-btn" onclick="startNewChat()"><i class="fa-solid fa-pen-to-square"></i> New chat</button>
            <div class="recent-title">Recent</div>
            <div class="history-list" id="historyListUI"></div>
        </div>
    </div>
</div>

<script>
const fNames = ["Priya", "Neha", "Riya", "Kavya", "Ananya", "Sneha"];
const mNames = ["Aarav", "Aditya", "Kabir", "Rohan", "Rahul", "Varun"];
const lastNames = ["Sharma", "Gupta", "Verma", "Yadav", "Singh"];
const FEMALE_AVATAR = "https://raw.githubusercontent.com/yuviyadav16/ticbull-academy/main/11723.png";
const MALE_AVATAR = "https://raw.githubusercontent.com/yuviyadav16/ticbull-academy/main/11708.png";

function getTeacherDetails(subjectName) {
    let hash = 0; for (let i = 0; i < subjectName.length; i++) { hash = subjectName.charCodeAt(i) + ((hash << 5) - hash); }
    const absHash = Math.abs(hash);
    const isFemale = absHash % 2 === 0;
    const fName = isFemale ? fNames[absHash % fNames.length] : mNames[absHash % mNames.length];
    const lName = lastNames[Math.abs(hash * 3) % lastNames.length];
    return { name: `Prof. ${fName} ${lName}`, avatar: isFemale ? FEMALE_AVATAR : MALE_AVATAR, gender: isFemale ? 'Female' : 'Male' };
}

let activeSubject = sessionStorage.getItem('tb_active_subject') || "General Chat";
let activeBatch = sessionStorage.getItem('tb_active_batch') || "General Batch";
let studentName = localStorage.getItem('ticbull_name') || "Student";
let studentEmail = localStorage.getItem('ticbull_email');
let sessionToken = localStorage.getItem('ticbull_token');

let cleanBatch = activeBatch.replace(/[^a-zA-Z0-9]/g, '');
let cleanSubject = activeSubject.replace(/[^a-zA-Z0-9]/g, '');
let sessionPrefix = `chat_${cleanBatch}_${cleanSubject}_`;

let currentSessionId = localStorage.getItem(`tb_last_session_${cleanBatch}_${cleanSubject}`);
if (!currentSessionId) {
    currentSessionId = sessionPrefix + Date.now();
    localStorage.setItem(`tb_last_session_${cleanBatch}_${cleanSubject}`, currentSessionId);
}
let chatTitle = localStorage.getItem(`${currentSessionId}_title`) || `${activeSubject} Thread`;
let teacher = getTeacherDetails(activeSubject);
let currentAttachments = []; 

function getGreeting() {
    return `<strong style="display:block; margin-bottom:4px; font-size:13px;">${teacher.name}</strong>Haan ${studentName.split(" ")[0]}, batao aaj kaun sa doubt clear karna hai?`;
}

window.addEventListener('DOMContentLoaded', () => {
    document.documentElement.style.setProperty('--accent-color', localStorage.getItem('tb_theme_color') || '#2563eb');
    document.getElementById('teacherName').innerText = teacher.name;
    document.getElementById('teacherAvatar').src = teacher.avatar;
    document.getElementById('subjectName').innerText = activeSubject;
    loadChatHistory();
});

function showToast(msg, type='success') {
    const toast = document.getElementById('custom-toast');
    toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check toast-icon success' : 'fa-circle-exclamation toast-icon error'}"></i> <span>${msg}</span>`;
    toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000);
}

function toggleShortcutMenu(e) { e.stopPropagation(); document.getElementById('shortcutMenu').classList.toggle('show'); }
function sendShortcut(action) {
    const input = document.getElementById('promptInput');
    if(action === 'short') input.value = "Please provide short notes on: ";
    if(action === 'image') input.value = "Describe an educational image prompt for: ";
    input.focus(); document.getElementById('shortcutMenu').classList.remove('show');
}

function openHistoryDrawer() { document.getElementById('historyOverlay').classList.add('show'); document.getElementById('historyDrawer').classList.add('open'); populateHistoryDrawer(); }
function closeHistoryDrawer() { document.getElementById('historyDrawer').classList.remove('open'); document.getElementById('historyOverlay').classList.remove('show'); }

function populateHistoryDrawer() {
    const listUI = document.getElementById('historyListUI'); listUI.innerHTML = "";
    let sessions = [];
    for(let i=0; i<localStorage.length; i++) {
        let key = localStorage.key(i);
        if(key.startsWith(sessionPrefix) && !key.endsWith('_title')) {
            sessions.push({ id: key, title: localStorage.getItem(`${key}_title`) || "Saved Chat", time: parseInt(key.split('_').pop()) });
        }
    }
    sessions.sort((a,b) => b.time - a.time);
    sessions.forEach(s => {
        let isActive = (s.id === currentSessionId) ? "active" : "";
        listUI.innerHTML += `<div class="history-row ${isActive}"><div class="history-item" onclick="switchChat('${s.id}')"><i class="fa-regular fa-message"></i> <span class="history-title">${s.title}</span></div><button class="delete-chat-btn" onclick="deleteSession('${s.id}', event)"><i class="fa-solid fa-trash"></i></button></div>`;
    });
}
function switchChat(key) { currentSessionId = key; localStorage.setItem(`tb_last_session_${cleanBatch}_${cleanSubject}`, currentSessionId); loadChatHistory(); closeHistoryDrawer(); }
function startNewChat() { currentSessionId = sessionPrefix + Date.now(); localStorage.setItem(`tb_last_session_${cleanBatch}_${cleanSubject}`, currentSessionId); document.getElementById('chatBox').innerHTML = `<div class="chat-bubble chat-ai"><img src="${teacher.avatar}" class="ai-avatar-small"><div>${getGreeting()}</div></div>`; saveChatHistory(); closeHistoryDrawer(); }
function deleteSession(id, e) { e.stopPropagation(); localStorage.removeItem(id); localStorage.removeItem(`${id}_title`); if(id === currentSessionId) startNewChat(); populateHistoryDrawer(); }

// 🔥 THE IMAGE COMPRESSION FIX 🔥 (Prevents Vercel Timeout)
function handleFileUpload(event) {
    const files = event.target.files;
    if(!files || files.length === 0) return;
    for(let file of files) {
        if(file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxW = 1000, maxH = 1000;
                    let w = img.width, h = img.height;
                    if(w > maxW || h > maxH) { if(w > h) { h = Math.round((h*maxW)/w); w = maxW; } else { w = Math.round((w*maxH)/h); h = maxH; } }
                    canvas.width = w; canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    currentAttachments.push({ data: canvas.toDataURL('image/jpeg', 0.7), isPdf: false, name: file.name });
                    renderAttachments();
                }
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        } else {
            const reader = new FileReader();
            reader.onload = function(e) { currentAttachments.push({ data: e.target.result, isPdf: true, name: file.name }); renderAttachments(); };
            reader.readAsDataURL(file);
        }
    }
}

function renderAttachments() {
    const container = document.getElementById('imagePreviewContainer');
    const list = document.getElementById('attList');
    if(currentAttachments.length === 0) { container.style.display = 'none'; return; }
    container.style.display = 'flex'; list.innerHTML = "";
    currentAttachments.forEach((att, index) => {
        let content = att.isPdf ? `<i class="fa-solid fa-file-pdf" style="font-size:28px; color:#ef4444;"></i>` : `<img src="${att.data}">`;
        list.innerHTML += `<div class="att-box">${content}<i class="fa-solid fa-circle-xmark remove-att" onclick="currentAttachments.splice(${index}, 1); renderAttachments();"></i></div>`;
    });
}

function scrollToBottom() { const chatBox = document.getElementById('chatBox'); chatBox.scrollTop = chatBox.scrollHeight; }

function formatMarkdown(text) {
    let html = text.replace(/!\[.*?\]\((.*?)\)/g, '<img src="$1" style="width:100%; border-radius:12px; margin-top:10px; box-shadow:0 4px 10px rgba(0,0,0,0.2);">');
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong style="color:var(--accent-color);">$1</strong>');
    return html.replace(/\n/g, '<br>');
}

function appendMessage(sender, text, attachments=[]) {
    const chatBox = document.getElementById('chatBox');
    const div = document.createElement('div');
    let attHTML = attachments.map(att => att.isPdf ? `<div style="background:var(--input-bg); border:1px solid var(--border-color); padding:10px; border-radius:10px; margin-top:10px;"><i class="fa-solid fa-file-pdf" style="color:#ef4444;"></i> ${att.name||'Doc'}</div>` : `<img src="${att.data}" class="chat-image">`).join('');
    
    if(sender === 'user') { div.className = "chat-bubble chat-user"; div.innerHTML = `${text} ${attHTML}`; } 
    else { div.className = "chat-bubble chat-ai"; div.innerHTML = `<img src="${teacher.avatar}" class="ai-avatar-small"><div><strong style="display:block; margin-bottom:4px; font-size:13px;">${teacher.name}</strong>${formatMarkdown(text)}</div>`; }
    chatBox.appendChild(div); scrollToBottom(); saveChatHistory();
}

function sendMessage() {
    const input = document.getElementById('promptInput');
    const text = input.value.trim();
    if(!text && currentAttachments.length === 0) return;

    input.disabled = true; document.getElementById('sendBtn').disabled = true;
    const sentAttachments = [...currentAttachments];
    appendMessage('user', text, sentAttachments);
    
    // 🔥 MEMORY TRACKER: Send recent history so AI doesn't act like a robot!
    let historyArr = [];
    document.querySelectorAll('.chat-bubble').forEach(b => {
        let isUser = b.classList.contains('chat-user');
        let txt = b.innerText.replace(/Prof\..*?\n/, '').trim();
        if(txt) historyArr.push((isUser ? "Student: " : "Teacher: ") + txt);
    });
    let recentHistory = historyArr.slice(-6).join('\n'); // Yaad rakhega pichhli 6 baatein

    if(document.querySelectorAll('.chat-user').length === 1 && text) { localStorage.setItem(`${currentSessionId}_title`, text.substring(0,25)); }
    input.value = ""; currentAttachments = []; renderAttachments();

    const ti = document.createElement('div'); ti.id = 'tempTyping'; ti.className = 'typing-indicator';
    ti.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    document.getElementById('chatBox').appendChild(ti); scrollToBottom();

    fetch('/api/chat', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            prompt: text, images: sentAttachments.map(a => a.data), history: recentHistory,
            board: activeBatch, subject: activeSubject, student_name: studentName, email: studentEmail, token: sessionToken, teacher_name: teacher.name, teacher_gender: teacher.gender
        })
    }).then(res => res.json()).then(data => {
        document.getElementById('tempTyping').remove(); input.disabled = false; document.getElementById('sendBtn').disabled = false;
        if(data.success) appendMessage('ai', data.reply);
        else appendMessage('ai', "⚠️ Server overload. Please try again.");
    });
}

function saveChatHistory() { localStorage.setItem(currentSessionId, document.getElementById('chatBox').innerHTML); }
function loadChatHistory() {
    const saved = localStorage.getItem(currentSessionId);
    if(saved) { document.getElementById('chatBox').innerHTML = saved; scrollToBottom(); } 
    else { document.getElementById('chatBox').innerHTML = `<div class="chat-bubble chat-ai"><img src="${teacher.avatar}" class="ai-avatar-small"><div>${getGreeting(true)}</div></div>`; }
}
</script>
</body>
</html>
