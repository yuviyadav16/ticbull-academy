<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TicBull Academy - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK Setup -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="custom-toast"><i class="fa-solid fa-circle-check"></i><span id="toast-message">Notification</span></div>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo"><img src="./logo.png" onerror="this.src='https://raw.githubusercontent.com/yuviyadav16/ticbull-academy/main/logo.png'"></div>
        <div class="splash-title">TicBull Academy</div>
        <div class="developer-tag">Developed by MrYuviYadav</div>
    </div>

    <!-- Firebase Auth Screen -->
    <div class="auth-container">
        <div class="auth-card">
            <h2 style="font-size:22px; font-weight:800; margin-bottom:6px;">TicBull Academy</h2>
            <p style="font-size:12px; color:var(--text-muted); margin-bottom:20px;">AI Student Portal & Exam Engine</p>

            <div class="input-group">
                <i class="fa-regular fa-envelope left-icon"></i>
                <input type="email" id="email" placeholder="Student Email ID">
            </div>
            
            <div class="input-group">
                <i class="fa-solid fa-lock left-icon"></i>
                <input type="password" id="password" placeholder="Password">
            </div>

            <button class="btn-primary" id="loginBtn" onclick="handleFirebaseLogin()">SECURE LOGIN / SIGNUP</button>
            
            <div id="recaptcha-container" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        // 1. FIREBASE CONFIGURATION (Replace with your Firebase Project Keys later)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "ticbull-academy.firebaseapp.com",
            projectId: "ticbull-academy",
            storageBucket: "ticbull-academy.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 2. SPLASH SCREEN LOGIC
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 2500);
        });

        function showToast(msg) {
            const toast = document.getElementById('custom-toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 3. FIREBASE LOGIN LOGIC (Routes to batches.html upon success)
        function handleFirebaseLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if(!email || !password) {
                showToast("Please enter Email and Password");
                return;
            }

            // Simulate routing for now until you put real Firebase keys
            // In real scenario: auth.signInWithEmailAndPassword(email, password)
            showToast("Authenticating with Firebase...");
            setTimeout(() => {
                // Redirect to File 2 (Batches Screen)
                window.location.href = "batches.html";
            }, 1500);
        }
    </script>
</body>
</html>
