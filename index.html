<!-- Save as: index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicBull Academy - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.95); --accent-color: #2563eb; --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: rgba(255,255,255,0.12); --success-color: #10b981; --input-bg: #0f172a; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Auth UI */
        .auth-container { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; padding:20px; }
        .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius:24px; padding:30px 22px; width:100%; max-width:400px; text-align:center; box-shadow:0 15px 40px rgba(0,0,0,0.5); }
        .input-group { position:relative; margin-bottom:15px; }
        .input-group i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted); }
        .input-group input { width:100%; background:var(--input-bg); border:1px solid var(--border-color); color:var(--text-main); padding:14px 40px; border-radius:12px; outline:none; }
        .btn-primary { width:100%; background: var(--accent-color); color:#fff; font-weight:700; padding:14px; border:none; border-radius:12px; cursor:pointer; margin-top:10px; }
        
        /* Top Menu Button */
        .menu-btn { position:absolute; top:20px; right:20px; background:var(--card-bg); border:1px solid var(--border-color); color:#fff; padding:10px 15px; border-radius:12px; cursor:pointer; z-index:50; }

        /* Drawer Menu (Z+ Secured Area) */
        .drawer { position:fixed; top:0; left:-320px; width:320px; height:100%; background:var(--card-bg); border-right:1px solid var(--border-color); z-index:1000; transition:0.3s; padding:20px; display:flex; flex-direction:column; }
        .drawer.open { left:0; }
        .drawer-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999; display:none; }
        .drawer-item { padding:14px; color:var(--text-main); display:flex; align-items:center; gap:12px; cursor:pointer; font-weight:600; border-radius:10px; }
        .drawer-item:hover { background:rgba(255,255,255,0.1); }
        .social-links a { color:var(--text-main); font-size:20px; margin-right:15px; }
    </style>
</head>
<body>
    <button class="menu-btn" onclick="toggleDrawer()"><i class="fa-solid fa-bars"></i></button>

    <div class="auth-container">
        <div class="auth-card">
            <h2 style="margin-bottom:20px;">TicBull Academy</h2>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder="Student Email ID">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Secure Password">
            </div>
            <button class="btn-primary" onclick="login()">SECURE LOGIN</button>
        </div>
    </div>

    <!-- SIDE DRAWER -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <h3 style="margin-bottom:20px; border-bottom:1px solid #333; padding-bottom:10px;">Menu & Profile</h3>
        <div class="drawer-item"><i class="fa-solid fa-user"></i> My Profile</div>
        <div class="drawer-item"><i class="fa-solid fa-gear"></i> App Settings</div>
        
        <div style="margin-top:auto; border-top:1px solid #333; padding-top:15px;">
            <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">TicBull Support</p>
            <div class="social-links">
                <a href="#"><i class="fa-brands fa-instagram" style="color:#e1306c;"></i></a>
                <a href="#"><i class="fa-brands fa-telegram" style="color:#0088cc;"></i></a>
                <a href="#"><i class="fa-brands fa-youtube" style="color:#ff0000;"></i></a>
            </div>
        </div>
    </div>

    <script>
        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('open');
            const overlay = document.getElementById('drawerOverlay');
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        }

        function login() {
            // Here Firebase Auth will happen. On success:
            localStorage.setItem("tb_auth", "true");
            window.location.href = "batches.html";
        }
    </script>
</body>
</html>
