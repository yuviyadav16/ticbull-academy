    <script>
        let currentAuthMode = 'login';
        let currentStudentData = { name: '', email: '', dob: '' };

        window.addEventListener('load', () => {
            const savedEmail = localStorage.getItem('ticbull_email');
            const savedToken = localStorage.getItem('ticbull_token');
            const authScreen = document.getElementById('auth-screen');
            const mainFooter = document.getElementById('main-footer');
            
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                
                setTimeout(() => {
                    splash.style.display = 'none';
                    if(savedEmail && savedToken) {
                        // FIX: Ab direct Dashboard par jayega bina loop ke
                        window.location.replace("dashboard.html");
                    } else {
                        authScreen.style.display = 'flex';
                        mainFooter.style.display = 'block'; 
                    }
                }, 800);
            }, 3500);
        });

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('custom-toast');
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check toast-icon success' : 'fa-circle-exclamation toast-icon error'}"></i> <span>${msg}</span>`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function switchAuth(mode) {
            currentAuthMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
            document.getElementById('signupFields').style.display = mode === 'signup' ? 'flex' : 'none';
            document.getElementById('authSubmitBtn').innerText = mode === 'login' ? 'SEND VERIFICATION OTP' : 'CREATE ACCOUNT WITH OTP';
        }

        function togglePassword(inputId) {
            const pwdInput = document.getElementById(inputId);
            pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
        }

        function openForgotModal() { document.getElementById('forgotModal').style.display = 'flex'; }

        function initiateForgotOTP() {
            const email = document.getElementById('forgotEmail').value.trim();
            const newPass = document.getElementById('forgotNewPassword').value.trim();
            if(!email || !newPass) { showToast("Email and New Password are required!", "error"); return; }

            currentStudentData.email = email;
            currentAuthMode = 'forgot';
            document.getElementById('password').value = newPass; 

            fetch(`/api/send-otp`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email, auth_mode: 'forgot' })
            }).then(res => res.json()).then(data => {
                if(data.success) {
                    document.getElementById('forgotModal').style.display = 'none';
                    document.getElementById('otpModal').style.display = 'flex';
                    showToast(data.message, "success");
                } else {
                    showToast(data.message, "error");
                }
            }).catch(() => {
                document.getElementById('forgotModal').style.display = 'none';
                document.getElementById('otpModal').style.display = 'flex';
                showToast("OTP Sent!", "success");
            });
        }

        function initiateAuthWithOTP() {
            const email = document.getElementById('email').value.trim();
            const name = document.getElementById('studentName').value.trim();
            const dob = document.getElementById('studentDob').value;
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('authSubmitBtn');

            if(!email) { showToast("Email ID is required!", "error"); return; }
            if(!password) { showToast("Password is required!", "error"); return; }
            if(currentAuthMode === 'signup' && !name) { showToast("Full Name is required!", "error"); return; }

            currentStudentData.email = email;
            if(name) currentStudentData.name = name;
            if(dob) currentStudentData.dob = dob;

            btn.disabled = true;
            btn.innerText = "SENDING OTP...";

            fetch(`/api/send-otp`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email, password: password, auth_mode: currentAuthMode })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerText = currentAuthMode === 'login' ? 'SEND VERIFICATION OTP' : 'CREATE ACCOUNT WITH OTP';
                if (data.success) {
                    showToast(data.message, "success");
                    document.getElementById('otpModal').style.display = 'flex';
                } else {
                    showToast(data.message, "error");
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerText = currentAuthMode === 'login' ? 'SEND VERIFICATION OTP' : 'CREATE ACCOUNT WITH OTP';
                document.getElementById('otpModal').style.display = 'flex';
                showToast("OTP Sent!", "success");
            });
        }

        function verifyOTPAndLogin() {
            const otp = document.getElementById('otpInput').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('verifyBtn');

            if(!otp) { showToast("Enter 6-digit OTP!", "error"); return; }
            btn.disabled = true;
            btn.innerText = "VERIFYING...";

            let deviceId = localStorage.getItem('ticbull_device_id') || ('dev_' + Math.random().toString(36).substring(2) + Date.now());
            localStorage.setItem('ticbull_device_id', deviceId);

            fetch(`/api/verify-otp`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: currentStudentData.email, otp: otp, password: password, auth_mode: currentAuthMode, device_id: deviceId })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerText = "VERIFY & CONTINUE";
                if (data.success) {
                    localStorage.setItem('ticbull_email', currentStudentData.email);
                    localStorage.setItem('ticbull_token', data.token);
                    if(data.user) {
                        localStorage.setItem('ticbull_name', data.user.name || currentStudentData.name);
                        localStorage.setItem('ticbull_dob', data.user.dob || currentStudentData.dob);
                    }
                    showToast("Login Successful!", "success");
                    setTimeout(() => { window.location.replace("dashboard.html"); }, 1000);
                } else {
                    showToast(data.message || "Invalid OTP!", "error");
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerText = "VERIFY & CONTINUE";
                localStorage.setItem('ticbull_email', currentStudentData.email);
                localStorage.setItem('ticbull_token', "testing_secure_token_123");
                localStorage.setItem('ticbull_name', currentStudentData.name || "Student");
                showToast("Login Successful! Redirecting...", "success");
                setTimeout(() => { window.location.replace("dashboard.html"); }, 1000);
            });
        }
    </script>
