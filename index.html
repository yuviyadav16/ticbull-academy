<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TicBull Academy - Login</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK Setup -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- PURI CSS YAHIN HAI (KABHI BREAK NAHI HOGI) -->
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.95);
            --accent-color: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.45);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.12);
            --success-color: #10b981;
            --input-bg: #0f172a;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; width: 100%; background: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; overflow: hidden; }

        /* Splash Screen */
        #splash-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle at center, #0b1329 0%, #020617 100%); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; transition: opacity 0.5s ease; }
        .splash-logo { width: 105px; height: 105px; border-radius: 50%; background: #000; border: 2px solid rgba(37, 99, 235, 0.5); display:flex; justify-content:center; align-items:center; box-shadow: 0 0 35px var(--accent-glow); animation: pulseGlow 2.5s infinite alternate ease-in-out; }
        .splash-logo img { width:90%; height:90%; object-fit:contain; }
        .splash-title { margin-top:20px; font-size:26px; font-weight:800; color:#fff; }
        .developer-tag { margin-top:6px; font-size:13px; color: var(--accent-color); font-weight:700; }
        @keyframes pulseGlow { 0% { transform: scale(0.85); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 0.95; } }

        /* Auth Container */
        .auth-container { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; padding:20px; width:100%; }
        .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius:24px; padding:28px 22px; width:100%; max-width:420px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
        .brand-icon-box { width:80px; height:80px; border-radius:50%; background:#000; border:2px solid rgba(37, 99, 235, 0.4); display:flex; justify-content:center; align-items:center; margin: 0 auto 12px auto; box-shadow: 0 8px 25px rgba(0,0,0,0.6); overflow:hidden; }
        .brand-icon-box img { width:90%; height:90%; object-fit:contain; }
        
        .input-group { position:relative; margin-bottom:12px; text-align:left; }
        .input-group i.left-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:14px; }
        .input-group input { width:100%; background:var(--input-bg); border:1px solid var(--border-color); color:var(--text-main); padding:12px 40px; border-radius:12px; font-size:14px; outline:none; transition:0.3s; }
        .input-group input:focus { border-color:var(--accent-color); box-shadow: 0 0 12px var(--accent-glow); }
        
        .btn-primary { width:100%; background: var(--accent-color); color:#fff; font-weight:700; padding:13px; border:none; border-radius:12px; cursor:pointer; font-size:14px; margin-top:10px; transition: 0.2s; box-shadow:0 8px 20px var(--accent-glow); }
        .btn-primary:active { transform: scale(0.98); }

        /* Toasts */
        #custom-toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--card-bg); border: 1px solid var(--accent-color); padding: 12px 24px; border-radius: 12px; z-index: 10000; display: flex; align-items: center; gap: 12px; transition: top 0.4s; font-size:13.5px; font-weight:600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #custom-toast.show { top: 30px; }
        .toast-icon { font-size: 18px; color: var(--success-color); }
    </style>
</head>
<body>

    <!-- Notification Toast -->
    <div id="custom-toast"><i class="fa-solid fa-circle-check toast-icon"></i><span id="toast-message">Notification</span></div>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo"><img src="./logo.png" onerror="this.src='https://raw.githubusercontent.com/yuviyadav16/ticbull-academy/main/logo.png'"></div>
        <div class="splash-title">TicBull Academy</div>
        <div class="developer-tag">Developed by MrYuviYadav</div>
    </div>

    <!-- Firebase Auth Screen -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="brand-icon-box">
                <img src="./logo.png" alt="Logo" onerror="this.src='https://raw.githubusercontent.com/yuviyadav16/ticbull-academy/main/logo.png'">
            </div>
            <h2 style="font-size:22px; font-weight:800; margin-bottom:4px;">TicBull Academy</h2>
            <p style="font-size:12.5px; color:var(--text-muted); margin-bottom:20px;">AI Student Portal & Exam Engine</p>

            <div class="input-group">
                <i class="fa-regular fa-envelope left-icon"></i>
                <input type="email" id="email" placeholder="Student Email ID">
            </div>
            
            <div class="input-group">
                <i class="fa-solid fa-lock left-icon"></i>
                <input type="password" id="password" placeholder="Password">
            </div>

            <button class="btn-primary" id="loginBtn" onclick="handleFirebaseLogin()">SECURE LOGIN</button>
            
            <div id="recaptcha-container" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        // 1. FIREBASE CONFIGURATION (Replace with your keys later)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "ticbull-academy.firebaseapp.com",
            projectId: "ticbull-academy",
            storageBucket: "ticbull-academy.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        // Initialize Firebase only if keys are present, otherwise skip to prevent errors on UI
        if(firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
        }

        // 2. SPLASH SCREEN LOGIC
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 2500);
        });

        function showToast(msg) {
            const toast = document.getElementById('custom-toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 3. LOGIN LOGIC (Routes to your batches page)
        function handleFirebaseLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if(!email || !password) {
                showToast("Please enter Email and Password");
                return;
            }

            showToast("Authenticating...");
            const btn = document.getElementById('loginBtn');
            btn.innerText = "VERIFYING...";
            btn.disabled = true;

            // Redirects to your next file (batches.html) after 1.5 seconds
            setTimeout(() => {
                window.location.href = "batches.html";
            }, 1500);
        }
    </script>
</body>
</html>
